ls not only by their results, but by what their students\ncan do the day after the last exam ends.</p>\n</blockquote><p><strong>[Conclusion]</strong> Restates the position in new words and\nends with a memorable final thought, not a summary list.</p><p><em>About 400 words, five paragraphs.</em></p><h3 id=\"activities-1\">Activities</h3><ol type=\"1\">\n<li><p>Rewrite the plan above for the opposite position (\"Exams are the\nbest preparation for life\").</p></li>\n<li><p>Write the full essay from your plan, untimed. Then compare its\nstructure with the model, paragraph by paragraph.</p></li>\n<li><p>Highlight every linking word in the model essay (Yet, although,\nalso, But, then). Count how many you used in yours.</p></li>\n</ol>"}, {"id": "s5l3", "title": "Lesson 3 (Weeks 11 to 12): Part A tools", "html": "<h3 id=\"learn-four-kinds-of-example\">Learn: four kinds of example</h3><p>Examples turn claims into arguments. You can't look anything up in\nthe test, so build a store of examples from your daily reading.</p><table>\n<colgroup>\n<col style=\"width: 20%\"/>\n<col style=\"width: 43%\"/>\n<col style=\"width: 35%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type</th>\n<th>Example</th>\n<th>Tip</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Personal experience</td>\n<td>\"When my workplace moved to four-day weeks…\"</td>\n<td>Keep it short and tie it to the point</td>\n</tr>\n<tr class=\"even\">\n<td>Observation of the world</td>\n<td>\"Most new housing estates are built far from train lines…\"</td>\n<td>Only claim what is widely known</td>\n</tr>\n<tr class=\"odd\">\n<td>Hypothetical</td>\n<td>\"Imagine a student who…\"</td>\n<td>Good when a real case doesn't come to mind</td>\n</tr>\n<tr class=\"even\">\n<td>General knowledge or news</td>\n<td>\"During the pandemic, many offices moved online within weeks…\"</td>\n<td>Avoid precise statistics unless you are sure of them</td>\n</tr>\n</tbody>\n</table><h3 id=\"learn-handling-the-other-side\">Learn: handling the other\nside</h3><p>A fair counter-argument earns marks; a straw man loses them. Use this\nshape:</p><ol type=\"1\">\n<li><p><strong>Concede:</strong> \"Supporters of X argue, reasonably,\nthat…\"</p></li>\n<li><p><strong>Limit:</strong> \"This is true in some cases,\nbut…\"</p></li>\n<li><p><strong>Return:</strong> \"…which is why, on balance, …\"</p></li>\n</ol><h3 id=\"learn-linking-words-by-job\">Learn: linking words by job</h3><table>\n<colgroup>\n<col style=\"width: 28%\"/>\n<col style=\"width: 71%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Job</th>\n<th>Words</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Add</td>\n<td>moreover, furthermore, also, in addition</td>\n</tr>\n<tr class=\"even\">\n<td>Contrast</td>\n<td>however, yet, on the other hand, whereas, by contrast</td>\n</tr>\n<tr class=\"odd\">\n<td>Concede</td>\n<td>admittedly, although, granted, it is true that</td>\n</tr>\n<tr class=\"even\">\n<td>Cause and effect</td>\n<td>therefore, as a result, consequently, because of this</td>\n</tr>\n<tr class=\"odd\">\n<td>Example</td>\n<td>for instance, for example, consider</td>\n</tr>\n<tr class=\"even\">\n<td>Conclude</td>\n<td>ultimately, in the end, on balance</td>\n</tr>\n</tbody>\n</table><h3 id=\"learn-introductions-that-work\">Learn: introductions that\nwork</h3><p>A strong introduction has three moves in 3 or 4 sentences:\n<strong>hook</strong> (a concrete image, a question, or a surprising\nfact you're sure of), <strong>issue</strong> (restate the prompt in your\nown words), <strong>position</strong> (your view, with any\nqualification).</p><p><strong>Weak:</strong> <em>In today's society, technology is a very\nimportant issue that affects everyone in many ways. This essay will\ndiscuss whether technology is good or bad.</em></p><p><strong>Strong:</strong> <em>My grandmother wrote letters that took a\nweek to arrive; my nephew sends forty messages before breakfast.\nTechnology has made us easier to reach, but whether it has made us\ncloser is another question. I believe it has widened our circles while\nthinning our closest bonds.</em></p><h3 id=\"activities-2\">Activities</h3><ol type=\"1\">\n<li><p>For each prompt, write a 5-minute plan (position, three reasons\nwith examples, counter-argument): a. \"Public transport should be free.\"\nb. \"Young people today have it easier than their parents did.\" c.\n\"Working from home is better for everyone.\"</p></li>\n<li><p>Rewrite this weak introduction using hook, issue and position:\n<em>\"Education is very important. There are many different opinions\nabout it. In this essay I will talk about both sides.\"</em></p></li>\n<li><p>Write a counter-argument paragraph (concede, limit, return) for\nplan 1a.</p></li>\n<li><p>Write a full essay from plan 1b in 30 minutes, then self-mark it\nwith the Lesson 1 table.</p></li>\n</ol>"}, {"id": "s5l4", "title": "Lesson 4 (Weeks 13 to 16): The Part B reflective essay", "html": "<h3 id=\"learn-1\">Learn</h3><p>Part B prompts are personal and less formal (friendship, confidence,\nchange, belonging). Markers still want <strong>thought</strong>: a story\nalone is not enough. The experience must lead somewhere.</p><p><strong>The reflective arc:</strong></p><ol type=\"1\">\n<li><p><strong>Then:</strong> what you once believed or how things were\n(open with a concrete moment).</p></li>\n<li><p><strong>Event:</strong> what happened, told with a few specific\ndetails.</p></li>\n<li><p><strong>Now:</strong> what changed in you.</p></li>\n<li><p><strong>Meaning:</strong> what this shows about the prompt.\nAgree, disagree, or add a condition.</p></li>\n</ol><p><strong>Style for Part B:</strong> first person (I) is expected. Use\nsome concrete sensory detail. Keep the language natural, but avoid slang\nand text-speak. Varied sentence length matters even more here.</p><p><strong>Plan in 5 minutes:</strong> choose the prompt that reminds\nyou of a real moment, then jot down the moment, three details, and the\none-sentence insight.</p><h3 id=\"model-essay-written-for-this-course-1\">Model essay (written for\nthis course)</h3><p><strong>Prompt:</strong> <em>\"Confidence is not something you have;\nit is something you do.\"</em></p><blockquote>\n<p>For most of my twenties I believed confidence was a kind of weather.\nSome people walked around in sunshine; I had been born under cloud. I\nwatched colleagues speak up in meetings and assumed they felt no fear,\nand that the gap between us was simply a fact.</p>\n</blockquote><p><strong>[Then]</strong> A metaphor (weather) gives the essay an image\nto return to at the end.</p><blockquote>\n<p>What changed my mind was a small and unglamorous job. At twenty-six I\nwas asked to run the weekly safety briefing at the depot where I worked,\nbecause the supervisor was on leave. I said yes mostly because I could\nnot think of a way to say no. The first briefing was dreadful. I read\nfrom my notes, lost my place twice and finished in four minutes. Nobody\nlaughed, but nobody listened either.</p>\n</blockquote><p><strong>[Event]</strong> Specific, honest details. The short\nsentences create pace and a touch of humour.</p><blockquote>\n<p>By the sixth week something had shifted. I had not become braver; I\nhad become practised. I knew which jokes landed, which crew members\nwould ask questions, and how long a pause could last before it became\nuncomfortable. The fear was still there before each briefing, but it had\nshrunk to a size I could carry.</p>\n</blockquote><p><strong>[Now]</strong> The key insight is phrased as a contrast: \"not\nbraver… practised\".</p><blockquote>\n<p>Looking back, I think the statement is mostly right, with one\ncaution. Confidence does grow from doing things, but only if the doing\nis allowed to be imperfect. Had my first briefing been treated as a test\nI had failed, I doubt I would have stood up a second time. The people\nwho seem naturally confident are often just people who were given room\nto be bad at something for a while.</p>\n</blockquote><p><strong>[Meaning]</strong> Engages directly with the prompt and adds\na condition. This is where \"thought and content\" marks are won.</p><blockquote>\n<p>I still feel the cloud sometimes. The difference is that I no longer\nwait for it to clear before I speak.</p>\n</blockquote><p><strong>[Close]</strong> Returns to the opening image, so the essay\nfeels complete.</p><p><em>About 340 words.</em></p><h3 id=\"activities-3\">Activities</h3><ol type=\"1\">\n<li><p>For each prompt, note a real moment from your life, three\ndetails, and a one-sentence insight: a. \"A true friend is someone who\ntells you what you don't want to hear.\" b. \"We learn more from failure\nthan from success.\" c. \"Home is a feeling, not a place.\"</p></li>\n<li><p>Write prompt 1b as a full essay using the reflective arc\n(untimed).</p></li>\n<li><p>Check your essay: does the \"Meaning\" paragraph respond to the\nprompt's exact words? Does your ending link back to your\nopening?</p></li>\n</ol>"}, {"id": "s5l5", "title": "Lesson 5 (Weeks 15 to 17): Polishing", "html": "<h3 id=\"learn-the-ten-errors-that-cost-the-most\">Learn: the ten errors\nthat cost the most</h3><table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 49%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Error</th>\n<th>Fix</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Comma splice (\"It was late, we left.\")</td>\n<td>Full stop, semicolon, or a joining word</td>\n</tr>\n<tr class=\"even\">\n<td>Fragment (\"Because it was late.\")</td>\n<td>Attach it to a full sentence</td>\n</tr>\n<tr class=\"odd\">\n<td>it's / its, there / their / they're, your / you're</td>\n<td>Check every one in the proofread</td>\n</tr>\n<tr class=\"even\">\n<td>Wrong apostrophe in plurals (\"car's\" for cars)</td>\n<td>No apostrophe for plain plurals</td>\n</tr>\n<tr class=\"odd\">\n<td>Vague words (things, stuff, good, bad, very)</td>\n<td>Name the actual thing or quality</td>\n</tr>\n<tr class=\"even\">\n<td>Repeating the same word</td>\n<td>Use a synonym or restructure the sentence</td>\n</tr>\n<tr class=\"odd\">\n<td>\"In today's society\" and other clichés</td>\n<td>Start with something concrete</td>\n</tr>\n<tr class=\"even\">\n<td>Switching tense mid-story</td>\n<td>Pick past or present and keep it</td>\n</tr>\n<tr class=\"odd\">\n<td>Switching person (I → you → we)</td>\n<td>Stay consistent</td>\n</tr>\n<tr class=\"even\">\n<td>Overly long sentences (40+ words)</td>\n<td>Split them</td>\n</tr>\n</tbody>\n</table><h3 id=\"before-and-after\">Before and after</h3><p><strong>Before:</strong></p><blockquote>\n<p>In today's society social media is a very big thing and it effects\neveryone, alot of people use it everyday and there not always aware of\nthe bad things. Its good for some things like keeping in touch but it\nhas alot of bad stuff too.</p>\n</blockquote><p><strong>After:</strong></p><blockquote>\n<p>Social media now shapes how most of us spend our evenings. It keeps\ndistant friends in touch, but many users don't notice what it costs\nthem: hours of sleep, attention and, for some, confidence.</p>\n</blockquote><p><strong>What changed:</strong> the cliché opening is gone; \"effects\"\nbecame the right word (or was cut); \"alot\" (should be \"a lot\"),\n\"everyday\" (\"every day\"), \"there\" (\"they're\") and \"Its\" (\"It's\") are\nfixed or removed; the comma splice is gone; \"bad stuff\" is replaced with\nspecific costs.</p><h3 id=\"learn-the-3-minute-proofread\">Learn: the 3-minute proofread</h3><p>In the test, leave 3 minutes per essay and check in this order:</p><ol type=\"1\">\n<li><p><strong>Prompt:</strong> do the introduction and conclusion\nanswer it?</p></li>\n<li><p><strong>Sentences:</strong> read the essay backwards, sentence by\nsentence, looking for fragments and splices.</p></li>\n<li><p><strong>Hotspots:</strong> scan for it's/its, there/their,\napostrophes and capitals.</p></li>\n</ol><h3 id=\"activities-4\">Activities</h3><p>Rewrite each passage to fix all errors and vague wording.</p><ol type=\"1\">\n<li><p><em>Friendship is a very important thing in life. My friend Sarah\nshe always helps me, when I was sad she came over. Friends are good\nbecause they help you and you help them.</em></p></li>\n<li><p><em>Their are many reasons why the goverment should spend more on\npublic transport, its cheaper for people and its better for the\nenviroment. Also less cars.</em></p></li>\n<li><p>Take your last timed essay. Apply the 3-minute proofread and\ncount the errors you find. Track the count each week; aim to reach three\nor fewer by Week 21.</p></li>\n</ol><details class=\"answers\"><summary>Show answers</summary><p><strong>Q1</strong> <em>Good friends show up when it matters. When I\nwas struggling after losing my job, my friend Sarah came over with\ndinner and stayed until midnight. That kind of care is only possible in\na friendship where both people give.</em> · <strong>Q2</strong>\n<em>There are strong reasons for the government to invest more in public\ntransport. It is cheaper for households than running a car, and it is\nbetter for the environment because fewer cars on the road means less\npollution.</em></p></details>"}, {"id": "s5l6", "title": "Lesson 6 (Weeks 17 to 24): Prompt bank and timed practice", "html": "<h3 id=\"prompt-bank-written-for-this-course-in-the-stat-style\">Prompt\nbank (written for this course, in the STAT style)</h3><p>In the test, each part offers four comments on a theme. Practise by\nchoosing <strong>one from a group of four</strong> in under a minute, as\nyou will on the day.</p><p><strong>Part A: public issues (argue a view)</strong></p><table>\n<colgroup>\n<col style=\"width: 39%\"/>\n<col style=\"width: 60%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Theme</th>\n<th>Prompts</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Education</td>\n<td>1. \"University should be free for everyone.\" 2. \"Schools should\nteach financial skills before algebra.\" 3. \"Homework does more harm than\ngood.\" 4. \"The best teachers are those who make students\nuncomfortable.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Work and technology</td>\n<td>5. \"Automation will create more jobs than it destroys.\" 6. \"A\nfour-day working week should be standard.\" 7. \"Smartphones should be\nbanned in schools.\" 8. \"We trust technology more than we trust each\nother.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Community and environment</td>\n<td>9. \"Cities should ban cars from their centres.\" 10. \"Local\ncommunities matter more than global ones.\" 11. \"Individuals can't solve\nenvironmental problems; only governments can.\" 12. \"Sport brings\ncommunities together more than anything else.\"</td>\n</tr>\n</tbody>\n</table><p><strong>Part B: personal reflection</strong></p><table>\n<colgroup>\n<col style=\"width: 31%\"/>\n<col style=\"width: 68%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Theme</th>\n<th>Prompts</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Friendship</td>\n<td>13. \"You can tell a real friend by what they don't say.\" 14.\n\"Friendships change, and that's not a bad thing.\" 15. \"We choose our\nfriends, but we don't choose who we become because of them.\" 16. \"It's\nharder to make friends as an adult.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Self-confidence</td>\n<td>17. \"Confidence is mostly an act.\" 18. \"The people who doubt us can\nmake us stronger.\" 19. \"Being humble and being confident are not\nopposites.\" 20. \"Fear is a sign you're doing something worthwhile.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Change and growth</td>\n<td>21. \"We learn more from failure than from success.\" 22. \"Home is a\nfeeling, not a place.\" 23. \"It's never too late to start again.\" 24.\n\"The best decisions often feel like the hardest ones.\"</td>\n</tr>\n</tbody>\n</table><h3 id=\"timed-practice-schedule\">Timed practice schedule</h3><table>\n<colgroup>\n<col style=\"width: 8%\"/>\n<col style=\"width: 49%\"/>\n<col style=\"width: 42%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Task</th>\n<th>Focus</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>17</td>\n<td>One Part A, 30 min</td>\n<td>Planning in 5 minutes</td>\n</tr>\n<tr class=\"even\">\n<td>18</td>\n<td>One Part B, 30 min</td>\n<td>The reflective arc</td>\n</tr>\n<tr class=\"odd\">\n<td>19</td>\n<td>Full pair, 60 min</td>\n<td>Moving cleanly between parts</td>\n</tr>\n<tr class=\"even\">\n<td>20</td>\n<td>Full pair, 60 min</td>\n<td>Proofreading routine</td>\n</tr>\n<tr class=\"odd\">\n<td>21</td>\n<td>Full pair, 60 min</td>\n<td>Benchmark: both complete, 3 or fewer errors each</td>\n</tr>\n<tr class=\"even\">\n<td>22</td>\n<td>Official Written English practice test</td>\n<td>Indicative score</td>\n</tr>\n<tr class=\"odd\">\n<td>23</td>\n<td>Full pair at test time of day</td>\n<td>Rehearsal</td>\n</tr>\n<tr class=\"even\">\n<td>24</td>\n<td>Reread your best two essays and your error list</td>\n<td>Rest</td>\n</tr>\n</tbody>\n</table><h3 id=\"getting-feedback\">Getting feedback</h3><p>After each timed pair, get feedback from one source and compare it\nwith your own marking:</p><ul>\n<li><p>a tutor, teacher or confident writer you know, using the Lesson 1\ncriteria table</p></li>\n<li><p>an AI tutor: paste the prompt and essay and ask it to mark\nagainst \"thought and content, structure and organisation, expression,\nstyle and mechanics\" and to list your top three fixes</p></li>\n<li><p>yourself, two days later, with fresh eyes</p></li>\n</ul><p>Add any recurring problem to the habit list from Lesson 1.</p>"}]}, {"id": "s6", "title": "Sub-course\n6: Exam Practice and Strategy (Weeks 17 to 24)", "intro": "", "lessons": [{"id": "s6l1", "title": "Practice schedule (Weeks 17 to 24)", "html": "<p>The last eight weeks run five sessions a week plus daily reading.\nOfficial ACER practice tests are scarce, so they are saved for the weeks\nmarked ★. The other weeks use the units in Sub-courses 3 and 4, redone\nunder time, plus any extra practice material.</p><table>\n<colgroup>\n<col style=\"width: 8%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 18%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 13%\"/>\n<col style=\"width: 27%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Mon (60 min)</th>\n<th>Tue (60 min)</th>\n<th>Wed (60 min)</th>\n<th>Thu (60 min)</th>\n<th>Sat (90 to 150 min)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>17</td>\n<td>Timed verbal set (18 Qs, 30 min)</td>\n<td>Error-log review + drills</td>\n<td>Part A essay, 30 min</td>\n<td>Timed quant set (18 Qs, 30 min)</td>\n<td>Mixed set, 35 Qs in 60 min + review</td>\n</tr>\n<tr class=\"even\">\n<td>18 ★</td>\n<td>Light review</td>\n<td>Part B essay, 30 min</td>\n<td>Rest</td>\n<td>Light quant drills</td>\n<td><strong>Official MC practice test 1</strong> (full, timed), then\nreview</td>\n</tr>\n<tr class=\"odd\">\n<td>19</td>\n<td>Review test 1: redo every miss</td>\n<td>Drills on weakest skill #1</td>\n<td>Essay pair, 60 min</td>\n<td>Drills on weakest skill #2</td>\n<td>Mixed set, 35 Qs in 60 min + review</td>\n</tr>\n<tr class=\"even\">\n<td>20</td>\n<td>Timed verbal set</td>\n<td>Drills on weakest skill</td>\n<td>Essay pair, 60 min</td>\n<td>Timed quant set</td>\n<td>Mixed set + review</td>\n</tr>\n<tr class=\"odd\">\n<td>21</td>\n<td>Timed verbal set</td>\n<td>Error-log review</td>\n<td>Essay pair (benchmark)</td>\n<td>Timed quant set</td>\n<td>Mixed set + review</td>\n</tr>\n<tr class=\"even\">\n<td>22 ★</td>\n<td>Light review</td>\n<td><strong>Official Written English practice test</strong></td>\n<td>Rest</td>\n<td>Light drills</td>\n<td><strong>Official MC practice test 2</strong> (full, timed), then\nreview</td>\n</tr>\n<tr class=\"odd\">\n<td>23</td>\n<td>Review test 2</td>\n<td>Weakest-skill drills</td>\n<td>Essay pair at test time of day</td>\n<td>Rest</td>\n<td><strong>Full mock</strong>, MC + essays at the real test times</td>\n</tr>\n<tr class=\"even\">\n<td>24</td>\n<td>Reread error log (30 min)</td>\n<td>Reread best essays (30 min)</td>\n<td>Light 20-question set</td>\n<td>Rest</td>\n<td><strong>Test day</strong> (or rest if the test is later)</td>\n</tr>\n</tbody>\n</table>"}, {"id": "s6l2", "title": "How to review a practice test", "html": "<p>The review is worth more than the test. Spend at least as long\nreviewing as you spent sitting it.</p><h3 id=\"step-by-step\">Step by step</h3><ol type=\"1\">\n<li><p><strong>Mark it,</strong> but don't look at the explanations\nyet.</p></li>\n<li><p><strong>Redo every wrong answer untimed,</strong> on a fresh\nsheet. If you now get it right, the problem was time or carelessness,\nnot skill.</p></li>\n<li><p><strong>Check the explanation</strong> for anything still\nwrong.</p></li>\n<li><p><strong>Also review lucky guesses:</strong> any question you got\nright but weren't sure of counts as a miss for learning\npurposes.</p></li>\n<li><p><strong>Categorise every miss</strong> using the table below and\nlog it.</p></li>\n<li><p><strong>Pick the top two categories</strong> and plan the next\nweek's drills around them.</p></li>\n</ol><h3 id=\"error-categories\">Error categories</h3><table>\n<colgroup>\n<col style=\"width: 8%\"/>\n<col style=\"width: 19%\"/>\n<col style=\"width: 38%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Code</th>\n<th>Category</th>\n<th>What it looks like</th>\n<th>Fix</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>K</td>\n<td>Knowledge gap</td>\n<td>Didn't know how to do percentages, nets, etc.</td>\n<td>Go back to the matching Sub-course lesson</td>\n</tr>\n<tr class=\"even\">\n<td>R</td>\n<td>Misread</td>\n<td>Missed \"NOT\", the units, or the wrong row of a table</td>\n<td>Underline key words in the stem; run the TASK check</td>\n</tr>\n<tr class=\"odd\">\n<td>C</td>\n<td>Careless</td>\n<td>Right method, slip in arithmetic</td>\n<td>Estimate first; check the answer against the estimate</td>\n</tr>\n<tr class=\"even\">\n<td>T</td>\n<td>Trap</td>\n<td>Picked the too-broad, too-extreme or real-world-but-unsupported\noption</td>\n<td>Revisit the trap tables in Sub-course 3</td>\n</tr>\n<tr class=\"odd\">\n<td>P</td>\n<td>Pace</td>\n<td>Ran out of time, or rushed the end</td>\n<td>Timing drills (next section)</td>\n</tr>\n</tbody>\n</table><h3 id=\"example-error-log\">Example error log</h3><table>\n<colgroup>\n<col style=\"width: 13%\"/>\n<col style=\"width: 7%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 8%\"/>\n<col style=\"width: 28%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test</th>\n<th>Q</th>\n<th>Skill</th>\n<th>Code</th>\n<th>What happened</th>\n<th>Rule for next time</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Practice 1</td>\n<td>12</td>\n<td>Inference</td>\n<td>T</td>\n<td>Chose an option that's true in real life but not in the passage</td>\n<td>\"If I can't point to the line, it's wrong\"</td>\n</tr>\n<tr class=\"even\">\n<td>Practice 1</td>\n<td>27</td>\n<td>Percentages</td>\n<td>C</td>\n<td>Divided by the new value, not the original</td>\n<td>\"Change ÷ ORIGINAL\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Practice 1</td>\n<td>41</td>\n<td>Cube nets</td>\n<td>K</td>\n<td>Couldn't see opposite faces</td>\n<td>Redo Sub-course 4, Week 13; sketch every net</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>"}, {"id": "s6l3", "title": "Timing drills and managing nerves", "html": "<h3 id=\"pacing-checkpoints-multiple-choice-70-questions-120-minutes\">Pacing\ncheckpoints (Multiple Choice: 70 questions, 120 minutes)</h3><p>Units vary in length, so treat these as rough markers rather than\nstrict targets.</p><table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Time elapsed</th>\n<th>Aim to be at about question</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>30 min</td>\n<td>17 to 18</td>\n</tr>\n<tr class=\"even\">\n<td>60 min</td>\n<td>35</td>\n</tr>\n<tr class=\"odd\">\n<td>90 min</td>\n<td>52 to 53</td>\n</tr>\n<tr class=\"even\">\n<td>115 min</td>\n<td>70 (leaves 5 minutes to return to flagged questions)</td>\n</tr>\n</tbody>\n</table><p><strong>The 2-minute rule:</strong> if a question isn't cracking\nafter 2 minutes, choose your best guess, flag it, and move on. A flagged\nquestion you return to later is worth far more than three unanswered\nones at the end.</p><p><strong>Never leave a blank:</strong> wrong answers cost nothing.</p><h3 id=\"drills\">Drills</h3><ul>\n<li><p><strong>Sprint sets:</strong> 10 questions in 15 minutes, three\ntimes a week in Weeks 17 to 21. Track your accuracy; it should hold\nsteady as speed improves.</p></li>\n<li><p><strong>Estimation-only rounds:</strong> for 10 quant questions,\npick an answer using estimation and elimination alone, with no full\nworking. Check how often this alone gets you there.</p></li>\n<li><p><strong>First-read summaries:</strong> for verbal units, read a\npassage once and write its main idea in 15 seconds before looking at the\nquestions.</p></li>\n</ul><h3 id=\"managing-nerves\">Managing nerves</h3><ul>\n<li><p><strong>Rehearse the conditions:</strong> sit the full mocks at\nthe real test time, in the room and on the computer you will use, so the\nday feels familiar.</p></li>\n<li><p><strong>Check the online testing requirements early:</strong> ID,\nroom setup and a system check are required for remote sittings. Do these\nwell before test week, not on the morning.</p></li>\n<li><p><strong>A slow breathing reset:</strong> breathe in for four\ncounts, hold for four, out for four, hold for four; repeat four times.\nUse it before the test and whenever a hard question rattles\nyou.</p></li>\n<li><p><strong>One bad question is one mark.</strong> Verbal and\nquantitative units are mixed through the test, so the next one may suit\nyou better. Flag it and move on.</p></li>\n<li><p><strong>Look after the basics:</strong> regular sleep in the last\ntwo weeks matters more than extra study. No new topics in the final\nweek.</p></li>\n</ul><h3 id=\"day-before-checklist\">Day-before checklist</h3><ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\"/>Test time, login details and ID\nready</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Room clear and quiet; computer\ncheck done</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Error log and best two essays\nreread (no more than 30 minutes)</label></p></li>\n<li><p><label><input type=\"checkbox\"/>An early night</label></p></li>\n</ul>"}]}];
var GUIDE = "\n\n<h2 id=\"overview\">Overview</h2>\n<p>This is a 24-week course, about 7 hours a week, that takes a learner\nfrom a Year 9 base to test-ready for both STAT papers. It rebuilds the\nbasics first, then teaches the STAT skills, then drills them under exam\ntiming.</p>\n<h3 id=\"what-the-learner-is-training-for\">What the learner is training\nfor</h3>\n<table>\n<colgroup>\n<col style=\"width: 15%\"/>\n<col style=\"width: 15%\"/>\n<col style=\"width: 52%\"/>\n<col style=\"width: 16%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Paper</th>\n<th>Time</th>\n<th>What it contains</th>\n<th>Calculator</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>STAT Multiple Choice</td>\n<td>2 hours + 10 min reading</td>\n<td>70 questions: about half verbal and critical reasoning, half\nquantitative reasoning, mixed together in units</td>\n<td>Not allowed</td>\n</tr>\n<tr class=\"even\">\n<td>STAT Written English</td>\n<td>1 hour + 5 min reading</td>\n<td>Two short essays: Part A (a public issue, argue a view) and Part B\n(a personal reflection). Choose one of four prompts in each part</td>\n<td>n/a</td>\n</tr>\n</tbody>\n</table>\n<p>The STAT tests reasoning, not school content. Every answer comes from\nthe passage, table or graph on screen. Wrong answers lose no marks, so\nevery question gets an answer.</p>\n<p>Each essay is marked by two markers on three criteria: thought and\ncontent, structure and organisation, and expression, style and\nmechanics. Quality counts far more than length.</p>\n<h3 id=\"the-target\">The target</h3>\n<p>Both papers are scored on a 100 to 200 scale with a mean of 150.\nAdmissions centres such as UAC convert the Multiple Choice score into an\nATAR-like selection rank. This plan reads \"80+\" as a selection rank of\n80 or better, which means scoring well above the 150 average.</p>\n<ul>\n<li><p><strong>Check first:</strong> confirm with the university (or\nUAC) which papers the course needs and the STAT score that gives a rank\nof 80. Many courses need only Multiple Choice.</p></li>\n<li><p><strong>Working benchmark (rule of thumb):</strong> consistently\nget about 75% or more right on timed official practice material, and\nessays that are clear, structured and nearly error-free.</p></li>\n<li><p><strong>Retakes:</strong> STAT can be sat once per cycle (15\nApril to 14 April), so the first attempt should be the ready\none.</p></li>\n</ul>\n<h3 id=\"how-to-use-this-plan\">How to use this plan</h3>\n<ol type=\"1\">\n<li><p>Sit the Week 1 diagnostic before any study. It shows where to\nspend time.</p></li>\n<li><p>Follow the weekly routine. Five shorter sessions beat one long\none.</p></li>\n<li><p>Keep an error log: every wrong answer gets a line saying why it\nwas wrong.</p></li>\n<li><p>Use the benchmarks at the end of each phase. Move on only when\nthey are met; add a week if not.</p></li>\n</ol>\n<h3 id=\"sub-courses-the-detail\">Sub-courses (the detail)</h3>\n<p>Each strand of this plan has its own sub-course in the menu, with lessons, explanations,\nextracts, activities and answers:</p>\n<table>\n<colgroup>\n<col style=\"width: 46%\"/>\n<col style=\"width: 12%\"/>\n<col style=\"width: 40%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Sub-course</th>\n<th>Weeks</th>\n<th>Feeds</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Numeracy Foundations</td>\n<td>1 to 8</td>\n<td>Quantitative reasoning</td>\n</tr>\n<tr class=\"even\">\n<td>2. Reading, Vocabulary &amp; Grammar</td>\n<td>1 to 8</td>\n<td>Verbal reasoning, both essays</td>\n</tr>\n<tr class=\"odd\">\n<td>3. Verbal &amp; Critical Reasoning</td>\n<td>9 to 16</td>\n<td>Multiple Choice, verbal half</td>\n</tr>\n<tr class=\"even\">\n<td>4. Quantitative Reasoning</td>\n<td>9 to 16</td>\n<td>Multiple Choice, quant half</td>\n</tr>\n<tr class=\"odd\">\n<td>5. Written English</td>\n<td>5 to 24</td>\n<td>Written English</td>\n</tr>\n<tr class=\"even\">\n<td>6. Exam Practice &amp; Strategy</td>\n<td>17 to 24</td>\n<td>Both  style=\"width: 13%\"/>\n<col style=\"width: 14%\"/>\n<col style=\"width: 26%\"/>\n<col style=\"width: 21%\"/>\n<col style=\"width: 24%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Session</th>\n<th>Phase 1 (Wk 1–8)</th>\n<th>Phase 2 (Wk 9–16)</th>\n<th>Phases 3–4 (Wk 17–24)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Every day</td>\n<td>Reading + vocab, 30 min</td>\n<td>Article + word cards</td>\n<td>Article + word cards</td>\n<td>Article + word cards</td>\n</tr>\n<tr class=\"even\">\n<td>Mon</td>\n<td>60 min</td>\n<td>Numeracy topic</td>\n<td>Quant skill</td>\n<td>Timed MC set</td>\n</tr>\n<tr class=\"odd\">\n<td>Tue</td>\n<td>60 min</td>\n<td>Grammar + paragraph</td>\n<td>Verbal skill</td>\n<td>Error-log drills</td>\n</tr>\n<tr class=\"even\">\n<td>Wed</td>\n<td>60 min</td>\n<td>Numeracy topic</td>\n<td>Quant skill</td>\n<td>Timed essay pair</td>\n</tr>\n<tr class=\"odd\">\n<td>Thu</td>\n<td>60 min</td>\n<td>Numeracy practice</td>\n<td>Essay (Part A or B)</td>\n<td>Timed MC set</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>90 min</td>\n<td>Weekly quiz + error-log review</td>\n<td>Mixed units + review</td>\n<td>Practice test or review</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>Rest</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"phase-1-weeks-1-to-8-numeracy-rebuild\">Phase 1 (Weeks 1 to 8):\nNumeracy rebuild</h2>\n<p>The quantitative half of STAT needs fast, confident arithmetic\nwithout a calculator, plus Year 9 to 10 level algebra and graph reading.\nThis is the biggest gap for most mature-age learners, so it gets three\nsessions a week in Phase 1.</p>\n<p>Daily habit: 10 minutes of mental arithmetic drills (times tables to\n12, doubling and halving, adding and subtracting two-digit numbers)\nbefore every numeracy session.</p>\n<table>\n<colgroup>\n<col style=\"width: 9%\"/>\n<col style=\"width: 35%\"/>\n<col style=\"width: 55%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Topic</th>\n<th>Learner can now...</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Diagnostic + number sense</td>\n<td>Place value, rounding, estimating answers before working them\nout</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>The four operations by hand</td>\n<td>Long multiplication and division, order of operations (BODMAS),\nnegative numbers</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Fractions</td>\n<td>Simplify, compare, add, multiply and divide fractions; \"fraction of\nan amount\"</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Decimals and percentages</td>\n<td>Convert between fraction, decimal and %; find 10%, 5%, 1% in your\nhead; percentage increase and decrease</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Ratio, rate and proportion</td>\n<td>Share in a ratio, unit rates (km/h, $/kg), direct and inverse\nproportion, unit conversions</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Algebra basics</td>\n<td>Substitute into formulas, simplify expressions, solve one- and\ntwo-step equations, rearrange a formula</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Graphs and tables</td>\n<td>Read line, bar, pie and scatter graphs; find trends; plot and read\ncoordinates; gradient as \"rise over run\"</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Shape, space and averages</td>\n<td>Perimeter, area, volume, angles; mean, median, mode, range; simple\nprobability. Phase 1 check-in</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Method for every topic:</strong> watch one short lesson, do\n15 to 20 easy questions, then 10 harder word problems. Mark them, and\nlog every error.</p>\n<p><strong>Phase 1 benchmark:</strong> 80% correct on a mixed\n30-question no-calculator quiz covering Weeks 2 to 8, in under 45\nminutes.</p>\n<h2 id=\"phase-1-weeks-1-to-8-reading-vocabulary-and-grammar\">Phase 1\n(Weeks 1 to 8): Reading, vocabulary and grammar</h2>\n<p>The verbal half of STAT and both essays rest on reading stamina and\nclean sentences. Phase 1 builds the habit of reading adult,\nargument-heavy text every day.</p>\n<h3 id=\"daily-reading-20-to-30-minutes-every-day-of-the-course\">Daily\nreading (20 to 30 minutes, every day of the course)</h3>\n<ul>\n<li><p>Weeks 1 to 4: one quality news or feature article a day (ABC News\nanalysis, The Conversation, SBS features).</p></li>\n<li><p>Weeks 5 to 8: add one opinion piece a week and one longer essay\nor magazine article.</p></li>\n<li><p>After each piece, write two sentences: what is the main point,\nand what is the writer's attitude?</p></li>\n</ul>\n<h3 id=\"vocabulary-10-minutes-a-day\">Vocabulary (10 minutes a day)</h3>\n<ul>\n<li><p>Keep a word notebook or flashcard deck (Anki or Quizlet). Add\nevery unfamiliar word met in reading, with its meaning and a sentence of\nyour own.</p></li>\n<li><p>Learn the \"argument words\" STAT relies on: however, therefore,\nwhereas, despite, consequently, implies, assumes, undermines,\nconcedes.</p></li>\n<li><p>Learn tone words: sceptical, ironic, sympathetic, dismissive,\ncautious, nostalgic, critical.</p></li>\n</ul>\n<h3 id=\"grammar-and-sentences-one-session-a-week\">Grammar and sentences\n(one session a week)</h3>\n<table>\n<colgroup>\n<col style=\"width: 14%\"/>\n<col style=\"width: 85%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Focus</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1 to 2</td>\n<td>Full sentences: subject and verb, fixing run-ons and fragments</td>\n</tr>\n<tr class=\"even\">\n<td>3 to 4</td>\n<td>Punctuation: full stops, commas, apostrophes, capital letters</td>\n</tr>\n<tr class=\"odd\">\n<td>5 to 6</td>\n<td>Joining ideas: because, although, which, while; varying sentence\nlength</td>\n</tr>\n<tr class=\"even\">\n<td>7 to 8</td>\n<td>The paragraph: topic sentence, explanation, example, link back</td>\n</tr>\n</tbody>\n</table>\n<p>Each week, write one paragraph of about 150 words on that week's\nreading. Check it against the week's grammar focus.</p>\n<p><strong>Phase 1 benchmark:</strong> reads a 700-word opinion article\nand states its main idea correctly in one sentence. Writes a 150-word\nparagraph with no sentence errors.</p>\n<h2 id=\"phase-2-weeks-9-to-16-verbal-and-critical-reasoning\">Phase 2\n(Weeks 9 to 16): Verbal and critical reasoning</h2>\n<p>STAT verbal units test four skills: finding the main idea,\ninterpreting words and phrases, paraphrasing, and inferring or deducing.\nPhase 2 teaches each one, then mixes them.</p>\n<table>\n<colgroup>\n<col style=\"width: 11%\"/>\n<col style=\"width: 36%\"/>\n<col style=\"width: 52%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Skill</th>\n<th>What to practise</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>9</td>\n<td>Main idea and purpose</td>\n<td>Summarise each paragraph in 5 words; name the writer's overall point\nand why they wrote it</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Words in context</td>\n<td>Work out meaning from surrounding sentences; spot figurative\nlanguage, irony and tone</td>\n</tr>\n<tr class=\"odd\">\n<td>11</td>\n<td>Paraphrase</td>\n<td>Pick the option that says the same thing in different words; reject\noptions that add, drop or twist a detail</td>\n</tr>\n<tr class=\"even\">\n<td>12</td>\n<td>Inference</td>\n<td>What must be true, what is probably true, what the text does not\nsay. Never use outside knowledge</td>\n</tr>\n<tr class=\"odd\">\n<td>13</td>\n<td>Arguments</td>\n<td>Find the conclusion, the reasons and the hidden assumption; what\nstrengthens or weakens the argument</td>\n</tr>\n<tr class=\"even\">\n<td>14</td>\n<td>Poems, cartoons and dialogues</td>\n<td>STAT includes non-standard texts. Read slowly, ask \"what is the\nspeaker's attitude?\"</td>\n</tr>\n<tr class=\"odd\">\n<td>15 to 16</td>\n<td>Mixed units, untimed then timed</td>\n<td>Full verbal units; start timing at about 1.7 minutes per\nquestion</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"the-answer-method-for-every-verbal-question\">The answer method\nfor every verbal question</h3>\n<ol type=\"1\">\n<li><p>Read the question stem first, so you know what to look\nfor.</p></li>\n<li><p>Read the passage actively: note the main idea and any turn words\n(however, but, yet).</p></li>\n<li><p>Predict the answer in your own words before looking at the\noptions.</p></li>\n<li><p>Eliminate: cross out options that are too extreme (always,\nnever), off-topic, or true but not what was asked.</p></li>\n<li><p>Choose the option that is supported by the text, not the one that\nsounds clever.</p></li>\n</ol>\n<p><strong>Phase 2 benchmark:</strong> 70% or better on mixed verbal\nunits, untimed.</p>\n<h2 id=\"phase-2-weeks-9-to-16-quantitative-reasoning\">Phase 2 (Weeks 9\nto 16): Quantitative reasoning</h2>\n<p>STAT quantitative units ask you to interpret and apply numbers,\nsymbols, diagrams and graphs in scientific and everyday settings. The\nmaths is rarely beyond Year 10; the challenge is reading the setup and\nchoosing the method fast.</p>\n<table>\n<colgroup>\n<col style=\"width: 11%\"/>\n<col style=\"width: 36%\"/>\n<col style=\"width: 52%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Skill</th>\n<th>What to practise</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>9</td>\n<td>Reading data displays</td>\n<td>Tables, multi-line graphs, dual axes; check units and scales before\ncalculating</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Percentages and rates in context</td>\n<td>Percentage change, compound change, comparing rates across\ngroups</td>\n</tr>\n<tr class=\"odd\">\n<td>11</td>\n<td>Patterns and sequences</td>\n<td>Number patterns, growth rules, \"what comes next\" in a diagram</td>\n</tr>\n<tr class=\"even\">\n<td>12</td>\n<td>Formulas and symbols</td>\n<td>Apply a rule given in the question; invented symbols (e.g. a ★ b =\n2a + b)</td>\n</tr>\n<tr class=\"odd\">\n<td>13</td>\n<td>Spatial reasoning</td>\n<td>Nets, rotations, reflections, maps and scale, 3D shapes from\ndifferent views</td>\n</tr>\n<tr class=\"even\">\n<td>14</td>\n<td>Logic puzzles</td>\n<td>Ordering and seating problems, \"if... then\" statements, Venn\ndiagrams</td>\n</tr>\n<tr class=\"odd\">\n<td>15 to 16</td>\n<td>Mixed units, untimed then timed</td>\n<td>Full quantitative units at about 1.7 minutes per question</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"speed-tricks-to-practise-until-automatic\">Speed tricks to\npractise until automatic</h3>\n<ul>\n<li><p><strong>Estimate first:</strong> round the numbers, get a\nballpark, and eliminate options that are far off. Often only one option\nfits.</p></li>\n<li><p><strong>Work backwards:</strong> substitute the answer options\ninto the problem when algebra is slow.</p></li>\n<li><p><strong>Use easy numbers:</strong> for percentage problems,\nassume a starting value of 100.</p></li>\n<li><p><strong>Draw it:</strong> sketch every spatial or logic problem;\nnever solve it in your head.</p></li>\n<li><p><strong>Skip and return:</strong> if a question is not cracking\nafter 2 minutes, guess, flag it and move on.</p></li>\n</ul>\n<p><strong>Phase 2 benchmark:</strong> 70% or better on mixed\nquantitative units, untimed.</p>\n<h2 id=\"written-english-course-runs-weeks-5-to-24\">Written English\ncourse (runs Weeks 5 to 24)</h2>\n<p>The learner writes two essays in 60 minutes, about 30 minutes each.\nEach essay needs a clear position, a logical shape and controlled,\naccurate English. Writing practice runs alongside the other phases, one\nsession a week, rising to two in Phase 3.</p>\n<h3 id=\"stage-1-weeks-5-to-8-paragraphs\">Stage 1 (Weeks 5 to 8):\nParagraphs</h3>\n<p>Covered in the grammar plan above: full sentences, punctuation, then\nthe paragraph (point, explain, example, link).</p>\n<h3 id=\"stage-2-weeks-9-to-12-part-a-the-argument-essay\">Stage 2 (Weeks\n9 to 12): Part A, the argument essay</h3>\n<p>Part A prompts are formal public-issue comments (recent example\nthemes include education). The task is to respond with a reasoned\nview.</p>\n<p><strong>A reliable shape (about 350 to 450 words):</strong></p>\n<ol type=\"1\">\n<li><p><strong>Introduction (3 to 4 sentences):</strong> restate the\nissue in your own words and give a clear position.</p></li>\n<li><p><strong>Body paragraph 1:</strong> your strongest reason,\nexplained, with a specific example.</p></li>\n<li><p><strong>Body paragraph 2:</strong> a second reason, explained,\nwith an example.</p></li>\n<li><p><strong>Body paragraph 3:</strong> the other side, fairly stated,\nthen why your view still holds.</p></li>\n<li><p><strong>Conclusion (2 to 3 sentences):</strong> return to the\nposition and widen it (why it matters).</p></li>\n</ol>\n<p>Weekly drill: brainstorm 3 prompts in 5 minutes each (position + 3\npoints), and write one full essay untimed.</p>\n<h3 id=\"stage-3-weeks-13-to-16-part-b-the-reflective-essay\">Stage 3\n(Weeks 13 to 16): Part B, the reflective essay</h3>\n<p>Part B prompts are less formal and invite personal reflection (recent\nexample themes: friendship, self-confidence). The best responses still\nhave a point, not just a story.</p>\n<p><strong>A reliable shape (about 350 to 450 words):</strong></p>\n<ol type=\"1\">\n<li><p><strong>Opening:</strong> a short concrete moment or image, then\nthe idea you will explore.</p></li>\n<li><p><strong>Development:</strong> one or two experiences or\nobservations, each tied back to the idea.</p></li>\n<li><p><strong>Complication:</strong> what you once believed versus what\nyou now think, or a limit to the prompt's claim.</p></li>\n<li><p><strong>Close:</strong> what you have learnt, and what it means\nmore generally.</p></li>\n</ol>\n<p>Weekly drill: one reflective essay untimed, plus one rewrite of an\nearlier essay.</p>\n<h3 id=\"stage-4-weeks-17-to-24-timed-pairs\">Stage 4 (Weeks 17 to 24):\nTimed pairs</h3>\n<ul>\n<li><p>One timed pair a week: choose prompts in 5 minutes, then 30\nminutes per essay, typed (the online test is typed).</p></li>\n<li><p>Inside each 30 minutes: 5 minutes plan, 22 minutes write, 3\nminutes proofread.</p></li>\n<li><p>Get feedback on every pair from a teacher, tutor, strong writer,\nor an AI tutor using the three marking criteria. Put the essay aside for\ntwo days and reread it too.</p></li>\n</ul>\n<h3 id=\"self-marking-checklist-use-on-every-essay\">Self-marking\nchecklist (use on every essay)</h3>\n<table>\n<colgroup>\n<col style=\"width: 42%\"/>\n<col style=\"width: 57%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Criterion</th>\n<th>Ask yourself</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Thought and content</td>\n<td>Is my position clear? Are ideas developed with reasons and examples,\nnot just listed?</td>\n</tr>\n<tr class=\"even\">\n<td>Structure and organisation</td>\n<td>Does each paragraph have one job? Do the links (however, as a\nresult) guide the reader?</td>\n</tr>\n<tr class=\"odd\">\n<td>Expression, style and mechanics</td>\n<td>Are sentences varied and correct? Any spelling, apostrophe or comma\nerrors? Is the tone right for Part A or B?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Writing benchmark by Week 21:</strong> two complete, planned\nessays in 60 minutes, each with a clear position and no more than three\nsurface errors.</p>\n<h2 id=\"phases-3-and-4-weeks-17-to-24-timed-practice-mocks-and-test-day\">Phases\n3 and 4 (Weeks 17 to 24): Timed practice, mocks and test day</h2>\n<p>Phase 3 builds speed and stamina; Phase 4 rehearses the real day.\nSave the official ACER practice tests for these phases: they are the\nonly material that truly matches the test.</p>\n<h3 id=\"phase-3-weeks-17-to-21-speed-and-stamina\">Phase 3 (Weeks 17 to\n21): Speed and stamina</h3>\n<ul>\n<li><p>Two timed mixed MC sets a week (35 questions in 60 minutes),\nalternating verbal-heavy and quant-heavy.</p></li>\n<li><p>Week 18: first official ACER MC practice test, full length, under\nreal conditions. Mark it and spend a full session on the\nreview.</p></li>\n<li><p>Weeks 19 to 21: target the two weakest question types from the\nerror log with extra drills.</p></li>\n<li><p>Writing: one timed essay pair a week (see the Written English\ncourse).</p></li>\n</ul>\n<h3 id=\"phase-4-weeks-22-to-24-full-rehearsals\">Phase 4 (Weeks 22 to\n24): Full rehearsals</h3>\n<ul>\n<li><p>Week 22: second official MC practice test plus the official\nWritten English practice test (it returns an indicative score).</p></li>\n<li><p>Week 23: a final full mock at the same time of day as the real\ntest. Review only; no new topics.</p></li>\n<li><p>Week 24 (test week): light 30-minute sessions, re-read the error\nlog and essay checklist, sleep well.</p></li>\n</ul>\n<h3 id=\"exam-room-strategy\">Exam-room strategy</h3>\n<ul>\n<li><p><strong>Pace:</strong> about 1 minute 45 seconds per MC question.\nCheck the clock at question 35: about 60 minutes should have\ngone.</p></li>\n<li><p><strong>Two-pass method:</strong> answer what you can, flag the\nhard ones, return at the end.</p></li>\n<li><p><strong>Never leave a blank:</strong> no marks are lost for wrong\nanswers, so guess on everything in the last 2 minutes.</p></li>\n<li><p><strong>Units are mixed:</strong> a long passage worth 5\nquestions is often worth more time than a single tricky puzzle.</p></li>\n<li><p><strong>Essays:</strong> spend the reading time picking prompts\nyou have something real to say about. Write Part A first if argument is\nyour strength, Part B first otherwise. Leave 3 minutes to proofread\neach.</p></li>\n</ul>\n<h3 id=\"test-day-checklist\">Test-day checklist</h3>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\"/>Test booked and the course's\nrequired papers confirmed with the university</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Online proctoring requirements\nchecked (ID, quiet room, computer check run beforehand)</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Clear desk, water, nothing on the\nprohibited list (no calculator)</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Good sleep the two nights before,\nlight meal beforehand</label></p></li>\n</ul>\n\n\n\n\n\n<h2 id=\"resources\">Resources</h2>\n<p><strong>Official (use in Phases 3 and 4):</strong></p>\n<ul>\n<li><p><a href=\"https://stat.acer.org/au/preparation\">ACER STAT\npreparation page</a>: free sample MC question booklet, plus paid\nPractice Tests for Multiple Choice and Written English.</p></li>\n<li><p><a href=\"https://stat.acer.org/files/Complete-guide-to-STAT-for-online-sittings.pdf\">Complete\nguide to STAT</a>: format, marking criteria, sample questions and sample\nessay prompts.</p></li>\n<li><p><a href=\"https://stat.acer.org/\">ACER STAT home</a>: test dates\nand fees (MC A$240, WE A$225; rising to A$250 and A$230 from 1 January\n2027).</p></li>\n</ul>\n<p><strong>Foundations (free):</strong></p>\n<ul>\n<li><p>Khan Academy: arithmetic, pre-algebra, Year 7 to 10 maths. Use\nits unit tests for the Phase 1 benchmarks.</p></li>\n<li><p>The Conversation, ABC News analysis: daily argument-rich\nreading.</p></li>\n<li><p>Anki or Quizlet: vocabulary flashcards.</p></li>\n</ul>\n<p><strong>Admissions:</strong></p>\n<ul>\n<li><p><a href=\"https://uaccoursehub.uac.edu.au/future-applicants/admission-criteria/nsw-uai\">UAC\nSTAT information</a> and the target university's admissions page: which\npapers a course needs and how scores convert to a selection\nrank.</p></li>\n</ul>\n<p>ACER notes that third-party STAT prep courses are unregulated and not\nendorsed by ACER. Practise with official material where it counts.</p>\n<h3 id=\"sources\">Sources</h3>\n<ul>\n<li><p><a href=\"https://stat.acer.org/files/Complete-guide-to-STAT-for-online-sittings.pdf\">ACER:\nComplete guide to STAT for online sittings</a></p></li>\n<li><p><a href=\"https://stat.acer.org/gb/preparation\">ACER STAT\npreparation</a></p></li>\n<li><p><a href=\"https://stat.acer.org/\">ACER STAT home</a></p></li>\n<li><p><a href=\"https://www.curtin.edu.au/study/?p=112063\">Curtin\nUniversity: STAT</a></p></li>\n<li><p><a href=\"https://www.rmit.edu.au/study-with-us/pathways/skills-for-tertiary-admissions-test-stat\">RMIT:\nSTAT</a></p></li>\n</ul>\n";

function backup(){ var b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); var a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="stat-progress-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); toast("Backup downloaded"); }
function restore(inp){ var f=inp.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d||typeof d!=="object"||!("ans" in d)) throw 0; S=Object.assign(blank(),d); save(); route(); toast("Progress restored"); }catch(e){ alert("That file isn't a STAT course backup."); } }; r.readAsText(f); }
function resetAll(){ if(confirm("Delete ALL progress, results, essays and notes in this browser? Download a backup first if unsure.")){ S=blank(); save(); route(); } }

function pageGuide(){ $("main").innerHTML = topbar()+'<h1>Course guide</h1><p class="sub">The overall plan: what STAT tests, the target, the timeline and how the course works.</p><div class="content">'+GUIDE+'</div>'; }

function pageLesson(lid){
  var l=LESSON[lid], sc=COURSE.filter(function(c){return c.id===l.sc;})[0], idx=ORDER.indexOf(lid);
  var h = topbar()+'<div class="row" style="margin-bottom:6px"><span class="pill">'+esc(SHORT[l.sc])+'</span><span class="pill grey">Week '+WEEK[lid]+'</span></div><h1>'+esc(lessonShort(l))+'</h1>';
  if(sc.lessons[0].id===lid && sc.intro) h += '<div class="content muted">'+sc.intro+'</div>';
  h += '<div class="content">'+l.html+'</div>';
  quizzes(lid).forEach(function(q){ h += '<div class="quiz" id="qz_'+q.id+'"></div>'; });
  if(l.sc==="s5") h += '<div class="card" style="margin-top:24px"><b>Ready to write?</b> Use the <a href="#/essays">Essay studio</a> for timed essays with a word count, self-marking and saved drafts.</div>';
  h += '<div class="lessonfoot">'+(idx>0?'<a class="btn ghost" href="#/l/'+ORDER[idx-1]+'">← Previous</a>':'<span></span>')
     + '<button class="btn ghost done-toggle'+(S.done[lid]?' on':'')+'" onclick="toggleDone(\''+lid+'\')">'+(S.done[lid]?'✓ Lesson complete':'Mark lesson complete')+'</button>'
     + (idx<ORDER.length-1?'<a class="btn ghost" href="#/l/'+ORDER[idx+1]+'">Next →</a>':'<span></span>')+'</div>';
  $("main").innerHTML = h;
  quizzes(lid).forEach(function(q){ renderQuiz(lid,q); });
}
function toggleDone(lid){ S.done[lid]=!S.done[lid]; if(!S.done[lid]) delete S.done[lid]; save(); route(true); }

/* ---------- quizzes ---------- */
var EXAM = null; // {quiz, lid, end, ans:{}, timer}
function renderQuiz(lid, q){
  var box=$("qz_"+q.id); if(!box) return;
  var exam = EXAM && EXAM.quiz.id===q.id;
  var answered=0, right=0, n=q.items.length;
  q.items.forEach(function(it,i){ var a=S.ans[qid(q,i)]; if(a&&a.ok!=null){ answered++; if(a.ok) right++; } });
  var h = '<div class="qhead"><h2 style="margin:12px 0 4px">'+esc(q.title)+'</h2>';
  if(!exam) h += '<div class="row">'+(q.timed?'<button class="btn small" onclick="startExam(\''+lid+'\',\''+q.id+'\')">Start exam mode ('+q.timed+' min)</button>':'')+(answered?'<button class="btn ghost small" onclick="resetQuiz(\''+lid+'\',\''+q.id+'\')">Start again</button>':'')+'</div>';
  h += '</div>';
  if(q.intro) h += '<p class="small muted">'+q.intro+'</p>';
  if(exam) h += '<div class="examstrip"><span><b>Exam mode</b> · answers are marked when you submit</span><span class="timer" id="tmr">--:--</span><button class="btn small" onclick="submitExam()">Submit</button></div>';
  else h += '<p class="small"><b>'+right+'</b> correct of '+answered+' answered · '+n+' questions</p>';
  if(q.stimulus) h += '<div class="stim">'+q.stimulus+'</div>';
  q.items.forEach(function(it,i){ h += qcard(lid,q,it,i,exam); });
  if(!exam && answered===n) h += '<div class="card"><span class="score">Score: '+right+' / '+n+' ('+Math.round(right/n*100)+'%)</span><p class="small muted" style="margin:4px 0 0">Saved to your results. Wrong answers are in your <a href="#/errors">error log</a>. Use “Start again” to retry later.</p></div>';
  box.innerHTML = h;
  wire(box,lid,q,exam);
  if(exam) tick();
}
function qcard(lid,q,it,i,exam){
  var id=qid(q,i), a = exam ? (EXAM.ans[id]? {v:EXAM.ans[id]} : null) : S.ans[id];
  var marked = !exam && a && a.ok!=null;
  var cls = marked ? (a.ok?' ok':' no') : '';
  var h = '<div class="qcard'+cls+'" id="c_'+id+'"><div class="qn">Question '+(i+1)+'</div><div class="qstem">'+it.q+'</div>';
  if(it.t==="mc"){
    order(it.o.length, hash(id)).forEach(function(oi){
      var sel = a && +a.v===oi, c='';
      if(marked){ if(oi===it.a) c=' right'; else if(sel) c=' wrong'; } else if(sel) c=' sel';
      h += '<label class="opt'+c+'"><input type="radio" name="r_'+id+'" value="'+oi+'"'+(sel?' checked':'')+(marked?' disabled':'')+'><span>'+it.o[oi]+'</span></label>';
    });
    if(marked) h += '<div class="fb '+(a.ok?'ok':'no')+'">'+(a.ok?'Correct. ':'Not quite. The answer is: <b>'+it.o[it.a]+'</b>. ')+esc(it.e)+'</div>';
  } else if(it.t==="num"){
    h += '<div class="numrow"><input type="text" id="i_'+id+'" value="'+esc(a?a.v:"")+'" placeholder="Your answer"'+(marked?' disabled':'')+' autocomplete="off">'+(exam||marked?'':'<button class="btn small" data-chk="'+i+'">Check</button>')+'</div>';
    if(marked) h += '<div class="fb '+(a.ok?'ok':'no')+'">'+(a.ok?'Correct. ':'Not quite. The answer is <b>'+esc(it.show)+'</b>. ')+esc(it.e)+(a.ok?'':' <button class="linkbtn" data-override="'+i+'">I was right (format difference)</button>')+'</div>';
  } else {
    h += '<textarea id="i_'+id+'" rows="3" placeholder="Write your answer, then check it against the model answer"'+(marked?' disabled':'')+'>'+esc(a?a.v:"")+'</textarea>';
    if(!exam){
      if(marked) h += '<div class="fb '+(a.ok?'ok':'no')+'"><b>Model answer:</b> '+it.m+'<br><span class="small">You marked this '+(a.ok?'right':'as needing work')+'.</span></div>';
      else if(a && a.shown) h += '<div class="fb info"><b>Model answer:</b> '+it.m+'</div><div class="row" style="margin-top:8px"><button class="btn small" data-self="1" data-i="'+i+'">I got it right</button><button class="btn ghost small" data-self="0" data-i="'+i+'">Not quite</button></div>';
      else h += '<div style="margin-top:8px"><button class="btn small" data-show="'+i+'">Show model answer</button></div>';
    }
  }
  return h+'</div>';
}
function wire(box,lid,q,exam){
  q.items.forEach(function(it,i){
    var id=qid(q,i);
    if(it.t==="mc") Array.prototype.forEach.call(box.querySelectorAll('input[name="r_'+id+'"]'),function(r){ r.onchange=function(){ if(exam){ EXAM.ans[id]=r.value; markSel(box,id); } else record(lid,q,i,r.value,+r.value===it.a); }; });
    var inp=box.querySelector("#i_"+cssId(id));
    if(inp){ inp.oninput=function(){ if(exam) EXAM.ans[id]=inp.value; else if(it.t==="self"){ var a=S.ans[id]||(S.ans[id]={ok:null}); a.v=inp.value; save(); } };
      if(it.t==="num"&&!exam) inp.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); doCheck(lid,q,i); } }; }
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-chk]"),function(b){ b.onclick=function(){ doCheck(lid,q,+b.dataset.chk); }; });
  Array.prototype.forEach.call(box.querySelectorAll("[data-override]"),function(b){ b.onclick=function(){ var i=+b.dataset.override, id=qid(q,i); S.ans[id].ok=true; S.errors=S.errors.filter(function(e){return e.id!==id;}); save(); renderQuiz(lid,q); renderSide(cur); }; });
  Array.prototype.forEach.call(box.querySelectorAll("[data-show]"),function(b){ b.onclick=function(){ var i=+b.dataset.show,id=qid(q,i),inp=box.querySelector("#i_"+cssId(id)); S.ans[id]={v:inp?inp.value:"",ok:null,shown:true}; save(); renderQuiz(lid,q); }; });
  Array.prototype.forEach.call(box.querySelectorAll("[data-self]"),function(b){ b.onclick=function(){ var i=+b.dataset.i, inp=box.querySelector("#i_"+cssId(qid(q,i))); record(lid,q,i,inp?inp.value:"",b.dataset.self==="1"); }; });
}
function cssId(s){ return s.replace(/[^\w-]/g,"\\$&"); }
function markSel(box,id){ Array.prototype.forEach.call(box.querySelectorAll('input[name="r_'+id+'"]'),function(r){ r.parentNode.classList.toggle("sel",r.checked); }); }
function doCheck(lid,q,i){ var id=qid(q,i), v=$("i_"+id).value, ok=checkNum(q.items[i],v); if(ok===null){ toast("Type an answer first"); return; } record(lid,q,i,v,ok); }
function record(lid,q,i,v,ok,quiet){
  var id=qid(q,i), it=q.items[i];
  S.ans[id]={v:v,ok:ok,date:today()};
  if(!ok) logError(lid,q,i,v);
  else S.errors=S.errors.filter(function(e){ return !(e.id===id && e.date===today()); });
  if(!quiet){
    var n=q.items.length, done=q.items.every(function(_,k){ var a=S.ans[qid(q,k)]; return a&&a.ok!=null; });
    if(done && !S.attempts.some(function(t){return t.quiz===q.id&&t.mode==="exam"&&t.date===today();})){ var sc=q.items.filter(function(_,k){return S.ans[qid(q,k)].ok;}).length; S.attempts.push({quiz:q.id,lid:lid,title:q.title,score:sc,total:n,date:today(),mode:"practice"}); }
    save(); renderQuiz(lid,q); renderSide(cur);
    var c=$("c_"+id); if(c&&!done) c.scrollIntoView({block:"nearest"});
  }
}
function yourText(it,v){ return it.t==="mc" ? (v===""||v==null?"(no answer)":strip(it.o[+v])) : (v||"(no answer)"); }
function rightText(it){ return it.t==="mc" ? strip(it.o[it.a]) : it.t==="num" ? it.show : strip(it.m); }
function logError(lid,q,i,v){
  var id=qid(q,i), it=q.items[i];
  S.errors=S.errors.filter(function(e){ return !(e.id===id && e.date===today()); });
  S.errors.push({id:id,date:today(),lid:lid,quiz:q.title,skill:LESSON[lid].skill,q:strip(it.q).slice(0,400),your:yourText(it,v),right:rightText(it),note:""});
}
function resetQuiz(lid,qzId){ var q=quizzes(lid).filter(function(x){return x.id===qzId;})[0]; if(!confirm("Clear your answers for “"+q.title+"” and try again? Your past score and error log stay.")) return; q.items.forEach(function(_,i){ delete S.ans[qid(q,i)]; }); save(); renderQuiz(lid,q); }
function startExam(lid,qzId){
  var q=quizzes(lid).filter(function(x){return x.id===qzId;})[0];
  if(!confirm("Start a timed attempt: "+q.items.length+" questions in "+q.timed+" minutes. Answers are marked when you submit (or when time runs out).")) return;
  EXAM={quiz:q,lid:lid,start:Date.now(),end:Date.now()+q.timed*60000,ans:{}};
  renderQuiz(lid,q); $("qz_"+q.id).scrollIntoView();
  EXAM.timer=setInterval(tick,1000);
}
function tick(){ if(!EXAM) return; var t=$("tmr"); var left=Math.max(0,EXAM.end-Date.now()), m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
  if(t){ t.textContent=m+":"+String(s).padStart(2,"0"); t.classList.toggle("low",left<120000); }
  if(left<=0){ toast("Time's up!"); submitExam(true); } }
function submitExam(auto){
  if(!EXAM) return; if(!auto && !confirm("Submit and see your marks?")) return;
  clearInterval(EXAM.timer); var q=EXAM.quiz, lid=EXAM.lid, sc=0, selfQ=0;
  q.items.forEach(function(it,i){ var id=qid(q,i), v=EXAM.ans[id]; if(v==null) v="";
    if(it.t==="mc"){ var ok=v!==""&&+v===it.a; record(lid,q,i,v,ok,true); if(ok) sc++; }
    else if(it.t==="num"){ var ok2=!!checkNum(it,v); record(lid,q,i,v,ok2,true); if(ok2) sc++; }
    else { S.ans[id]={v:v,ok:null,shown:true}; selfQ++; } });
  S.attempts.push({quiz:q.id,lid:lid,title:q.title,score:sc,total:q.items.length-selfQ,date:today(),mode:"exam",secs:Math.round((Date.now()-EXAM.start)/1000)});
  EXAM=null; save(); renderQuiz(lid,q); renderSide(cur);
  toast("Score: "+sc+" / "+(q.items.length-selfQ)+(selfQ?" (+"+selfQ+" to self-mark)":""));
}

/* ---------- error log ---------- */
function pageErrors(){
  var skills={}; S.errors.forEach(function(e){ skills[e.skill]=(skills[e.skill]||0)+1; });
  var f=pageErrors.f||"";
  var h=topbar()+'<h1>Error log</h1><p class="sub">Every question you got wrong lands here. For each one, write a short rule for next time. Reread this before every practice test.</p>';
  if(!S.errors.length){ $("main").innerHTML=h+'<div class="card">Nothing here yet. Wrong answers from practice questions are added automatically.</div>'; return; }
  h+='<div class="row" style="margin-bottom:8px"><label class="small">Filter by skill <select id="ef" style="width:auto"><option value="">All ('+S.errors.length+')</option>'+Object.keys(skills).sort(function(a,b){return skills[b]-skills[a];}).map(function(k){return '<option'+(k===f?' selected':'')+' value="'+esc(k)+'">'+esc(k)+' ('+skills[k]+')</option>';}).join("")+'</select></label></div>';
  S.errors.slice().reverse().forEach(function(e){ if(f&&e.skill!==f) return; var ix=S.errors.indexOf(e);
    h+='<div class="err-item"><div class="row small muted"><span>'+fmtDate(e.date)+'</span><span class="pill grey">'+esc(e.skill)+'</span><a href="#/l/'+e.lid+'">'+esc(e.quiz)+'</a></div><p style="margin:6px 0">'+esc(e.q)+'</p><p class="small" style="margin:4px 0">Your answer: <b style="color:var(--bad)">'+esc(e.your)+'</b><br>Correct: <b style="color:var(--good)">'+esc(e.right)+'</b></p><input type="text" data-note="'+ix+'" value="'+esc(e.note)+'" placeholder="Why was it wrong? Rule for next time…"><div style="text-align:right;margin-top:6px"><button class="linkbtn" data-del="'+ix+'">Remove</button></div></div>'; });
  $("main").innerHTML=h;
  $("ef").onchange=function(){ pageErrors.f=this.value; pageErrors(); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-note]"),function(i){ i.oninput=function(){ S.errors[+i.dataset.note].note=i.value; save(); }; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(b){ b.onclick=function(){ S.errors.splice(+b.dataset.del,1); save(); pageErrors(); renderSide(cur); }; });
}

/* ---------- essay studio ---------- */
var ES = null; // live essay session
function pageEssays(){
  if(ES){ return essayWrite(); }
  var h=topbar()+'<h1>Essay studio</h1><p class="sub">Practise the STAT Written English test: choose a prompt, write against the clock, then mark yourself on the three criteria. See Sub-course 5 for how to plan and write each part.</p>';
  h+='<div class="grid"><div class="card" style="margin:0"><h3 style="margin-top:0">Part A: argument</h3><p class="small">A public issue. Argue a clear, reasoned view. 30 minutes.</p><button class="btn" onclick="essayStart(\'A\',30)">Start Part A</button></div>'
   +'<div class="card" style="margin:0"><h3 style="margin-top:0">Part B: reflection</h3><p class="small">A personal topic. Reflect, and reach an insight. 30 minutes.</p><button class="btn" onclick="essayStart(\'B\',30)">Start Part B</button></div>'
   +'<div class="card" style="margin:0"><h3 style="margin-top:0">Full test</h3><p class="small">Part A then Part B, 60 minutes total, like the real test.</p><button class="btn" onclick="essayStart(\'AB\',60)">Start full test</button></div></div>';
  if(S.essays.length){
    h+='<h2>Your essays</h2><table><tr><th>Date</th><th>Part</th><th>Prompt</th><th>Words</th><th>Self-mark</th></tr>'+S.essays.slice().reverse().map(function(e){ var t=e.scores?CRIT.reduce(function(s,c){return s+(+e.scores[c[0]]||0);},0):0; return '<tr><td>'+fmtDate(e.date)+'</td><td>'+e.part+'</td><td><a href="#/essay/'+e.id+'">'+esc(e.prompt)+'</a></td><td>'+e.words+'</td><td>'+(t?t+' / 15':'—')+'</td></tr>'; }).join("")+'</table>';
  }
  $("main").innerHTML=h;
}
function pickPrompts(part){ var th=PROMPTS[part], keys=Object.keys(th), k=keys[Math.floor(Math.random()*keys.length)]; return {theme:k, list:th[k]}; }
function essayStart(mode,mins){
  ES={mode:mode,mins:mins,parts:(mode==="AB"?["A","B"]:[mode]).map(function(p){ var pp=pickPrompts(p); return {part:p,theme:pp.theme,options:pp.list,prompt:null,text:""}; }),end:null,timer:null,over:false};
  essayWrite();
}
function essayWrite(){
  var h=topbar()+'<h1>'+(ES.mode==="AB"?'Full Written English test':'Part '+ES.mode+' essay')+'</h1>';
  var need=ES.parts.filter(function(p){return !p.prompt;})[0];
  if(need){
    h+='<p class="sub">Part '+need.part+' · Theme: <b>'+esc(need.theme)+'</b>. Choose one comment to respond to. '+(ES.end?'The clock is running.':'The clock starts when you choose.')+'</p>';
    if(ES.end) h+='<div class="examstrip"><span><b>Choosing prompt</b></span><span class="timer" id="etmr"></span></div>';
    need.options.forEach(function(o,i){ h+='<button class="prompt-opt" data-p="'+i+'">“'+esc(o)+'”</button>'; });
    h+='<p><button class="linkbtn" onclick="essayCancel()">Cancel</button></p>';
    $("main").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll("[data-p]"),function(b){ b.onclick=function(){ need.prompt=need.options[+b.dataset.p]; if(!ES.end){ ES.end=Date.now()+ES.mins*60000; ES.timer=setInterval(etick,1000);} essayWrite(); }; });
    etick(); return;
  }
  h+='<div class="examstrip"><span class="small">Plan 5 min · write · proofread 3 min</span><span class="timer" id="etmr"></span><button class="btn small" onclick="essayFinish()">Finish</button></div>';
  ES.parts.forEach(function(p,i){ h+='<div class="card essaybox"><div class="pill">Part '+p.part+'</div><p style="font-size:18px;margin:8px 0 10px"><b>“'+esc(p.prompt)+'”</b></p><textarea id="et_'+i+'" placeholder="Plan here first (position, three points, examples), then write your essay…">'+esc(p.text)+'</textarea><div class="wc" id="wc_'+i+'"></div></div>'; });
  h+='<p class="small muted">Tip: the real test is typed, so practise typing your essays here.</p>';
  $("main").innerHTML=h;
  ES.parts.forEach(function(p,i){ var t=$("et_"+i); t.oninput=function(){ p.text=t.value; wc(i); }; wc(i); });
  etick();
}
function words(s){ return (s.trim().match(/\S+/g)||[]).length; }
function wc(i){ var w=words(ES.parts[i].text); $("wc_"+i).textContent=w+" words"+(w<250?" · aim for roughly 300–450":""); }
function etick(){ if(!ES||!ES.end) return; var t=$("etmr"), left=ES.end-Date.now();
  if(left<=0&&!ES.over){ ES.over=true; toast("Time's up! Finish your sentence, then click Finish."); }
  var a=Math.abs(left), m=Math.floor(a/60000), s=Math.floor(a/1000)%60;
  if(t){ t.textContent=(left<0?"+":"")+m+":"+String(s).padStart(2,"0"); t.classList.toggle("low",left<180000); } }
function essayCancel(){ if(ES&&ES.timer) clearInterval(ES.timer); ES=null; pageEssays(); }
function essayFinish(){
  if(!confirm("Finish and self-mark?")) return;
  clearInterval(ES.timer); var mins=Math.round((Date.now()-(ES.end-ES.mins*60000))/60000);
  var ids=[]; ES.parts.forEach(function(p){ var e={id:"e"+Date.now()+p.part,date:today(),part:p.part,theme:p.theme,prompt:p.prompt,text:p.text,words:words(p.text),mins:ES.mode==="AB"?null:mins,scores:{},checks:{},notes:""}; S.essays.push(e); ids.push(e.id); });
  ES=null; save(); location.hash="#/essay/"+ids[0];
}
function pageEssay(id){
  var e=S.essays.filter(function(x){return x.id===id;})[0]; if(!e){ location.hash="#/essays"; return; }
  var h=topbar()+'<p><a href="#/essays">← Essay studio</a></p><div class="row"><span class="pill">Part '+e.part+'</span><span class="pill grey">'+fmtDate(e.date)+'</span><span class="pill grey">'+e.words+' words'+(e.mins?' · '+e.mins+' min':'')+'</span></div><h1 style="font-size:22px;margin-top:10px">“'+esc(e.prompt)+'”</h1>';
  h+='<div class="card"><textarea id="etx" style="min-height:300px">'+esc(e.text)+'</textarea><div class="small muted" style="margin-top:6px">You can edit and improve this essay. Changes save automatically.</div></div>';
  h+='<div class="card"><h3 style="margin-top:0">Self-mark</h3><p class="small muted">Score each criterion from 1 (weak) to 5 (strong). Be honest. Better still, put the essay aside for two days and mark it with fresh eyes.</p>';
  CRIT.forEach(function(c){ h+='<div style="margin:10px 0"><b>'+c[1]+'</b><div class="small muted">'+c[2]+'</div><div class="row" style="margin-top:4px">'+[1,2,3,4,5].map(function(n){ return '<label class="opt'+(+e.scores[c[0]]===n?' sel':'')+'" style="margin:0;padding:4px 12px"><input type="radio" name="s_'+c[0]+'" value="'+n+'"'+(+e.scores[c[0]]===n?' checked':'')+'> '+n+'</label>'; }).join("")+'</div></div>'; });
  h+='<h3>Checklist</h3><div class="weekchk">'+ESSAY_CHECK.map(function(c,i){ return '<label><input type="checkbox" data-ec="'+i+'"'+(e.checks[i]?' checked':'')+'> '+esc(c)+'</label>'; }).join("")+'</div>';
  h+='<h3>Notes and fixes</h3><textarea id="enote" rows="3" placeholder="What to fix next time…">'+esc(e.notes)+'</textarea></div>';
  h+='<div class="card"><h3 style="margin-top:0">Get outside feedback</h3><p class="small">Copy your essay with marking instructions, then paste it to a tutor, a confident writer or an AI tutor.</p><div class="row"><button class="btn" onclick="copyEssay(\''+e.id+'\')">Copy essay for feedback</button><button class="btn danger small" onclick="delEssay(\''+e.id+'\')">Delete essay</button></div></div>';
  $("main").innerHTML=h;
  $("etx").oninput=function(){ e.text=this.value; e.words=words(e.text); save(); };
  $("enote").oninput=function(){ e.notes=this.value; save(); };
  CRIT.forEach(function(c){ Array.prototype.forEach.call(document.querySelectorAll('input[name="s_'+c[0]+'"]'),function(r){ r.onchange=function(){ e.scores[c[0]]=+r.value; save(); pageEssay(id); }; }); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ec]"),function(c){ c.onchange=function(){ e.checks[c.dataset.ec]=c.checked; save(); }; });
}
function copyEssay(id){
  var e=S.essays.filter(function(x){return x.id===id;})[0];
  var txt="Please mark this STAT Written English essay (Part "+e.part+": "+(e.part==="A"?"argue a view on a public issue":"personal reflection")+") against ACER's three criteria: thought and content; structure and organisation; expression, style and mechanics. Give a score out of 5 for each, my top three fixes, and rewrite my weakest paragraph to show the improvement.\n\nPrompt: \""+e.prompt+"\"\n\nEssay ("+e.words+" words):\n"+e.text;
  function ok(){ toast("Copied. Paste it wherever you're getting feedback."); }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,fallback); else fallback();
  function fallback(){ var t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand("copy"); ok();}catch(x){ alert("Copy failed. Select the essay text and copy it manually."); } t.remove(); }
}
function delEssay(id){ if(!confirm("Delete this essay permanently?")) return; S.essays=S.essays.filter(function(x){return x.id!==id;}); save(); location.hash="#/essays"; }

/* ---------- router ---------- */
var cur={page:"dash"};
function route(keepScroll){
  var hsh=location.hash.replace(/^#\/?/,""), p=hsh.split("/");
  if(EXAM && !(p[0]==="l" && p[1]===EXAM.lid)){ if(!confirm("Leave the timed attempt? It won't be saved.")){ location.hash="#/l/"+EXAM.lid; return; } clearInterval(EXAM.timer); EXAM=null; }
  if(p[0]==="l" && LESSON[p[1]]){ cur={page:"lesson",lid:p[1]}; pageLesson(p[1]); }
  else if(p[0]==="guide"){ cur={page:"guide"}; pageGuide(); }
  else if(p[0]==="errors"){ cur={page:"errors"}; pageErrors(); }
  else if(p[0]==="essays"){ cur={page:"essays"}; pageEssays(); }
  else if(p[0]==="essay"&&p[1]){ cur={page:"essays"}; pageEssay(p[1]); }
  else { cur={page:"dash"}; pageDash(); }
  renderSide(cur); toggleSide(false);
  if(!keepScroll) window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){ route(); });
window.addEventListener("beforeunload",function(e){ if(EXAM||ES){ e.preventDefault(); e.returnValue=""; } });
route();
</script>
