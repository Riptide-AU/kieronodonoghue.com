Q.s4l7 = Q.s4l7.concat([{"id": "s4acer", "title": "Official ACER sample questions: quantitative units", "timed": 25, "intro": "Open ACER’s free <a href=\"https://stat.acer.org/files/STAT_Sample_Questions_2024.pdf\" target=\"_blank\" rel=\"noopener\">STAT sample questions (PDF)</a> and answer Units 2, 4, 6 and 8 there. Pick the letter you chose here. No calculator. First use: Week 1 diagnostic. Second use: Week 15 or 16 in Exam mode (25 minutes).", "items": [{"t": "mc", "q": "Unit 2 (letter grid), question 5: the value of Q", "o": ["A", "B", "C", "D"], "a": 1, "e": "Row 2 is four Ks = 28, so K = 7. Row 3 is 2K + 2Q = 32, so 2Q = 18 and Q = 9. Start with the row that has only one letter.", "fx": 1}, {"t": "mc", "q": "Unit 2, second question (the value of X; also printed as “6” in the booklet)", "o": ["A", "B", "C", "D"], "a": 0, "e": "ACER’s answer list leaves this out, so here is the working. From row 4, Z + L = 40 − 7 − 9 = 24. From row 1, L + 2Z = 46 − 9 = 37, so Z = 13 and L = 11. X = Z + K + Q + L = 13 + 7 + 9 + 11 = 40.", "fx": 1}, {"t": "mc", "q": "Unit 4 (firefighters and heat), question 9", "o": ["A", "B", "C", "D"], "a": 2, "e": "The table shows a gain from radiation and a loss from conduction/convection in both columns.", "fx": 1}, {"t": "mc", "q": "Unit 4, question 10", "o": ["A", "B", "C", "D"], "a": 0, "e": "In heat balance, gains equal losses. With no fire: gains 51 + 561 = 612; known loss 80; so sweat must remove 612 − 80 = 532.", "fx": 1}, {"t": "mc", "q": "Unit 4, question 11", "o": ["A", "B", "C", "D"], "a": 2, "e": "Sweat loss rises from 532 to 688. Metabolism falls (561 to 488) and conduction loss falls (80 to 60).", "fx": 1}, {"t": "mc", "q": "Unit 6 (fire station schedules), question 13", "o": ["A", "B", "C", "D"], "a": 1, "e": "Count how often each firefighter appears. Only schedule II has every firefighter exactly three times.", "fx": 1}, {"t": "mc", "q": "Unit 6, question 14", "o": ["A", "B", "C", "D"], "a": 2, "e": "Each of the 3 objects must appear twice in 6 sets. 1 and 2 already appear twice, so the last set is {3}.", "fx": 1}, {"t": "mc", "q": "Unit 6, question 15", "o": ["A", "B", "C", "D"], "a": 1, "e": "Each object must appear twice. So far 1 appears once, 2 twice, 3 once, so the last set needs 1 and 3.", "fx": 1}, {"t": "mc", "q": "Unit 6, question 16", "o": ["A", "B", "C", "D"], "a": 3, "e": "Count each number in the first 11 sets: 3, 5 and 7 appear only three times; the rest already appear four. The last set is {3, 5, 7}.", "fx": 1}, {"t": "mc", "q": "Unit 8 (mussels), question 21", "o": ["A", "B", "C", "D"], "a": 2, "e": "Chain the graphs: Figure 2 turns 80 g into a shell length, then Figure 3 turns that length into an area.", "fx": 1}, {"t": "mc", "q": "Unit 8, question 22", "o": ["A", "B", "C", "D"], "a": 2, "e": "One drop height must break all three, so you need the largest of their required heights. On wet sand that is the smallest mussel (75 mm).", "fx": 1}, {"t": "mc", "q": "Unit 8, question 23", "o": ["A", "B", "C", "D"], "a": 1, "e": "Convert mass to length (Figure 2), then read the required height on wet sand (Figure 4). Only the heavier, longer mussel needs less than 2.5 m.", "fx": 1}, {"t": "mc", "q": "Unit 8, question 24", "o": ["A", "B", "C", "D"], "a": 0, "e": "At 80 mm, read both lines in Figure 4 and subtract. The gap is about 0.6 m.", "fx": 1}, {"t": "mc", "q": "Unit 8, question 25", "o": ["A", "B", "C", "D"], "a": 1, "e": "Three steps: mass to length (Figure 2), length to drop height on sand (Figure 4), then drop height and length to impact speed (Figure 1).", "fx": 1}]}]);
Q.s6l1 = [{"id": "s6va", "title": "Timed verbal set A (18 questions)", "timed": 30, "intro": "Week 17, Monday. Sit it in Exam mode: 30 minutes, about 100 seconds a question. Written in the STAT style; for real STAT questions, use the ACER sheets in Phases 3 and 4.", "items": [{"t": "mc", "q": "The writer’s remark that the main street “had not so much changed as shrunk” suggests that", "o": ["the town had lost much of its population.", "her memory had kept the street at a child’s scale.", "many of the old buildings had been demolished.", "the street had been narrowed to slow the traffic."], "a": 1, "e": "The next sentence explains it: she carried the street “at the size a child gives to things”.", "s": "<p><i>In this passage from a memoir, the writer returns to the country town where she grew up, after thirty years in the city.</i></p><p>The main street had not so much changed as shrunk. I had carried it with me for thirty years at the size a child gives to things, and now it would barely fill the windscreen. The bank had become a café that sold the kind of coffee my father used to call ‘city water’, and the saddlery was a shop for candles that smelt of fruit nobody in the district had ever grown. Only the war memorial was exactly where I had left it, the bronze soldier still looking past the traffic at something none of us could see.</p><p>I had expected to feel sorrow, and was ready for it, the way you brace for a cold sea. Instead I felt something closer to embarrassment, as if I had been caught reading someone else’s letters. The town had gone on living without asking my permission. People I did not know walked into shops I did not recognise and were greeted by name. It occurred to me, standing outside the café with a coffee I had paid too much for, that the town I mourned had never existed in quite the form I remembered it; I had simply been too small to see its edges. The newcomers were not trespassers on my past. If anything, I was a tourist in theirs.</p>"}, {"t": "mc", "q": "The description of the candle shop mainly conveys the writer’s sense that", "o": ["tourism has made the town prosperous.", "the new businesses have little connection to the district.", "local farming has declined.", "the shops are too expensive."], "a": 1, "e": "Candles smelling of fruit “nobody in the district had ever grown”: the new trade belongs somewhere else."}, {"t": "mc", "q": "The comparison with “reading someone else’s letters” suggests that the writer feels she is", "o": ["guilty for having left the town.", "curious about the lives of the newcomers.", "intruding on a life that no longer belongs to her.", "angry that the town has lost its privacy."], "a": 2, "e": "Reading others’ letters is intruding on private lives that aren’t yours."}, {"t": "mc", "q": "The final sentence suggests that the writer has come to see", "o": ["the newcomers as the cause of the town’s decline.", "herself as an outsider in the town as it now is.", "tourism as harmful to country towns.", "her childhood in the town as unhappy."], "a": 1, "e": "She reverses the idea that newcomers are “trespassers”: she is the visitor now."}, {"t": "mc", "q": "The quotation suggests that", "o": ["people who seek power are already corrupt.", "the risk of corruption grows with the amount of power held.", "corruption can never be prevented.", "only absolute rulers are corrupt."], "a": 1, "e": "“Tends to” for some power, “absolutely” for absolute power: the more power, the greater the risk.", "s": "<blockquote>‘Power tends to corrupt, and absolute power corrupts absolutely.’<br><span class=\"small\">— Lord Acton, 1887</span></blockquote>"}, {"t": "mc", "q": "The speaker criticises cynics for", "o": ["being too generous with money.", "confusing what something costs with what it is worth.", "caring too much about other people’s opinions.", "being poor judges of price."], "a": 1, "e": "Price and value are different things; the cynic only sees the first.", "s": "<blockquote>‘A cynic is a man who knows the price of everything and the value of nothing.’<br><span class=\"small\">— Oscar Wilde, <i>Lady Windermere’s Fan</i></span></blockquote>"}, {"t": "mc", "q": "The quotation mainly suggests that", "o": ["patriotism is always dishonest.", "dishonest people may appeal to patriotism when they have no better defence.", "scoundrels are rarely patriotic.", "patriotism is losing its appeal."], "a": 1, "e": "A “last refuge” is where you go when nothing else is left. It doesn’t say all patriotism is dishonest (too extreme).", "s": "<blockquote>‘Patriotism is the last refuge of a scoundrel.’<br><span class=\"small\">— Samuel Johnson, 1775</span></blockquote>"}, {"t": "mc", "q": "Under which model is it impossible for a student to be penalised for their first late submission?", "o": ["I", "II", "III", "IV"], "a": 2, "e": "Only model III guarantees no penalty the first time.", "s": "<p>The table summarises how five universities deal with assignments that are submitted late.</p><table><tr><th>Model</th><th>Who reviews a late submission</th><th>Possible outcome</th></tr><tr><td>I</td><td>Lecturer</td><td>Penalty <b>or</b> no penalty</td></tr><tr><td>II</td><td>Lecturer</td><td>Penalty <b>and</b> resubmission</td></tr><tr><td>III</td><td>Lecturer</td><td>No penalty for a first late submission; penalty for any after that</td></tr><tr><td>IV</td><td>Faculty office</td><td>Penalty <b>or</b> no penalty</td></tr><tr><td>V</td><td>Faculty office</td><td>Penalty <b>and</b> resubmission</td></tr></table>"}, {"t": "mc", "q": "Models I and II differ from models IV and V in", "o": ["whether a penalty can be applied.", "who reviews the late submission.", "how severe the penalty is.", "whether the student may resubmit."], "a": 1, "e": "Read the columns: the outcomes repeat across the pairs (I matches IV, II matches V); only the reviewer changes."}, {"t": "mc", "q": "From a student’s point of view, which pair of models has the same range of possible outcomes?", "o": ["I and II", "II and IV", "II and V", "III and V"], "a": 2, "e": "II and V both give “penalty and resubmission”. (I and IV also match, but that pair isn’t offered.)"}, {"t": "mc", "q": "The writer’s main purpose is to", "o": ["argue that phones and devices are harmful.", "suggest that boredom may serve a useful purpose.", "show that boredom and hunger are the same.", "recommend that people seek out boredom."], "a": 1, "e": "The last option is ruled out in paragraph 3; the first is too narrow.", "s": "<p><i>The following passage is from an essay on boredom.</i></p><p>We have spent a generation treating boredom as a fault to be engineered away. Every queue, every bus trip, every pause between tasks can now be filled, and we fill it, usually without noticing that we have chosen to. The case against boredom seems obvious: it is unpleasant, and unpleasant states are presumably bad for us.</p><p>Yet the obvious case rests on a confusion between what is unpleasant and what is useless. Hunger is unpleasant too, but no one proposes to abolish it; its discomfort is the means by which the body announces a need. Boredom may work the same way. It is the mind’s report that its present surroundings offer nothing worth attending to, and its discomfort is what pushes us to look further: to daydream, to plan, to notice what we would otherwise pass over. A mind that is never bored is never sent on that search.</p><p>None of this means that boredom should be cultivated for its own sake, any more than we should go hungry to improve our appetite. The point is narrower. Each time we reach for a device to escape a minute of tedium, we are not removing a problem but silencing a messenger, and we should at least know what we are choosing not to hear.</p>"}, {"t": "mc", "q": "The writer compares boredom with hunger in order to", "o": ["show that something unpleasant can still be useful.", "prove that boredom is a physical condition.", "suggest that people should eat less.", "explain why boredom is worse than hunger."], "a": 0, "e": "Hunger is unpleasant but signals a need; boredom may do the same."}, {"t": "mc", "q": "The final paragraph mainly", "o": ["contradicts the argument of the second paragraph.", "introduces new scientific evidence.", "limits the argument so that it is not overstated.", "summarises the view the writer opposes."], "a": 2, "e": "“None of this means… The point is narrower” is a qualification."}, {"t": "mc", "q": "The writer’s argument depends on the assumption that", "o": ["most people own a device.", "the discomfort of boredom prompts the mind to look for something more worthwhile.", "daydreaming is always productive.", "boredom is more unpleasant than hunger."], "a": 1, "e": "If boredom’s discomfort did not push the mind to search, the “messenger” idea would fall over."}, {"t": "mc", "q": "Which two statements are most similar in their attitude to tradition?", "o": ["(i) and (ii)", "(i) and (iii)", "(ii) and (iii)", "(iii) and (iv)"], "a": 1, "e": "(i) and (iii) both give old customs the benefit of the doubt. (ii) and (iv) are both sceptical, but that pair isn’t offered.", "s": "<p>Consider statements (i) to (iv).</p><ol type=\"i\"><li>Old customs should be kept unless there is a strong reason to abandon them.</li><li>Each generation should judge inherited customs on their merits alone, without regard to their age.</li><li>That a practice has lasted for centuries is itself good evidence in its favour.</li><li>Tradition is merely the name we give to habits we have stopped questioning.</li></ol>"}, {"t": "mc", "q": "The resident’s remark about the baker mainly", "o": ["provides survey data to support the planner.", "uses one person’s experience to challenge the planner’s evidence.", "admits that the planner is right.", "raises the cost of the bike lane."], "a": 1, "e": "An anecdote set against a survey.", "s": "<p><i>A council planner and a local resident discuss a proposed bike lane.</i></p><p><b>Planner:</b> The new bike lane will take twelve parking spaces from the street, but our survey showed most shoppers arrive on foot or by bus.<br><b>Resident:</b> The survey was done on a weekday morning. Come on a Saturday and you’ll see where the shoppers come from.<br><b>Planner:</b> We counted on three Saturdays as well. The pattern held.<br><b>Resident:</b> Then explain why the baker says half her takings come from people who park out the front.<br><b>Planner:</b> She may be right about her shop. But we’re planning for the whole street, not for one business.<br><b>Resident:</b> That’s easy to say when it isn’t your business.</p>"}, {"t": "mc", "q": "The planner’s statement that “we counted on three Saturdays as well” is effective chiefly because it", "o": ["answers the resident’s objection to when the survey was taken.", "proves the baker is wrong.", "shows the planner is losing patience.", "introduces a new proposal."], "a": 0, "e": "The resident said the survey missed Saturdays; this removes that objection."}, {"t": "mc", "q": "The resident’s final remark suggests that the planner", "o": ["has a financial interest in the bike lane.", "will not bear the personal cost of the decision.", "has misread the survey.", "is not telling the truth."], "a": 1, "e": "It is easy to be impartial when you lose nothing."}]}, {"id": "s6qa", "title": "Timed quantitative set A (18 questions)", "timed": 30, "intro": "Week 17, Thursday. Exam mode, 30 minutes, no calculator. Have scrap paper ready.", "items": [{"t": "mc", "q": "The value of D is", "o": ["13", "14", "15", "17"], "a": 2, "e": "Row 1: four Bs = 44, so B = 11. Row 2: 22 + 2C = 30, so C = 4. Column 2: 11 + 11 + 4 + A = 32, so A = 6. Row 3: 6 + 4 + D + 11 = 36, so D = 15.", "s": "<p>In the grid below, different letters stand for different whole numbers less than 20. The numbers to the right of and below the grid are row and column totals. For example, B + B + C + C = 30.</p><table class=\"grid\"><tr><td>B</td><td>B</td><td>B</td><td>B</td><td><b>44</b></td></tr><tr><td>B</td><td>B</td><td>C</td><td>C</td><td><b>30</b></td></tr><tr><td>A</td><td>C</td><td>D</td><td>B</td><td><b>36</b></td></tr><tr><td>D</td><td>A</td><td>A</td><td>C</td><td><b>31</b></td></tr><tr><td><b>43</b></td><td><b>32</b></td><td><b>X</b></td><td><b>Y</b></td><td></td></tr></table>"}, {"t": "mc", "q": "The value of X is", "o": ["34", "35", "36", "38"], "a": 2, "e": "Column 3 is B + C + D + A = 11 + 4 + 15 + 6 = 36."}, {"t": "mc", "q": "In a dry week, the amount of water in the tank", "o": ["falls by 1,600 L.", "falls by 2,000 L.", "falls by 600 L.", "rises by 400 L."], "a": 0, "e": "400 − 900 − 1,100 = −1,600.", "s": "<p>A household collects rainwater in a 10,000-litre tank. The table shows the average amount of water gained or lost by the tank in a dry week and in a wet week.</p><table><tr><th>Process</th><th>Dry week</th><th>Wet week</th></tr><tr><td>Rain collected</td><td>gain of 400 L</td><td>gain of 2,600 L</td></tr><tr><td>Garden watering</td><td>loss of 900 L</td><td>loss of 150 L</td></tr><tr><td>Household use</td><td>loss of 1,100 L</td><td>loss of 1,100 L</td></tr><tr><td>Overflow</td><td>none</td><td>?</td></tr></table><p>In a wet week the tank starts and ends the week full.</p>"}, {"t": "mc", "q": "The amount lost by overflow in a wet week is", "o": ["1,050 L.", "1,350 L.", "1,450 L.", "2,450 L."], "a": 1, "e": "Starts and ends full, so gains = losses: 2,600 − 150 − 1,100 = 1,350."}, {"t": "mc", "q": "The tank is full at the start of a run of dry weeks. After how many dry weeks does it first hold less than 3,000 L?", "o": ["4", "5", "6", "7"], "a": 1, "e": "After 4 weeks: 10,000 − 6,400 = 3,600. After 5: 2,000."}, {"t": "mc", "q": "Which roster meets both rules?", "o": ["I", "II", "III", "IV"], "a": 1, "e": "Count each worker (Rule 1) and look for a repeated pair (Rule 2). Only II passes both.", "s": "<p>A civil construction crew has six workers (1 to 6). Each day from Monday to Saturday, two workers are rostered onto a site. The site agreement has two rules:</p><ul><li><b>Rule 1:</b> every worker works the same number of days.</li><li><b>Rule 2:</b> no pair of workers is rostered together more than once.</li></ul><table><tr><th></th><th>I</th><th>II</th><th>III</th><th>IV</th></tr><tr><td>Monday</td><td>{1,2}</td><td>{1,2}</td><td>{1,2}</td><td>{1,2}</td></tr><tr><td>Tuesday</td><td>{3,4}</td><td>{3,4}</td><td>{3,4}</td><td>{2,3}</td></tr><tr><td>Wednesday</td><td>{5,6}</td><td>{5,6}</td><td>{5,6}</td><td>{3,4}</td></tr><tr><td>Thursday</td><td>{1,3}</td><td>{1,3}</td><td>{1,4}</td><td>{4,5}</td></tr><tr><td>Friday</td><td>{2,4}</td><td>{2,5}</td><td>{2,3}</td><td>{5,6}</td></tr><tr><td>Saturday</td><td>{5,6}</td><td>{4,6}</td><td>{1,5}</td><td>{2,6}</td></tr></table>"}, {"t": "mc", "q": "Roster I breaks", "o": ["Rule 1 only.", "Rule 2 only.", "both rules.", "neither rule."], "a": 1, "e": "Everyone works twice, but {5,6} appears on Wednesday and Saturday."}, {"t": "mc", "q": "A smaller crew has four workers. If every possible pair must work together exactly once, with two workers each day, how many days are needed?", "o": ["4", "6", "8", "12"], "a": 1, "e": "List the pairs: 12, 13, 14, 23, 24, 34 = 6."}, {"t": "mc", "q": "With the original six workers, if every possible pair worked together exactly once, how many days would each worker work?", "o": ["3", "5", "6", "15"], "a": 1, "e": "Each worker pairs with each of the other 5 once."}, {"t": "mc", "q": "At which speed does the car use the least fuel per 100 km?", "o": ["60 km/h", "80 km/h", "100 km/h", "120 km/h"], "a": 1, "e": "The lowest point on the graph.", "s": "<p>The graph shows the fuel used by a car travelling on a flat highway at steady speeds.</p><svg viewBox=\"0 0 460 270\" width=\"100%\" style=\"max-width:460px;font:12px sans-serif\" role=\"img\" aria-label=\"Figure 1: Fuel use and speed\"><text x=\"230.0\" y=\"16\" text-anchor=\"middle\" font-weight=\"600\">Figure 1: Fuel use and speed</text><line x1=\"52\" x2=\"444\" y1=\"226.0\" y2=\"226.0\" stroke=\"#ddd\"/><text x=\"46\" y=\"230.0\" text-anchor=\"end\">4</text><line x1=\"52\" x2=\"444\" y1=\"201.2\" y2=\"201.2\" stroke=\"#ddd\"/><text x=\"46\" y=\"205.2\" text-anchor=\"end\">4.5</text><line x1=\"52\" x2=\"444\" y1=\"176.5\" y2=\"176.5\" stroke=\"#ddd\"/><text x=\"46\" y=\"180.5\" text-anchor=\"end\">5</text><line x1=\"52\" x2=\"444\" y1=\"151.8\" y2=\"151.8\" stroke=\"#ddd\"/><text x=\"46\" y=\"155.8\" text-anchor=\"end\">5.5</text><line x1=\"52\" x2=\"444\" y1=\"127.0\" y2=\"127.0\" stroke=\"#ddd\"/><text x=\"46\" y=\"131.0\" text-anchor=\"end\">6</text><line x1=\"52\" x2=\"444\" y1=\"102.2\" y2=\"102.2\" stroke=\"#ddd\"/><text x=\"46\" y=\"106.2\" text-anchor=\"end\">6.5</text><line x1=\"52\" x2=\"444\" y1=\"77.5\" y2=\"77.5\" stroke=\"#ddd\"/><text x=\"46\" y=\"81.5\" text-anchor=\"end\">7</text><line x1=\"52\" x2=\"444\" y1=\"52.8\" y2=\"52.8\" stroke=\"#ddd\"/><text x=\"46\" y=\"56.8\" text-anchor=\"end\">7.5</text><line x1=\"52\" x2=\"444\" y1=\"28.0\" y2=\"28.0\" stroke=\"#ddd\"/><text x=\"46\" y=\"32.0\" text-anchor=\"end\">8</text><line x1=\"52.0\" x2=\"52.0\" y1=\"28\" y2=\"226\" stroke=\"#eee\"/><text x=\"52.0\" y=\"242\" text-anchor=\"middle\">40</text><line x1=\"150.0\" x2=\"150.0\" y1=\"28\" y2=\"226\" stroke=\"#eee\"/><text x=\"150.0\" y=\"242\" text-anchor=\"middle\">60</text><line x1=\"248.0\" x2=\"248.0\" y1=\"28\" y2=\"226\" stroke=\"#eee\"/><text x=\"248.0\" y=\"242\" text-anchor=\"middle\">80</text><line x1=\"346.0\" x2=\"346.0\" y1=\"28\" y2=\"226\" stroke=\"#eee\"/><text x=\"346.0\" y=\"242\" text-anchor=\"middle\">100</text><line x1=\"444.0\" x2=\"444.0\" y1=\"28\" y2=\"226\" stroke=\"#eee\"/><text x=\"444.0\" y=\"242\" text-anchor=\"middle\">120</text><polyline fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2.5\" points=\"52.0,52.8 150.0,127.0 248.0,151.8 346.0,102.2 444.0,28.0\"/><circle cx=\"52.0\" cy=\"52.8\" r=\"4\" fill=\"#0f766e\"/><circle cx=\"150.0\" cy=\"127.0\" r=\"4\" fill=\"#0f766e\"/><circle cx=\"248.0\" cy=\"151.8\" r=\"4\" fill=\"#0f766e\"/><circle cx=\"346.0\" cy=\"102.2\" r=\"4\" fill=\"#0f766e\"/><circle cx=\"444.0\" cy=\"28.0\" r=\"4\" fill=\"#0f766e\"/><text x=\"248.0\" y=\"262\" text-anchor=\"middle\">speed (km/h)</text><text transform=\"translate(14,127.0) rotate(-90)\" text-anchor=\"middle\">fuel used (L per 100 km)</text></svg><p>Assume the car always uses fuel at the rate shown for its speed. No calculator.</p>"}, {"t": "mc", "q": "How much fuel does the car use on a 300 km trip at 100 km/h?", "o": ["18 L", "19.5 L", "21 L", "24 L"], "a": 1, "e": "6.5 L per 100 km × 3."}, {"t": "mc", "q": "How much more fuel is used on a 300 km trip at 120 km/h than at 80 km/h?", "o": ["2.5 L", "5 L", "7.5 L", "9 L"], "a": 2, "e": "(8.0 − 5.5) × 3 = 7.5."}, {"t": "mc", "q": "Fuel costs $2.00 per litre. The fuel cost of one hour of driving at 60 km/h is", "o": ["$3.60", "$6.00", "$7.20", "$12.00"], "a": 2, "e": "One hour at 60 km/h is 60 km: 6.0 × 0.6 = 3.6 L, × $2 = $7.20. The trap is $12.00 (fuel per 100 km × $2)."}, {"t": "mc", "q": "Who sits in seat 1?", "o": ["A", "C", "D", "E"], "a": 2, "e": "C must be in seat 2 or 4 (not 3, B is there). A is next to B, so A takes the other of 2 or 4. D and E fill seats 1 and 5, D on the left. Check E (seat 5) isn’t next to C: so C is in 2 and A in 4. Order: D C B A E.", "s": "<p>Five people (A, B, C, D and E) sit in a row of five seats numbered 1 to 5 from left to right.</p><ul><li>B sits in seat 3.</li><li>C does not sit at either end of the row.</li><li>A sits next to B.</li><li>D sits somewhere to the left of E.</li><li>E does not sit next to C.</li></ul>"}, {"t": "mc", "q": "Who sits next to both A and C?", "o": ["B", "D", "E", "nobody"], "a": 0, "e": "D C B A E."}, {"t": "mc", "q": "If the clue “B sits in seat 3” were removed, how many different seating orders would satisfy the other clues?", "o": ["2", "3", "4", "6"], "a": 2, "e": "ABCDE, BACDE, DCABE and DCBAE. When options are small numbers, listing systematically is fastest."}, {"t": "mc", "q": "With both taps open and the drain closed, how long does it take to fill the empty tank?", "o": ["1.5 hours", "2 hours", "4.5 hours", "9 hours"], "a": 1, "e": "Per hour: 1/6 + 1/3 = 1/2 of the tank.", "s": "<p>Tap P fills an empty tank in 6 hours. Tap Q fills the same tank in 3 hours. A drain empties a full tank in 4 hours. Each works at a steady rate.</p>"}, {"t": "mc", "q": "With both taps and the drain open, how long does it take to fill the empty tank?", "o": ["3 hours", "4 hours", "5 hours", "6 hours"], "a": 1, "e": "1/6 + 1/3 − 1/4 = 2/12 + 4/12 − 3/12 = 3/12 = 1/4 per hour."}]}, {"id": "s6vb", "title": "Timed verbal set B (18 questions)", "timed": 30, "intro": "Week 20, Monday. Exam mode, 30 minutes.", "items": [{"t": "mc", "q": "The critics’ main objection is that", "o": ["the improvements were too small to matter.", "other changes made in the same year could explain the improvements.", "teachers exaggerated how drowsy students were.", "attendance actually fell."], "a": 1, "e": "Free breakfasts and a new attendance officer are alternative causes.", "s": "<p><i>The following describes a change made by one school district.</i></p><p>A school district moved its secondary-school start time from 7:50 am to 8:40 am. In the following year, average attendance at the first lesson of the day rose from 88 per cent to 93 per cent, and the number of students reported for falling asleep in class halved. The district’s report concluded that the later start had improved students’ sleep and therefore their learning.</p><p>Critics noted that in the same year the district had introduced free breakfasts at all its secondary schools and appointed a new attendance officer. They also pointed out that sleep itself was never measured: the report inferred better sleep from attendance figures and from teachers’ reports of drowsiness.</p><p>Supporters replied that research elsewhere has found that teenagers’ body clocks shift later during adolescence, so an early start forces many of them to attend school before they are fully alert.</p>"}, {"t": "mc", "q": "Which finding, if true, would most strengthen the district’s conclusion?", "o": ["Attendance also rose at the district’s primary schools, whose start time did not change.", "A nearby district that introduced free breakfasts but kept the early start saw no improvement.", "The new attendance officer resigned during the year.", "Most teachers preferred the later start time."], "a": 1, "e": "It rules out breakfasts as the cause. The first option weakens the conclusion."}, {"t": "mc", "q": "The supporters’ reply mainly responds to", "o": ["the criticism that sleep was never measured, by giving a reason a later start could improve alertness.", "the criticism about free breakfasts.", "the appointment of the attendance officer.", "the cost of changing start times."], "a": 0, "e": "It offers a mechanism linking start time to alertness, filling the gap left by the missing sleep data."}, {"t": "mc", "q": "The district’s reasoning is best described as", "o": ["a firm conclusion drawn from a controlled comparison.", "a plausible conclusion resting on links that were not tested.", "a summary of students’ opinions.", "unrelated to any evidence."], "a": 1, "e": "There was evidence, but no control group and no sleep measure."}, {"t": "mc", "q": "“A world of doubt” suggests that the fence was also meant to keep out", "o": ["uncertainty and threats that could not be named.", "visitors from the city.", "bad weather.", "the speaker."], "a": 0, "e": "Goats and wind are physical; “doubt” is not, so the fence had a symbolic job too.", "s": "<p><i>The following is a short poem.</i></p><p><b>The Fence</b><br>My grandfather built this fence to keep things out:<br>the neighbour’s goats, the wind, a world of doubt.<br>He set each post as if it were a vow<br>and tested every wire. I’m older now<br>than he was then, and walk the boundary line<br>to find the goats long gone, the posts all mine,<br>the wire gone slack, and on the other side<br>the same grass growing, just as green, as wide.</p>"}, {"t": "mc", "q": "“As if it were a vow” suggests that the grandfather built the fence", "o": ["carelessly.", "with solemn commitment.", "reluctantly.", "in a hurry."], "a": 1, "e": "A vow is a serious promise."}, {"t": "mc", "q": "The final two lines suggest that the speaker has realised that", "o": ["the fence divided land that was not really different.", "the neighbour has taken over the farm.", "the grass needs attention.", "he should rebuild the fence."], "a": 0, "e": "“The same grass… just as green, as wide”: both sides are alike."}, {"t": "mc", "q": "The speaker suggests that", "o": ["fate decides who rules.", "people are responsible for their own low position.", "Brutus is to blame for others’ failures.", "astrology can predict the future."], "a": 1, "e": "“Not in our stars, but in ourselves”: we, not fate, are to blame.", "s": "<blockquote>‘The fault, dear Brutus, is not in our stars, / But in ourselves, that we are underlings.’<br><span class=\"small\">— William Shakespeare, <i>Julius Caesar</i></span></blockquote>"}, {"t": "mc", "q": "The quotation is mainly about", "o": ["the risks of education.", "the overconfidence that shallow knowledge can produce.", "the cost of schooling.", "the value of forgetting."], "a": 1, "e": "A little learning, not learning itself, is the danger.", "s": "<blockquote>‘A little learning is a dangerous thing.’<br><span class=\"small\">— Alexander Pope, <i>An Essay on Criticism</i>, 1711</span></blockquote>"}, {"t": "mc", "q": "By “that promise is precisely the problem”, the writer means that the compliment", "o": ["is insincere.", "implies that success should come without effort.", "is given too rarely.", "embarrasses the learner."], "a": 1, "e": "The promise was “more success… without much effort”.", "s": "<p><i>The following passage is from an opinion piece about praise.</i></p><p>Few compliments sound more generous than ‘You’re a natural.’ It praises not only what someone has done but what they are, and it seems to promise that more success will follow without much effort. That promise is precisely the problem.</p><p>A learner who is told that her success flows from talent has also learnt how to interpret failure. If ability is a gift, then a poor result is evidence that the gift was smaller than hoped, and the sensible response is to stop exposing it to further tests. A learner praised for practice draws a different lesson: a poor result shows that more practice is needed, a conclusion that invites effort rather than retreat.</p><p>It would be easy to overstate this. People do differ in aptitude, and pretending otherwise helps no one. But the compliment we choose tells the listener which part of their success they can control, and it seems perverse to direct their attention to the part they cannot.</p>"}, {"t": "mc", "q": "According to the writer, a learner praised for talent is likely to respond to failure by", "o": ["practising more.", "avoiding further challenges.", "asking for help.", "blaming the teacher."], "a": 1, "e": "“Stop exposing it to further tests.”"}, {"t": "mc", "q": "In the final paragraph the writer", "o": ["abandons the argument.", "accepts that aptitude differs but keeps the main argument.", "claims that aptitude does not exist.", "proposes a new kind of test."], "a": 1, "e": "A concession (“people do differ”) followed by “But…”"}, {"t": "mc", "q": "In the final sentence, “perverse” is closest in meaning to", "o": ["contrary to good sense.", "morally corrupt.", "unusual.", "amusing."], "a": 0, "e": "Directing attention to what can’t be controlled makes no sense."}, {"t": "mc", "q": "Which two statements are most similar in their attitude to work?", "o": ["(i) and (ii)", "(i) and (iii)", "(ii) and (iii)", "(iii) and (iv)"], "a": 1, "e": "(i) and (iii) value work only for what it gets you. (ii) and (iv) value the work itself, but that pair isn’t offered.", "s": "<p>Consider statements (i) to (iv).</p><ol type=\"i\"><li>Work is the price we pay for our leisure.</li><li>Someone who loves their work never feels they are working.</li><li>Labour has value only in what it produces.</li><li>The best part of any task is the doing of it, not the finishing.</li></ol>"}, {"t": "mc", "q": "The writer of Passage 2 would most likely agree that", "o": ["zoos do no conservation work.", "the conservation argument is used to justify more than it actually covers.", "captive breeding never succeeds.", "zoo tickets should be cheaper."], "a": 1, "e": "“Covers only a small share”: it’s stretched beyond what it supports.", "s": "<p><i>Two writers comment on zoos.</i></p><p><b>Passage 1</b></p><p>Modern zoos describe themselves as arks. Many endangered species now survive mainly in captive breeding programs, and some, such as the Arabian oryx, have been returned to the wild from zoo populations. Visitors’ ticket money pays for this work, and the sight of a living animal does more to win support for conservation than any documentary.</p><p><b>Passage 2</b></p><p>The ark argument covers only a small share of the animals zoos keep. Most species on display are not endangered, and most animals bred in captivity will never be released, because the habitats they would return to no longer exist. A zoo that spent its budget protecting habitat instead of displaying animals would save more species, but it would sell fewer tickets.</p>"}, {"t": "mc", "q": "Passages 1 and 2 agree that", "o": ["most zoo animals are endangered.", "ticket sales depend on displaying animals.", "wild habitats are secure.", "documentaries are ineffective."], "a": 1, "e": "Passage 1: visitors pay to see animals; Passage 2: fewer animals, fewer tickets."}, {"t": "mc", "q": "In Passage 2, “the ark argument” refers to the claim that", "o": ["zoos preserve species that would otherwise die out.", "zoos should be built near rivers.", "animals should be kept in pairs.", "zoos attract tourists."], "a": 0, "e": "An ark saves species from extinction (Passage 1’s opening)."}, {"t": "mc", "q": "Which of the following, if true, would most weaken the argument in Passage 2?", "o": ["Most zoos already spend a large share of their budgets protecting wild habitat.", "Some zoo animals are endangered.", "Visitors enjoy seeing animals.", "The Arabian oryx has been released."], "a": 0, "e": "Passage 2 claims zoos choose display over habitat; this contradicts it."}]}, {"id": "s6qb", "title": "Timed quantitative set B (18 questions)", "timed": 30, "intro": "Week 20, Thursday. Exam mode, 30 minutes, no calculator.", "items": [{"t": "mc", "q": "In how many of the six months did Northam receive more rain than Marden?", "o": ["2", "3", "4", "5"], "a": 2, "e": "March, April, May and June.", "s": "<p>The graph shows monthly rainfall at two towns, Marden and Northam, for the first six months of a year.</p><svg viewBox=\"0 0 460 280\" width=\"100%\" style=\"max-width:460px;font:12px sans-serif\" role=\"img\" aria-label=\"Figure 1: Monthly rainfall\"><text x=\"230.0\" y=\"16\" text-anchor=\"middle\" font-weight=\"600\">Figure 1: Monthly rainfall</text><rect x=\"58\" y=\"24\" width=\"12\" height=\"12\" fill=\"#0f766e\"/><text x=\"76\" y=\"34\">Marden</text><rect x=\"168\" y=\"24\" width=\"12\" height=\"12\" fill=\"#c2a35a\"/><text x=\"186\" y=\"34\">Northam</text><line x1=\"48\" x2=\"444\" y1=\"244.0\" y2=\"244.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"248.0\" text-anchor=\"end\">0</text><line x1=\"48\" x2=\"444\" y1=\"224.0\" y2=\"224.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"228.0\" text-anchor=\"end\">10</text><line x1=\"48\" x2=\"444\" y1=\"204.0\" y2=\"204.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"208.0\" text-anchor=\"end\">20</text><line x1=\"48\" x2=\"444\" y1=\"184.0\" y2=\"184.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"188.0\" text-anchor=\"end\">30</text><line x1=\"48\" x2=\"444\" y1=\"164.0\" y2=\"164.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"168.0\" text-anchor=\"end\">40</text><line x1=\"48\" x2=\"444\" y1=\"144.0\" y2=\"144.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"148.0\" text-anchor=\"end\">50</text><line x1=\"48\" x2=\"444\" y1=\"124.0\" y2=\"124.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"128.0\" text-anchor=\"end\">60</text><line x1=\"48\" x2=\"444\" y1=\"104.0\" y2=\"104.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"108.0\" text-anchor=\"end\">70</text><line x1=\"48\" x2=\"444\" y1=\"84.0\" y2=\"84.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"88.0\" text-anchor=\"end\">80</text><line x1=\"48\" x2=\"444\" y1=\"64.0\" y2=\"64.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"68.0\" text-anchor=\"end\">90</text><line x1=\"48\" x2=\"444\" y1=\"44.0\" y2=\"44.0\" stroke=\"#ddd\"/><text x=\"42\" y=\"48.0\" text-anchor=\"end\">100</text><rect x=\"59.9\" y=\"84.0\" width=\"19.1\" height=\"160.0\" fill=\"#0f766e\"/><rect x=\"81.0\" y=\"144.0\" width=\"19.1\" height=\"100.0\" fill=\"#c2a35a\"/><text x=\"81.0\" y=\"260\" text-anchor=\"middle\">Jan</text><rect x=\"125.9\" y=\"54.0\" width=\"19.1\" height=\"190.0\" fill=\"#0f766e\"/><rect x=\"147.0\" y=\"104.0\" width=\"19.1\" height=\"140.0\" fill=\"#c2a35a\"/><text x=\"147.0\" y=\"260\" text-anchor=\"middle\">Feb</text><rect x=\"191.9\" y=\"124.0\" width=\"19.1\" height=\"120.0\" fill=\"#0f766e\"/><rect x=\"213.0\" y=\"94.0\" width=\"19.1\" height=\"150.0\" fill=\"#c2a35a\"/><text x=\"213.0\" y=\"260\" text-anchor=\"middle\">Mar</text><rect x=\"257.9\" y=\"164.0\" width=\"19.1\" height=\"80.0\" fill=\"#0f766e\"/><rect x=\"279.0\" y=\"134.0\" width=\"19.1\" height=\"110.0\" fill=\"#c2a35a\"/><text x=\"279.0\" y=\"260\" text-anchor=\"middle\">Apr</text><rect x=\"323.9\" y=\"184.0\" width=\"19.1\" height=\"60.0\" fill=\"#0f766e\"/><rect x=\"345.0\" y=\"154.0\" width=\"19.1\" height=\"90.0\" fill=\"#c2a35a\"/><text x=\"345.0\" y=\"260\" text-anchor=\"middle\">May</text><rect x=\"389.9\" y=\"194.0\" width=\"19.1\" height=\"50.0\" fill=\"#0f766e\"/><rect x=\"411.0\" y=\"184.0\" width=\"19.1\" height=\"60.0\" fill=\"#c2a35a\"/><text x=\ ke=\"#555\"/><rect x=\"116\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"130\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"144\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"102\" y=\"24\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"116\" y=\"24\" width=\"13\" height=\"13\" fill=\"#fff\" stroke=\"#555\"/><rect x=\"130\" y=\"24\" width=\"13\" height=\"13\" fill=\"#fff\" stroke=\"#555\"/><rect x=\"144\" y=\"24\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"102\" y=\"38\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"116\" y=\"38\" width=\"13\" height=\"13\" fill=\"#fff\" stroke=\"#555\"/><rect x=\"130\" y=\"38\" width=\"13\" height=\"13\" fill=\"#fff\" stroke=\"#555\"/><rect x=\"144\" y=\"38\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"102\" y=\"52\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"116\" y=\"52\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"130\" y=\"52\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"144\" y=\"52\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><text x=\"130.0\" y=\"96\" text-anchor=\"middle\">Figure 2</text><rect x=\"208\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"222\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"236\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"250\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"264\" y=\"10\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"208\" y=\"24\" width=\"13\" height=\"13\" fill=\"#9aa3a8\" stroke=\"#555\"/><rect x=\"222\" y=\"24\" width=\"13\" height=\"13\" fill=\"#fff\" stroke=\"#555\"/><rect x=\"236\" y=\"24\" width=\"13\" height= var EXAM = null; // {quiz, lid, end, ans:{}, timer}
function renderQuiz(lid, q){
  var box=$("qz_"+q.id); if(!box) return;
  var exam = EXAM && EXAM.quiz.id===q.id;
  var answered=0, right=0, n=q.items.length;
  q.items.forEach(function(it,i){ var a=S.ans[qid(q,i)]; if(a&&a.ok!=null){ answered++; if(a.ok) right++; } });
  var h = '<div class="qhead"><h2 style="margin:12px 0 4px">'+esc(q.title)+'</h2>';
  if(!exam) h += '<div class="row">'+(q.timed?'<button class="btn small" onclick="startExam(\''+lid+'\',\''+q.id+'\')">Start exam mode ('+q.timed+' min)</button>':'')+(answered?'<button class="btn ghost small" onclick="resetQuiz(\''+lid+'\',\''+q.id+'\')">Start again</button>':'')+'</div>';
  h += '</div>';
  if(q.intro) h += '<p class="small muted">'+q.intro+'</p>';
  if(exam) h += '<div class="examstrip"><span><b>Exam mode</b> · answers are marked when you submit</span><span class="timer" id="tmr">--:--</span><button class="btn small" onclick="submitExam()">Submit</button></div>';
  else h += '<p class="small"><b>'+right+'</b> correct of '+answered+' answered · '+n+' questions</p>';
  if(q.stimulus) h += '<div class="stim">'+q.stimulus+'</div>';
  q.items.forEach(function(it,i){ h += qcard(lid,q,it,i,exam); });
  if(!exam && answered===n) h += '<div class="card"><span class="score">Score: '+right+' / '+n+' ('+Math.round(right/n*100)+'%)</span><p class="small muted" style="margin:4px 0 0">Saved to your results. Wrong answers are in your <a href="#/errors">error log</a>. Use “Start again” to retry later.</p></div>';
  box.innerHTML = h;
  wire(box,lid,q,exam);
  if(exam) tick();
}
function qcard(lid,q,it,i,exam){
  var id=qid(q,i), a = exam ? (EXAM.ans[id]? {v:EXAM.ans[id]} : null) : S.ans[id];
  var marked = !exam && a && a.ok!=null;
  var cls = marked ? (a.ok?' ok':' no') : '';
  var h = (it.s ? '<div class="stim">'+it.s+'</div>' : '') + '<div class="qcard'+cls+'" id="c_'+id+'"><div class="qn">Question '+(i+1)+'</div><div class="qstem">'+it.q+'</div>';
  if(it.t==="mc"){
    (it.fx ? it.o.map(function(_,k){return k;}) : order(it.o.length, hash(id))).forEach(function(oi){
      var sel = a && +a.v===oi, c='';
      if(marked){ if(oi===it.a) c=' right'; else if(sel) c=' wrong'; } else if(sel) c=' sel';
      h += '<label class="opt'+c+'"><input type="radio" name="r_'+id+'" value="'+oi+'"'+(sel?' checked':'')+(marked?' disabled':'')+'><span>'+it.o[oi]+'</span></label>';
    });
    if(marked) h += '<div class="fb '+(a.ok?'ok':'no')+'">'+(a.ok?'Correct. ':'Not quite. The answer is: <b>'+it.o[it.a]+'</b>. ')+esc(it.e)+'</div>';
  } else if(it.t==="num"){
    h += '<div class="numrow"><input type="text" id="i_'+id+'" value="'+esc(a?a.v:"")+'" placeholder="Your answer"'+(marked?' disabled':'')+' autocomplete="off">'+(exam||marked?'':'<button class="btn small" data-chk="'+i+'">Check</button>')+'</div>';
    if(marked) h += '<div class="fb '+(a.ok?'ok':'no')+'">'+(a.ok?'Correct. ':'Not quite. The answer is <b>'+esc(it.show)+'</b>. ')+esc(it.e)+(a.ok?'':' <button class="linkbtn" data-override="'+i+'">I was right (format difference)</button>')+'</div>';
  } else {
    h += '<textarea id="i_'+id+'" rows="3" placeholder="Write your answer, then check it against the model answer"'+(marked?' disabled':'')+'>'+esc(a?a.v:"")+'</textarea>';
    if(!exam){
      if(marked) h += '<div class="fb '+(a.ok?'ok':'no')+'"><b>Model answer:</b> '+it.m+'<br><span class="small">You marked this '+(a.ok?'right':'as needing work')+'.</span></div>';
      else if(a && a.shown) h += '<div class="fb info"><b>Model answer:</b> '+it.m+'</div><div class="row" style="margin-top:8px"><button class="btn small" data-self="1" data-i="'+i+'">I got it right</button><button class="btn ghost small" data-self="0" data-i="'+i+'">Not quite</button></div>';
      else h += '<div style="margin-top:8px"><button class="btn small" data-show="'+i+'">Show model answer</button></div>';
    }
  }
  return h+'</div>';
}
function wire(box,lid,q,exam){
  q.items.forEach(function(it,i){
    var id=qid(q,i);
    if(it.t==="mc") Array.prototype.forEach.call(box.querySelectorAll('input[name="r_'+id+'"]'),function(r){ r.onchange=function(){ if(exam){ EXAM.ans[id]=r.value; markSel(box,id); } else record(lid,q,i,r.value,+r.value===it.a); }; });
    var inp=box.querySelector("#i_"+cssId(id));
    if(inp){ inp.oninput=function(){ if(exam) EXAM.ans[id]=inp.value; else if(it.t==="self"){ var a=S.ans[id]||(S.ans[id]={ok:null}); a.v=inp.value; a.ts=Date.now(); save(); } };
      if(it.t==="num"&&!exam) inp.onkeydown=function(e){ if(e.key==="Enter"){ e.preventDefault(); doCheck(lid,q,i); } }; }
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-chk]"),function(b){ b.onclick=function(){ doCheck(lid,q,+b.dataset.chk); }; });
  Array.prototype.forEach.call(box.querySelectorAll("[data-override]"),function(b){ b.onclick=function(){ var i=+b.dataset.override, id=qid(q,i); S.ans[id].ok=true; S.ans[id].ts=Date.now(); dropErrors(function(e){return e.id===id;}); save(); renderQuiz(lid,q); renderSide(cur); }; });
  Array.prototype.forEach.call(box.querySelectorAll("[data-show]"),function(b){ b.onclick=function(){ var i=+b.dataset.show,id=qid(q,i),inp=box.querySelector("#i_"+cssId(id)); S.ans[id]={v:inp?inp.value:"",ok:null,shown:true,ts:Date.now()}; save(); renderQuiz(lid,q); }; });
  Array.prototype.forEach.call(box.querySelectorAll("[data-self]"),function(b){ b.onclick=function(){ var i=+b.dataset.i, inp=box.querySelector("#i_"+cssId(qid(q,i))); record(lid,q,i,inp?inp.value:"",b.dataset.self==="1"); }; });
}
function cssId(s){ return s.replace(/[^\w-]/g,"\\$&"); }
function markSel(box,id){ Array.prototype.forEach.call(box.querySelectorAll('input[name="r_'+id+'"]'),function(r){ r.parentNode.classList.toggle("sel",r.checked); }); }
function doCheck(lid,q,i){ var id=qid(q,i), v=$("i_"+id).value, ok=checkNum(q.items[i],v); if(ok===null){ toast("Type an answer first"); return; } record(lid,q,i,v,ok); }
function record(lid,q,i,v,ok,quiet){
  var id=qid(q,i), it=q.items[i];
  S.ans[id]={v:v,ok:ok,date:today(),ts:Date.now()};
  if(!ok) logError(lid,q,i,v);
  else dropErrors(function(e){ return e.id===id && e.date===today(); });
  if(!quiet){
    var n=q.items.length, done=q.items.every(function(_,k){ var a=S.ans[qid(q,k)]; return a&&a.ok!=null; });
    if(done && !S.attempts.some(function(t){return t.quiz===q.id&&t.mode==="exam"&&t.date===today();})){ var sc=q.items.filter(function(_,k){return S.ans[qid(q,k)].ok;}).length; S.attempts.push({quiz:q.id,lid:lid,title:q.title,score:sc,total:n,date:today(),mode:"practice"}); }
    save(); renderQuiz(lid,q); renderSide(cur);
    var c=$("c_"+id); if(c&&!done) c.scrollIntoView({block:"nearest"});
  }
}
function yourText(it,v){ return it.t==="mc" ? (v===""||v==null?"(no answer)":strip(it.o[+v])) : (v||"(no answer)"); }
function rightText(it){ return it.t==="mc" ? strip(it.o[it.a]) : it.t==="num" ? it.show : strip(it.m); }
function dropErrors(pred){ S.errors=S.errors.filter(function(e){ if(pred(e)){ S.del["err:"+e.id+"|"+e.date]=Date.now(); return false; } return true; }); }
function logError(lid,q,i,v){
  var id=qid(q,i), it=q.items[i];
  S.errors=S.errors.filter(function(e){ return !(e.id===id && e.date===today()); });
  S.errors.push({id:id,date:today(),lid:lid,quiz:q.title,skill:LESSON[lid].skill,q:strip(it.q).slice(0,400),your:yourText(it,v),right:rightText(it),note:"",ts:Date.now()});
}
function resetQuiz(lid,qzId){ var q=quizzes(lid).filter(function(x){return x.id===qzId;})[0]; if(!confirm("Clear your answers for “"+q.title+"” and try again? Your past score and error log stay.")) return; q.items.forEach(function(_,i){ var k=qid(q,i); delete S.ans[k]; S.del["ans:"+k]=Date.now(); }); save(); renderQuiz(lid,q); }
function startExam(lid,qzId){
  var q=quizzes(lid).filter(function(x){return x.id===qzId;})[0];
  if(!confirm("Start a timed attempt: "+q.items.length+" questions in "+q.timed+" minutes. Answers are marked when you submit (or when time runs out).")) return;
  EXAM={quiz:q,lid:lid,start:Date.now(),end:Date.now()+q.timed*60000,ans:{}};
  renderQuiz(lid,q); $("qz_"+q.id).scrollIntoView();
  EXAM.timer=setInterval(tick,1000);
}
function tick(){ if(!EXAM) return; var t=$("tmr"); var left=Math.max(0,EXAM.end-Date.now()), m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
  if(t){ t.textContent=m+":"+String(s).padStart(2,"0"); t.classList.toggle("low",left<120000); }
  if(left<=0){ toast("Time's up!"); submitExam(true); } }
function submitExam(auto){
  if(!EXAM) return; if(!auto && !confirm("Submit and see your marks?")) return;
  clearInterval(EXAM.timer); var q=EXAM.quiz, lid=EXAM.lid, sc=0, selfQ=0;
  q.items.forEach(function(it,i){ var id=qid(q,i), v=EXAM.ans[id]; if(v==null) v="";
    if(it.t==="mc"){ var ok=v!==""&&+v===it.a; record(lid,q,i,v,ok,true); if(ok) sc++; }
    else if(it.t==="num"){ var ok2=!!checkNum(it,v); record(lid,q,i,v,ok2,true); if(ok2) sc++; }
    else { S.ans[id]={v:v,ok:null,shown:true,ts:Date.now()}; selfQ++; } });
  S.attempts.push({quiz:q.id,lid:lid,title:q.title,score:sc,total:q.items.length-selfQ,date:today(),mode:"exam",secs:Math.round((Date.now()-EXAM.start)/1000)});
  EXAM=null; save(); renderQuiz(lid,q); renderSide(cur);
  toast("Score: "+sc+" / "+(q.items.length-selfQ)+(selfQ?" (+"+selfQ+" to self-mark)":""));
}

function pickPrompts(part){ var th=PROMPTS[part], keys=Object.keys(th), k=keys[Math.floor(Math.random()*keys.length)]; return {theme:k, list:th[k]}; }
function essayStart(mode,mins){
  ES={mode:mode,mins:mins,parts:(mode==="AB"?["A","B"]:[mode]).map(function(p){ var pp=pickPrompts(p); return {part:p,theme:pp.theme,options:pp.list,prompt:null,text:""}; }),end:null,timer:null,over:false};

function essayWrite(){
  var h=topbar()+'<h1>'+(ES.mode==="AB"?'Full Written English test':'Part '+ES.mode+' essay')+'</h1>';

function mergeState(a, b){
  a = Object.assign(blank(), a || {}); b = Object.assign(blank(), b || {});

  if (ra > (b.updated || 0)) return JSON.parse(JSON.stringify(a));
  var newer = (a.updated || 0) >= (b.updated || 0) ? a : b, older = newer === a ? b : a;

  o.name = newer.name || older.name; o.start = newer.start || older.start; if ((a.statTs||0) >= (b.statTs||0)) { o.statDate = a.statDate || ""; o.statTs = a.statTs || 0; } else { o.statDate = b.statDate || ""; o.statTs = b.statTs || 0; }
  o.updated = Math.max(a.updated || 0, b.updated || 0);

  [older.done, newer.done].forEach(function(d){ Object.keys(d || {}).forEach(function(k){ if (d[k]) o.done[k] = true; }); });

var SCHED_DAYS = [["mon","Mon",0],["tue","Tue",1],["wed","Wed",2],["thu","Thu",3],["sat","Sat",5]];

function cellLinks(s){
  return s.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, function(_, t, txt){
    var href = t.charAt(0)==="#" ? t : "#/l/" + t.replace("#", "/");
    return '<a href="'+href+'">'+txt+'</a>';
  });
}
function ymd(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function addDays(d,n){ var x=new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); return x; }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtD(d, yr){ return d.toLocaleDateString("en-AU", yr ? {weekday:"short", day:"numeric", month:"short", year:"numeric"} : {day:"numeric", month:"short"}); }
// Monday of week n of the plan, counting back from the STAT date (test falls in week 24)
function weekMonday(n){
  var t=ymd(S.statDate); if(!t) return null;
  var mon24=addDays(t, -((t.getDay()+6)%7));
  return addDays(mon24, -7*(24-n));
}
// Plan week today falls in, by the STAT date (can be <1 or >24)
function testWeekToday(){
  var m1=weekMonday(1); if(!m1) return null;
  var now=ymd(today());
  return Math.floor((now - m1)/864e5/7)+1;
}
function statCard(){
  var t=ymd(S.statDate), h='<div class="card" id="statcard"><h3 style="margin-top:0">Your STAT date</h3>';
  h+='<div class="row"><input type="date" id="statd" value="'+esc(S.statDate||"")+'" style="max-width:200px"><button class="btn small" onclick="saveStatDate()">Save</button>'+(t?'<button class="btn ghost small" onclick="clearStatDate()">Clear</button>':'')+'</div>';
  if(!t){ h+='<p class="small muted" style="margin:8px 0 0">Enter the date you sit the STAT and the schedule will show real dates, counting back from test week (Week 24).</p>'; return h+'</div>'; }
  var days=Math.round((t - ymd(today()))/864e5), tw=testWeekToday(), m1=weekMonday(1);
  h+='<p style="margin:10px 0 4px"><b>'+fmtD(t,true)+'</b> · '+(days>0? days+' days to go' : days===0 ? 'today. Good luck!' : 'this date has passed')+'</p>';
  if(days>0){
    if(tw<1) h+='<p class="small" style="margin:0">That’s more than 24 weeks away, so Week 1 starts on <b>'+fmtD(m1,true)+'</b>. Until then, daily reading and vocabulary are a great head start.</p>';
    else h+='<p class="small" style="margin:0">Counting back from your test, you should be in <b>Week '+Math.min(tw,24)+'</b> this week.'+(tw>1?' The plan started on '+fmtD(m1,true)+'.':'')+'</p>';
    var wn=weekNow();
    if(S.start && wn!==null && tw>=1 && wn!==Math.min(tw,24)) h+='<p class="small" style="margin:6px 0 0">Your course start date puts you in Week '+wn+'. <button class="linkbtn" onclick="alignStart()">Line it up with your test date</button> (start date becomes '+fmtD(m1,true)+').</p>';
    else if(!S.start) h+='<p class="small" style="margin:6px 0 0"><button class="linkbtn" onclick="alignStart()">Use '+fmtD(m1,true)+' as your course start date</button> so the dashboard shows the right week.</p>';
    if(tw>1 && tw<=24) h+='<p class="small muted" style="margin:6px 0 0">Starting late? Keep the order of the weeks but move faster through what you already know. Never skip Phase 3 and 4 practice.</p>';
  }
  return h+'</div>';
}
function saveStatDate(){ var v=$("statd").value; if(!ymd(v)){ toast("Pick a date first"); return; } S.statDate=v; S.statTs=Date.now(); save(); route(true); toast("STAT date saved"); }
function clearStatDate(){ S.statDate=""; S.statTs=Date.now(); save(); route(true); }
function alignStart(){ var m1=weekMonday(1); if(!m1) return; S.start=isoDate(m1); save(); route(true); toast("Course start date updated"); }

function pageSchedule(){
  var tw=testWeekToday(), wn = tw!==null ? tw : weekNow(), h=topbar()+'<h1>Course schedule</h1><p class="sub">All 24 weeks, day by day. Links take you to the lesson, quiz or tool for that session. Every day: '+cellLinks(DAILY1)+'. Sunday is a rest day.</p>';
  h+=statCard();
  h+='<div class="content"><table class="sched"><tr><th>Week</th>'+SCHED_DAYS.map(function(d){return '<th>'+d[1]+'</th>';}).join("")+'</tr>';
  SCHED.forEach(function(r){
    var m=weekMonday(r.w);
    if(r.ph) h+='<tr class="phrow"><td colspan="6">'+r.ph+'</td></tr>';
    h+='<tr id="wk'+r.w+'"'+(wn===r.w?' class="nowrow"':'')+'><td><b>'+r.w+(r.star?' ★':'')+'</b>'+(m?'<div class="small muted">'+fmtD(m)+'</div>':'')+(wn===r.w?'<div class="small"><b>This week</b></div>':'')+'</td>';
    SCHED_DAYS.forEach(function(d){
      var txt=cellLinks(r[d[0]]);
      if(r.w===24 && d[0]==="sat" && S.statDate) txt='<b>Test day</b>: '+fmtD(ymd(S.statDate),true)+' (rest on the days in between)';
      h+='<td>'+(m?'<div class="small muted">'+fmtD(addDays(m,d[2]))+'</div>':'')+txt+'</td>';
    });
    h+='</tr>';
  });
  h+='</table><p class="small muted">★ Weeks with an official ACER practice test. Benchmarks are tracked on the <a href="#/">Dashboard</a>.</p></div>';
  $("main").innerHTML=h;
  if(wn>=1 && wn<=24){ var row=$("wk"+wn); if(row && !location.hash.match(/#\/schedule\/top/)) setTimeout(function(){ row.scrollIntoView({block:"center"}); },0); }
}
// Adds real dates to the Practice schedule table (lesson s6l1)
function datePracticeTable(){
  var rc=document.querySelector("#main .rescard"); if(!rc) return;
  rc.insertAdjacentHTML("afterend", statCard());
  if(!S.statDate) return;
  var tb=rc.parentNode.querySelector("table"); if(!tb) return;
  Array.prototype.forEach.call(tb.querySelectorAll("tr"), function(tr){
    var c=tr.children, m=/^(\d+)/.exec((c[0]&&c[0].textContent||"").trim());
    if(!m || c.length<6) return;
    var mon=weekMonday(+m[1]); if(!mon) return;
    c[0].insertAdjacentHTML("beforeend",'<div class="small muted">'+fmtD(mon)+'</div>');
    [0,1,2,3,5].forEach(function(off,k){ c[k+1].insertAdjacentHTML("afterbegin",'<div class="small muted">'+fmtD(addDays(mon,off))+'</div>'); });
    if(+m[1]===24) c[5].innerHTML='<div class="small muted">'+fmtD(addDays(mon,5))+'</div><b>Test day</b>: '+fmtD(ymd(S.statDate),true)+' (rest on the days in between)';
  });
}

/* ---------- router ---------- */
var cur={page:"dash"};
function route(keepScroll){
  if(SY.pending && !EXAM && !ES){ applyRemote(SY.pending); SY.pending=null; }
  var hsh=location.hash.replace(/^#\/?/,""); if(/access_token=|error_description=/.test(hsh)) hsh=""; var p=hsh.split("/");
  if(EXAM && !(p[0]==="l" && p[1]===EXAM.lid)){ if(!confirm("Leave the timed attempt? It won't be saved.")){ location.hash="#/l/"+EXAM.lid; return; } clearInterval(EXAM.timer); EXAM=null; }
  if(p[0]==="l" && LESSON[p[1]]){ cur={page:"lesson",lid:p[1]}; pageLesson(p[1]); }
  else if(p[0]==="guide"){ cur={page:"guide"}; pageGuide(); }
  else if(p[0]==="schedule"){ cur={page:"schedule"}; pageSchedule(); }
  else if(p[0]==="account"){ cur={page:"account"}; pageAccount(); }
  else if(p[0]==="settings"){ cur={page:"settings"}; pageSettings(); }
  else if(p[0]==="errors"){ cur={page:"errors"}; pageErrors(); }
  else if(p[0]==="essays"){ cur={page:"essays"}; pageEssays(); }
  else if(p[0]==="essay"&&p[1]){ cur={page:"essays"}; pageEssay(p[1]); }
  else { cur={page:"dash"}; pageDash(); }
  renderSide(cur); toggleSide(false);
  if(!keepScroll) window.scrollTo(0,0);
  if(p[0]==="l" && p[2]){ var qe=$("qz_"+p[2]); if(qe) setTimeout(function(){ qe.scrollIntoView(); },0); }
}
window.addEventListener("hashchange",function(){ route(); });
window.addEventListener("beforeunload",function(e){ if(EXAM||ES){ e.preventDefault(); e.returnValue=""; } });
syncInit();
route();
</script>
