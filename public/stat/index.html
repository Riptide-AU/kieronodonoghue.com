with brackets in place of the letters: a ◆ b = (\n)² − ( ).</p></li>\n<li><p>Drop the numbers into the brackets in the right order: the first\nnumber replaces a, the second replaces b.</p></li>\n<li><p>With nested symbols, work from the innermost bracket\noutward.</p></li>\n<li><p>For \"solve for\" questions, substitute what you know and solve the\nequation (Sub-course 1, Lesson 6).</p></li>\n</ol><h3 id=\"worked-examples\">Worked examples</h3><ol type=\"1\">\n<li><p>a ◆ b = a² − b. Find 3 ◆ 4: 3² − 4 = <strong>5</strong>.</p></li>\n<li><p>Find (2 ◆ 1) ◆ 3: inside first, 2² − 1 = 3; then 3 ◆ 3 = 9 − 3 =\n<strong>6</strong>.</p></li>\n<li><p>Body mass index = mass (kg) ÷ height² (m). For 80 kg and 2 m: 80\n÷ 4 = <strong>20</strong>.</p></li>\n</ol>"}, {"id": "s4l5", "title": "Week 13: Spatial reasoning", "html": "<h3 id=\"learn-4\">Learn</h3><p>Spatial questions ask you to picture shapes moving, folding or being\nseen from another angle. <strong>Always sketch.</strong> Few people can\ndo these reliably in their head, and a 20-second drawing beats a\n2-minute stare.</p><ul>\n<li><p><strong>Cube nets:</strong> in a straight line of squares, faces\ntwo apart are opposite (1st and 3rd, 2nd and 4th). Opposite faces never\ntouch in the net.</p></li>\n<li><p><strong>Directions:</strong> clockwise = N → E → S → W. A 90°\nturn moves one step; 180° moves two.</p></li>\n<li><p><strong>Distances on a grid:</strong> north 3 then east 4 puts\nyou 5 from the start (a 3-4-5 right triangle). Also learn 6-8-10 and\n5-12-13.</p></li>\n<li><p><strong>Reflections:</strong> a vertical mirror swaps left and\nright (b ↔︎ d); a horizontal mirror swaps top and bottom (b ↔︎\np).</p></li>\n<li><p><strong>Mirror clocks:</strong> actual time = 11:60 minus the\nmirror time (a mirror 2:30 is really 9:30).</p></li>\n<li><p><strong>Painted cubes:</strong> in a cube cut into 3 × 3 × 3\nsmall cubes, corners have 3 painted faces (8 cubes), edges have 2 (12),\nface centres have 1 (6) and the centre has 0 (1).</p></li>\n</ul><h3 id=\"worked-example-1\">Worked example</h3><p>This net folds into a cube:</p><p>[1]<br/>\n[5] [2] [6]<br/>\n[3]<br/>\n[4]</p><p>In the column 1-2-3-4, faces two apart are opposite: <strong>1 and\n3</strong>, <strong>2 and 4</strong>. The side flaps 5 and 6 fold up to\nmeet each other across the cube, so <strong>5 and 6</strong> are\nopposite.</p>"}, {"id": "s4l6", "title": "Week 14: Logic puzzles", "html": "<h3 id=\"learn-5\">Learn</h3><p><strong>Ordering and seating:</strong> draw slots (_ _ _ _ _) and\nplace the most fixed clue first (\"E is last\"). Then add the clues that\nlink to what's already placed. Note every \"before\", \"left of\" or \"not\"\nas a symbol: A &lt; B, X ≠ Mon.</p><p><strong>If–then logic.</strong> Given \"If it rains, the match is\ncancelled\":</p><table>\n<colgroup>\n<col style=\"width: 40%\"/>\n<col style=\"width: 59%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>You learn…</th>\n<th>You can conclude…</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>It rained</td>\n<td>The match was cancelled ✓</td>\n</tr>\n<tr class=\"even\">\n<td>The match was not cancelled</td>\n<td>It did not rain ✓</td>\n</tr>\n<tr class=\"odd\">\n<td>The match was cancelled</td>\n<td>Nothing: it may have been cancelled for another reason ✗</td>\n</tr>\n<tr class=\"even\">\n<td>It did not rain</td>\n<td>Nothing ✗</td>\n</tr>\n</tbody>\n</table><p><strong>Venn diagrams:</strong> for two overlapping groups, total in\neither = A + B − both. Neither = total − (A + B − both).</p><h3 id=\"worked-example-2\">Worked example</h3><p>Five runners finish a race. A finished before B; B before D; C after\nD; E finished last. Order? Start with E in 5th place. Chain the rest: A\n&lt; B &lt; D &lt; C fills places 1 to 4. <strong>A, B, D, C,\nE.</strong></p>"}, {"id": "s4l7", "title": "Weeks 15 to 16: Mixed practice unit", "html": "<h3 id=\"how-to-use-this-unit\">How to use this unit</h3><ul>\n<li><p><strong>Week 15:</strong> untimed. Write your working for every\nquestion, then mark it.</p></li>\n<li><p><strong>Week 16:</strong> redo it in <strong>12 minutes</strong>,\nthen do quantitative units from the official practice test under the\nsame timing.</p></li>\n<li><p>Before calculating, <strong>estimate</strong>, and cross out\noptions that can't be right.</p></li>\n</ul><h3 id=\"unit-the-café-menu\">Unit: The café menu</h3><p>A café sells coffee in three sizes:</p><table>\n<colgroup>\n<col style=\"width: 20%\"/>\n<col style=\"width: 15%\"/>\n<col style=\"width: 19%\"/>\n<col style=\"width: 44%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Size</th>\n<th>Price</th>\n<th>Volume</th>\n<th>Cups sold per week</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Small</td>\n<td>$4.00</td>\n<td>250 mL</td>\n<td>400</td>\n</tr>\n<tr class=\"even\">\n<td>Medium</td>\n<td>$4.80</td>\n<td>350 mL</td>\n<td>600</td>\n</tr>\n<tr class=\"odd\">\n<td>Large</td>\n<td>$5.60</td>\n<td>450 mL</td>\n<td>250</td>\n</tr>\n</tbody>\n</table>"}]}, {"id": "s5", "title": "Sub-course 5:\nWritten English (Weeks 5 to 24)", "intro": "", "lessons": [{"id": "s5l1", "title": "Lesson 1 (Week 5): What the markers reward", "html": "<h3 id=\"learn\">Learn</h3><p>Each essay is read by two markers who score it on three criteria.\nACER doesn't publish its scoring bands, so the descriptions below are a\npractical guide drawn from the criteria, not an official rubric.</p><table>\n<colgroup>\n<col style=\"width: 16%\"/>\n<col style=\"width: 46%\"/>\n<col style=\"width: 37%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Criterion</th>\n<th>Stronger essays</th>\n<th>Weaker essays</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Thought and content</strong></td>\n<td>A clear position or insight, developed with reasons and specific\nexamples; engages with the prompt's actual wording; may show nuance (\"I\nagree, but…\")</td>\n<td>Vague or shifting view; lists ideas without explaining them; drifts\noff the prompt; relies on clichés</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Structure and organisation</strong></td>\n<td>An introduction that sets direction, paragraphs that each do one\njob, logical order, smooth links, a conclusion that adds a final\nthought</td>\n<td>One long block, or paragraphs in random order; repeats points; ends\nabruptly or just restates the introduction</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Expression, style and mechanics</strong></td>\n<td>Varied, controlled sentences; precise word choice; tone suited to\nthe task; few or no errors in spelling, grammar and punctuation</td>\n<td>Run-ons and fragments; repetitive or vague words; spelling and\napostrophe errors; overly casual or overly inflated language</td>\n</tr>\n</tbody>\n</table><h3 id=\"what-this-means-in-practice\">What this means in practice</h3><ul>\n<li><p><strong>Length:</strong> quality beats quantity. With 30 minutes\nper essay, aim for roughly 300 to 450 words: four or five well-built\nparagraphs.</p></li>\n<li><p><strong>No right answer:</strong> markers reward how well you\nargue or reflect, not which side you take. Choose the position you can\nsupport best.</p></li>\n<li><p><strong>Respond to the prompt you chose.</strong> Use its key\nwords in your introduction and conclusion. An excellent essay on a\nnearby topic scores poorly.</p></li>\n<li><p><strong>Plain and precise beats fancy.</strong> \"The policy hurts\nsmall towns\" is stronger than \"The policy engenders deleterious\nramifications for regional localities.\"</p></li>\n</ul><h3 id=\"activities\">Activities</h3><ol type=\"1\">\n<li><p>Reread your Week 1 diagnostic essay. Score it from 1 (weak) to 5\n(strong) on each criterion using the table, and write one sentence of\nevidence for each score.</p></li>\n<li><p>List the three habits you most need to fix (for example: \"no\nexamples\", \"one giant paragraph\", \"comma splices\").</p></li>\n<li><p>Keep this list at the front of your writing book. Check every\nfuture essay against it.</p></li>\n</ol>"}, {"id": "s5l2", "title": "Lesson 2 (Weeks 9 to 10): The Part A argument essay", "html": "<h3 id=\"learn-the-5-minute-plan\">Learn: the 5-minute plan</h3><p>Part A gives a comment on a public issue and asks you to respond.\nSpend 5 of your 30 minutes planning, in this order:</p><ol type=\"1\">\n<li><p><strong>Pick the prompt</strong> you have the most concrete\nexamples for, not the one that sounds cleverest. (1 minute)</p></li>\n<li><p><strong>Decide your position</strong> in one sentence. A\nqualified position (\"I agree, but…\") often scores well because it shows\nthought. (1 minute)</p></li>\n<li><p><strong>Jot three reasons</strong>, each with one specific\nexample. (2 minutes)</p></li>\n<li><p><strong>Note the best opposing point</strong> and your reply to\nit. (1 minute)</p></li>\n</ol><p>Your plan should fit in a few lines:</p><p>Position: Agree that exams dominate, but exams aren't the\nproblem<br/>\nR1: Narrows learning -&gt; life skills squeezed out (lease vs\npoem)<br/>\nR2: Distorts self-image -&gt; friend, now an electrician<br/>\nCounter: exams are fair and teach discipline<br/>\n-&gt; reply: keep them, don't let them dominate</p><h3 id=\"model-essay-written-for-this-course\">Model essay (written for\nthis course)</h3><p><strong>Prompt:</strong> <em>\"Schools spend too much time preparing\nstudents for exams and too little preparing them for life.\"</em></p><blockquote>\n<p>Ask most adults what they remember from school and few will mention\nan exam. They are more likely to recall a teacher who believed in them,\na team they played in, or the first time they stood up in front of a\nclass. Yet the final years of school are increasingly organised around a\nsingle score. I agree that the balance has tipped too far towards exams,\nalthough I do not think exams themselves are the problem.</p>\n</blockquote><p><strong>[Introduction]</strong> A concrete opening, then the prompt's\nissue, then a clear but qualified position.</p><blockquote>\n<p>The clearest cost of exam-focused schooling is that it narrows what\nstudents learn. When a subject is judged by a final paper, teachers\nsensibly teach to that paper, and topics that are hard to examine, such\nas managing money, resolving a disagreement or cooking a cheap meal, are\nsqueezed out. A student can finish twelve years of education able to\nanalyse a poem but unsure how to read a rental lease. Both skills\nmatter, but only one is tested, and so only one is taught.</p>\n</blockquote><p><strong>[Body 1: PEEL]</strong> Point (narrows learning), explanation\n(teaching to the test), example (poem vs lease), link (\"only one is\ntaught\").</p><blockquote>\n<p>Exam pressure also shapes how students see themselves. A young person\nwho struggles with timed tests may conclude that they are simply \"not\nsmart\", even if they are capable, practical and hard-working. I saw this\nin a friend who left school convinced he was a failure, then became one\nof the most sought-after electricians in our town. School had measured\nhim on the one thing he found hardest and told him almost nothing about\nhis strengths.</p>\n</blockquote><p><strong>[Body 2]</strong> A new reason, supported by a short personal\nexample. Personal examples are welcome in Part A if they serve the\nargument.</p><blockquote>\n<p>Defenders of exams make a fair point: they are one of the few ways to\ncompare students fairly, and the discipline of preparing for them is\nitself a life skill. Removing exams would not make schools more\npractical; it might simply make assessment less transparent. But this\nargument supports keeping exams, not letting them dominate. A school can\nset a rigorous final test and still give real time to the skills that\nadult life demands.</p>\n</blockquote><p><strong>[Body 3: counter-argument]</strong> States the other side\nfairly, then answers it. This shows maturity and is a strong signal for\n\"thought and content\".</p><blockquote>\n<p>The question, then, is not whether exams should exist but how much of\nschool they should be allowed to consume. If we want young people to\nleave school ready for the lives they will actually lead, we should\nmeasure schools not only by their results, but by what their students\ncan do the day after the last exam ends.</p>\n</blockquote><p><strong>[Conclusion]</strong> Restates the position in new words and\nends with a memorable final thought, not a summary list.</p><p><em>About 400 words, five paragraphs.</em></p><h3 id=\"activities-1\">Activities</h3><ol type=\"1\">\n<li><p>Rewrite the plan above for the opposite position (\"Exams are the\nbest preparation for life\").</p></li>\n<li><p>Write the full essay from your plan, untimed. Then compare its\nstructure with the model, paragraph by paragraph.</p></li>\n<li><p>Highlight every linking word in the model essay (Yet, although,\nalso, But, then). Count how many you used in yours.</p></li>\n</ol>"}, {"id": "s5l3", "title": "Lesson 3 (Weeks 11 to 12): Part A tools", "html": "<h3 id=\"learn-four-kinds-of-example\">Learn: four kinds of example</h3><p>Examples turn claims into arguments. You can't look anything up in\nthe test, so build a store of examples from your daily reading.</p><table>\n<colgroup>\n<col style=\"width: 20%\"/>\n<col style=\"width: 43%\"/>\n<col style=\"width: 35%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type</th>\n<th>Example</th>\n<th>Tip</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Personal experience</td>\n<td>\"When my workplace moved to four-day weeks…\"</td>\n<td>Keep it short and tie it to the point</td>\n</tr>\n<tr class=\"even\">\n<td>Observation of the world</td>\n<td>\"Most new housing estates are built far from train lines…\"</td>\n<td>Only claim what is widely known</td>\n</tr>\n<tr class=\"odd\">\n<td>Hypothetical</td>\n<td>\"Imagine a student who…\"</td>\n<td>Good when a real case doesn't come to mind</td>\n</tr>\n<tr class=\"even\">\n<td>General knowledge or news</td>\n<td>\"During the pandemic, many offices moved online within weeks…\"</td>\n<td>Avoid precise statistics unless you are sure of them</td>\n</tr>\n</tbody>\n</table><h3 id=\"learn-handling-the-other-side\">Learn: handling the other\nside</h3><p>A fair counter-argument earns marks; a straw man loses them. Use this\nshape:</p><ol type=\"1\">\n<li><p><strong>Concede:</strong> \"Supporters of X argue, reasonably,\nthat…\"</p></li>\n<li><p><strong>Limit:</strong> \"This is true in some cases,\nbut…\"</p></li>\n<li><p><strong>Return:</strong> \"…which is why, on balance, …\"</p></li>\n</ol><h3 id=\"learn-linking-words-by-job\">Learn: linking words by job</h3><table>\n<colgroup>\n<col style=\"width: 28%\"/>\n<col style=\"width: 71%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Job</th>\n<th>Words</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Add</td>\n<td>moreover, furthermore, also, in addition</td>\n</tr>\n<tr class=\"even\">\n<td>Contrast</td>\n<td>however, yet, on the other hand, whereas, by contrast</td>\n</tr>\n<tr class=\"odd\">\n<td>Concede</td>\n<td>admittedly, although, granted, it is true that</td>\n</tr>\n<tr class=\"even\">\n<td>Cause and effect</td>\n<td>therefore, as a result, consequently, because of this</td>\n</tr>\n<tr class=\"odd\">\n<td>Example</td>\n<td>for instance, for example, consider</td>\n</tr>\n<tr class=\"even\">\n<td>Conclude</td>\n<td>ultimately, in the end, on balance</td>\n</tr>\n</tbody>\n</table><h3 id=\"learn-introductions-that-work\">Learn: introductions that\nwork</h3><p>A strong introduction has three moves in 3 or 4 sentences:\n<strong>hook</strong> (a concrete image, a question, or a surprising\nfact you're sure of), <strong>issue</strong> (restate the prompt in your\nown words), <strong>position</strong> (your view, with any\nqualification).</p><p><strong>Weak:</strong> <em>In today's society, technology is a very\nimportant issue that affects everyone in many ways. This essay will\ndiscuss whether technology is good or bad.</em></p><p><strong>Strong:</strong> <em>My grandmother wrote letters that took a\nweek to arrive; my nephew sends forty messages before breakfast.\nTechnology has made us easier to reach, but whether it has made us\ncloser is another question. I believe it has widened our circles while\nthinning our closest bonds.</em></p><h3 id=\"activities-2\">Activities</h3><ol type=\"1\">\n<li><p>For each prompt, write a 5-minute plan (position, three reasons\nwith examples, counter-argument): a. \"Public transport should be free.\"\nb. \"Young people today have it easier than their parents did.\" c.\n\"Working from home is better for everyone.\"</p></li>\n<li><p>Rewrite this weak introduction using hook, issue and position:\n<em>\"Education is very important. There are many different opinions\nabout it. In this essay I will talk about both sides.\"</em></p></li>\n<li><p>Write a counter-argument paragraph (concede, limit, return) for\nplan 1a.</p></li>\n<li><p>Write a full essay from plan 1b in 30 minutes, then self-mark it\nwith the Lesson 1 table.</p></li>\n</ol>"}, {"id": "s5l4", "title": "Lesson 4 (Weeks 13 to 16): The Part B reflective essay", "html": "<h3 id=\"learn-1\">Learn</h3><p>Part B prompts are personal and less formal (friendship, confidence,\nchange, belonging). Markers still want <strong>thought</strong>: a story\nalone is not enough. The experience must lead somewhere.</p><p><strong>The reflective arc:</strong></p><ol type=\"1\">\n<li><p><strong>Then:</strong> what you once believed or how things were\n(open with a concrete moment).</p></li>\n<li><p><strong>Event:</strong> what happened, told with a few specific\ndetails.</p></li>\n<li><p><strong>Now:</strong> what changed in you.</p></li>\n<li><p><strong>Meaning:</strong> what this shows about the prompt.\nAgree, disagree, or add a condition.</p></li>\n</ol><p><strong>Style for Part B:</strong> first person (I) is expected. Use\nsome concrete sensory detail. Keep the language natural, but avoid slang\nand text-speak. Varied sentence length matters even more here.</p><p><strong>Plan in 5 minutes:</strong> choose the prompt that reminds\nyou of a real moment, then jot down the moment, three details, and the\none-sentence insight.</p><h3 id=\"model-essay-written-for-this-course-1\">Model essay (written for\nthis course)</h3><p><strong>Prompt:</strong> <em>\"Confidence is not something you have;\nit is something you do.\"</em></p><blockquote>\n<p>For most of my twenties I believed confidence was a kind of weather.\nSome people walked around in sunshine; I had been born under cloud. I\nwatched colleagues speak up in meetings and assumed they felt no fear,\nand that the gap between us was simply a fact.</p>\n</blockquote><p><strong>[Then]</strong> A metaphor (weather) gives the essay an image\nto return to at the end.</p><blockquote>\n<p>What changed my mind was a small and unglamorous job. At twenty-six I\nwas asked to run the weekly safety briefing at the depot where I worked,\nbecause the supervisor was on leave. I said yes mostly because I could\nnot think of a way to say no. The first briefing was dreadful. I read\nfrom my notes, lost my place twice and finished in four minutes. Nobody\nlaughed, but nobody listened either.</p>\n</blockquote><p><strong>[Event]</strong> Specific, honest details. The short\nsentences create pace and a touch of humour.</p><blockquote>\n<p>By the sixth week something had shifted. I had not become braver; I\nhad become practised. I knew which jokes landed, which crew members\nwould ask questions, and how long a pause could last before it became\nuncomfortable. The fear was still there before each briefing, but it had\nshrunk to a size I could carry.</p>\n</blockquote><p><strong>[Now]</strong> The key insight is phrased as a contrast: \"not\nbraver… practised\".</p><blockquote>\n<p>Looking back, I think the statement is mostly right, with one\ncaution. Confidence does grow from doing things, but only if the doing\nis allowed to be imperfect. Had my first briefing been treated as a test\nI had failed, I doubt I would have stood up a second time. The people\nwho seem naturally confident are often just people who were given room\nto be bad at something for a while.</p>\n</blockquote><p><strong>[Meaning]</strong> Engages directly with the prompt and adds\na condition. This is where \"thought and content\" marks are won.</p><blockquote>\n<p>I still feel the cloud sometimes. The difference is that I no longer\nwait for it to clear before I speak.</p>\n</blockquote><p><strong>[Close]</strong> Returns to the opening image, so the essay\nfeels complete.</p><p><em>About 340 words.</em></p><h3 id=\"activities-3\">Activities</h3><ol type=\"1\">\n<li><p>For each prompt, note a real moment from your life, three\ndetails, and a one-sentence insight: a. \"A true friend is someone who\ntells you what you don't want to hear.\" b. \"We learn more from failure\nthan from success.\" c. \"Home is a feeling, not a place.\"</p></li>\n<li><p>Write prompt 1b as a full essay using the reflective arc\n(untimed).</p></li>\n<li><p>Check your essay: does the \"Meaning\" paragraph respond to the\nprompt's exact words? Does your ending link back to your\nopening?</p></li>\n</ol>"}, {"id": "s5l5", "title": "Lesson 5 (Weeks 15 to 17): Polishing", "html": "<h3 id=\"learn-the-ten-errors-that-cost-the-most\">Learn: the ten errors\nthat cost the most</h3><table>\n<colgroup>\n<col style=\"width: 50%\"/>\n<col style=\"width: 49%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Error</th>\n<th>Fix</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Comma splice (\"It was late, we left.\")</td>\n<td>Full stop, semicolon, or a joining word</td>\n</tr>\n<tr class=\"even\">\n<td>Fragment (\"Because it was late.\")</td>\n<td>Attach it to a full sentence</td>\n</tr>\n<tr class=\"odd\">\n<td>it's / its, there / their / they're, your / you're</td>\n<td>Check every one in the proofread</td>\n</tr>\n<tr class=\"even\">\n<td>Wrong apostrophe in plurals (\"car's\" for cars)</td>\n<td>No apostrophe for plain plurals</td>\n</tr>\n<tr class=\"odd\">\n<td>Vague words (things, stuff, good, bad, very)</td>\n<td>Name the actual thing or quality</td>\n</tr>\n<tr class=\"even\">\n<td>Repeating the same word</td>\n<td>Use a synonym or restructure the sentence</td>\n</tr>\n<tr class=\"odd\">\n<td>\"In today's society\" and other clichés</td>\n<td>Start with something concrete</td>\n</tr>\n<tr class=\"even\">\n<td>Switching tense mid-story</td>\n<td>Pick past or present and keep it</td>\n</tr>\n<tr class=\"odd\">\n<td>Switching person (I → you → we)</td>\n<td>Stay consistent</td>\n</tr>\n<tr class=\"even\">\n<td>Overly long sentences (40+ words)</td>\n<td>Split them</td>\n</tr>\n</tbody>\n</table><h3 id=\"before-and-after\">Before and after</h3><p><strong>Before:</strong></p><blockquote>\n<p>In today's society social media is a very big thing and it effects\neveryone, alot of people use it everyday and there not always aware of\nthe bad things. Its good for some things like keeping in touch but it\nhas alot of bad stuff too.</p>\n</blockquote><p><strong>After:</strong></p><blockquote>\n<p>Social media now shapes how most of us spend our evenings. It keeps\ndistant friends in touch, but many users don't notice what it costs\nthem: hours of sleep, attention and, for some, confidence.</p>\n</blockquote><p><strong>What changed:</strong> the cliché opening is gone; \"effects\"\nbecame the right word (or was cut); \"alot\" (should be \"a lot\"),\n\"everyday\" (\"every day\"), \"there\" (\"they're\") and \"Its\" (\"It's\") are\nfixed or removed; the comma splice is gone; \"bad stuff\" is replaced with\nspecific costs.</p><h3 id=\"learn-the-3-minute-proofread\">Learn: the 3-minute proofread</h3><p>In the test, leave 3 minutes per essay and check in this order:</p><ol type=\"1\">\n<li><p><strong>Prompt:</strong> do the introduction and conclusion\nanswer it?</p></li>\n<li><p><strong>Sentences:</strong> read the essay backwards, sentence by\nsentence, looking for fragments and splices.</p></li>\n<li><p><strong>Hotspots:</strong> scan for it's/its, there/their,\napostrophes and capitals.</p></li>\n</ol><h3 id=\"activities-4\">Activities</h3><p>Rewrite each passage to fix all errors and vague wording.</p><ol type=\"1\">\n<li><p><em>Friendship is a very important thing in life. My friend Sarah\nshe always helps me, when I was sad she came over. Friends are good\nbecause they help you and you help them.</em></p></li>\n<li><p><em>Their are many reasons why the goverment should spend more on\npublic transport, its cheaper for people and its better for the\nenviroment. Also less cars.</em></p></li>\n<li><p>Take your last timed essay. Apply the 3-minute proofread and\ncount the errors you find. Track the count each week; aim to reach three\nor fewer by Week 21.</p></li>\n</ol><details class=\"answers\"><summary>Show answers</summary><p><strong>Q1</strong> <em>Good friends show up when it matters. When I\nwas struggling after losing my job, my friend Sarah came over with\ndinner and stayed until midnight. That kind of care is only possible in\na friendship where both people give.</em> · <strong>Q2</strong>\n<em>There are strong reasons for the government to invest more in public\ntransport. It is cheaper for households than running a car, and it is\nbetter for the environment because fewer cars on the road means less\npollution.</em></p></details>"}, {"id": "s5l6", "title": "Lesson 6 (Weeks 17 to 24): Prompt bank and timed practice", "html": "<h3 id=\"prompt-bank-written-for-this-course-in-the-stat-style\">Prompt\nbank (written for this course, in the STAT style)</h3><p>In the test, each part offers four comments on a theme. Practise by\nchoosing <strong>one from a group of four</strong> in under a minute, as\nyou will on the day.</p><p><strong>Part A: public issues (argue a view)</strong></p><table>\n<colgroup>\n<col style=\"width: 39%\"/>\n<col style=\"width: 60%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Theme</th>\n<th>Prompts</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Education</td>\n<td>1. \"University should be free for everyone.\" 2. \"Schools should\nteach financial skills before algebra.\" 3. \"Homework does more harm than\ngood.\" 4. \"The best teachers are those who make students\nuncomfortable.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Work and technology</td>\n<td>5. \"Automation will create more jobs than it destroys.\" 6. \"A\nfour-day working week should be standard.\" 7. \"Smartphones should be\nbanned in schools.\" 8. \"We trust technology more than we trust each\nother.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Community and environment</td>\n<td>9. \"Cities should ban cars from their centres.\" 10. \"Local\ncommunities matter more than global ones.\" 11. \"Individuals can't solve\nenvironmental problems; only governments can.\" 12. \"Sport brings\ncommunities together more than anything else.\"</td>\n</tr>\n</tbody>\n</table><p><strong>Part B: personal reflection</strong></p><table>\n<colgroup>\n<col style=\"width: 31%\"/>\n<col style=\"width: 68%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Theme</th>\n<th>Prompts</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Friendship</td>\n<td>13. \"You can tell a real friend by what they don't say.\" 14.\n\"Friendships change, and that's not a bad thing.\" 15. \"We choose our\nfriends, but we don't choose who we become because of them.\" 16. \"It's\nharder to make friends as an adult.\"</td>\n</tr>\n<tr class=\"even\">\n<td>Self-confidence</td>\n<td>17. \"Confidence is mostly an act.\" 18. \"The people who doubt us can\nmake us stronger.\" 19. \"Being humble and being confident are not\nopposites.\" 20. \"Fear is a sign you're doing something worthwhile.\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Change and growth</td>\n<td>21. \"We learn more from failure than from success.\" 22. \"Home is a\nfeeling, not a place.\" 23. \"It's never too late to start again.\" 24.\n\"The best decisions often feel like the hardest ones.\"</td>\n</tr>\n</tbody>\n</table><h3 id=\"timed-practice-schedule\">Timed practice schedule</h3><table>\n<colgroup>\n<col style=\"width: 8%\"/>\n<col style=\"width: 49%\"/>\n<col style=\"width: 42%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Task</th>\n<th>Focus</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>17</td>\n<td>One Part A, 30 min</td>\n<td>Planning in 5 minutes</td>\n</tr>\n<tr class=\"even\">\n<td>18</td>\n<td>One Part B, 30 min</td>\n<td>The reflective arc</td>\n</tr>\n<tr class=\"odd\">\n<td>19</td>\n<td>Full pair, 60 min</td>\n<td>Moving cleanly between parts</td>\n</tr>\n<tr class=\"even\">\n<td>20</td>\n<td>Full pair, 60 min</td>\n<td>Proofreading routine</td>\n</tr>\n<tr class=\"odd\">\n<td>21</td>\n<td>Full pair, 60 min</td>\n<td>Benchmark: both complete, 3 or fewer errors each</td>\n</tr>\n<tr class=\"even\">\n<td>22</td>\n<td>Official Written English practice test</td>\n<td>Indicative score</td>\n</tr>\n<tr class=\"odd\">\n<td>23</td>\n<td>Full pair at test time of day</td>\n<td>Rehearsal</td>\n</tr>\n<tr class=\"even\">\n<td>24</td>\n<td>Reread your best two essays and your error list</td>\n<td>Rest</td>\n</tr>\n</tbody>\n</table><h3 id=\"getting-feedback\">Getting feedback</h3><p>After each timed pair, get feedback from one source and compare it\nwith your own marking:</p><ul>\n<li><p>a tutor, teacher or confident writer you know, using the Lesson 1\ncriteria table</p></li>\n<li><p>an AI tutor: paste the prompt and essay and ask it to mark\nagainst \"thought and content, structure and organisation, expression,\nstyle and mechanics\" and to list your top three fixes</p></li>\n<li><p>yourself, two days later, with fresh eyes</p></li>\n</ul><p>Add any recurring problem to the habit list from Lesson 1.</p>"}]}, {"id": "s6", "title": "Sub-course\n6: Exam Practice and Strategy (Weeks 17 to 24)", "intro": "", "lessons": [{"id": "s6l1", "title": "Practice schedule (Weeks 17 to 24)", "html": "<div class=\"card rescard\"><b>Official and free practice material</b><ul><li><a href=\"https://stat.acer.org/files/STAT_Sample_Questions_2024.pdf\" target=\"_blank\" rel=\"noopener\">ACER STAT sample multiple-choice questions (PDF)</a>: 26 real questions. Answer sheets are in Phase 3 (verbal) and Phase 4 (quantitative), Lesson 7.</li><li><a href=\"https://stat.acer.org/files/Complete-guide-to-STAT-for-online-sittings.pdf\" target=\"_blank\" rel=\"noopener\">ACER complete guide to STAT (PDF)</a>: test format, more sample questions and sample Written English prompts.</li><li><a href=\"https://statmentors.com.au/quizzes/free-practice-stat-test/\" target=\"_blank\" rel=\"noopener\">STAT Mentors free practice test</a>: 20 questions in 25 minutes, marked online. Use it as a checkpoint in Week 19 (Saturday), and add any misses to your error log.</li><li><a href=\"https://stat.acer.org/au/preparation\" target=\"_blank\" rel=\"noopener\">ACER official practice tests</a>: bought through the ACER registration portal. Needed for Weeks 18 and 22.</li></ul><p class=\"small\" style=\"margin:6px 0 0\">The four timed sets below are written in the STAT style for Weeks 17 and 20. Redo set A in Week 21.</p></div><p>The last eight weeks run five sessions a week plus daily reading.\nOfficial ACER practice tests are scarce, so they are saved for the weeks\nmarked ★. The other weeks use the units in Sub-courses 3 and 4, redone\nunder time, plus any extra practice material.</p><table>\n<colgroup>\n<col style=\"width: 8%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 18%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 13%\"/>\n<col style=\"width: 27%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Mon (60 min)</th>\n<th>Tue (60 min)</th>\n<th>Wed (60 min)</th>\n<th>Thu (60 min)</th>\n<th>Sat (90 to 150 min)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>17</td>\n<td>Timed verbal set (18 Qs, 30 min)</td>\n<td>Error-log review + drills</td>\n<td>Part A essay, 30 min</td>\n<td>Timed quant set (18 Qs, 30 min)</td>\n<td>Mixed set, 35 Qs in 60 min + review</td>\n</tr>\n<tr class=\"even\">\n<td>18 ★</td>\n<td>Light review</td>\n<td>Part B essay, 30 min</td>\n<td>Rest</td>\n<td>Light quant drills</td>\n<td><strong>Official MC practice test 1</strong> (full, timed), then\nreview</td>\n</tr>\n<tr class=\"odd\">\n<td>19</td>\n<td>Review test 1: redo every miss</td>\n<td>Drills on weakest skill #1</td>\n<td>Essay pair, 60 min</td>\n<td>Drills on weakest skill #2</td>\n<td>Mixed set, 35 Qs in 60 min + review</td>\n</tr>\n<tr class=\"even\">\n<td>20</td>\n<td>Timed verbal set</td>\n<td>Drills on weakest skill</td>\n<td>Essay pair, 60 min</td>\n<td>Timed quant set</td>\n<td>Mixed set + review</td>\n</tr>\n<tr class=\"odd\">\n<td>21</td>\n<td>Timed verbal set</td>\n<td>Error-log review</td>\n<td>Essay pair (benchmark)</td>\n<td>Timed quant set</td>\n<td>Mixed set + review</td>\n</tr>\n<tr class=\"even\">\n<td>22 ★</td>\n<td>Light review</td>\n<td><strong>Official Written English practice test</strong></td>\n<td>Rest</td>\n<td>Light drills</td>\n<td><strong>Official MC practice test 2</strong> (full, timed), then\nreview</td>\n</tr>\n<tr class=\"odd\">\n<td>23</td>\n<td>Review test 2</td>\n<td>Weakest-skill drills</td>\n<td>Essay pair at test time of day</td>\n<td>Rest</td>\n<td><strong>Full mock</strong>, MC + essays at the real test times</td>\n</tr>\n<tr class=\"even\">\n<td>24</td>\n<td>Reread error log (30 min)</td>\n<td>Reread best essays (30 min)</td>\n<td>Light 20-question set</td>\n<td>Rest</td>\n<td><strong>Test day</strong> (or rest if the test is later)</td>\n</tr>\n</tbody>\n</table>"}, {"id": "s6l2", "title": "How to review a practice test", "html": "<p>The review is worth more than the test. Spend at least as long\nreviewing as you spent sitting it.</p><h3 id=\"step-by-step\">Step by step</h3><ol type=\"1\">\n<li><p><strong>Mark it,</strong> but don't look at the explanations\nyet.</p></li>\n<li><p><strong>Redo every wrong answer untimed,</strong> on a fresh\nsheet. If you now get it right, the problem was time or carelessness,\nnot skill.</p></li>\n<li><p><strong>Check the explanation</strong> for anything still\nwrong.</p></li>\n<li><p><strong>Also review lucky guesses:</strong> any question you got\nright but weren't sure of counts as a miss for learning\npurposes.</p></li>\n<li><p><strong>Categorise every miss</strong> using the table below and\nlog it.</p></li>\n<li><p><strong>Pick the top two categories</strong> and plan the next\nweek's drills around them.</p></li>\n</ol><h3 id=\"error-categories\">Error categories</h3><table>\n<colgroup>\n<col style=\"width: 8%\"/>\n<col style=\"width: 19%\"/>\n<col style=\"width: 38%\"/>\n<col style=\"width: 33%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Code</th>\n<th>Category</th>\n<th>What it looks like</th>\n<th>Fix</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>K</td>\n<td>Knowledge gap</td>\n<td>Didn't know how to do percentages, nets, etc.</td>\n<td>Go back to the matching Sub-course lesson</td>\n</tr>\n<tr class=\"even\">\n<td>R</td>\n<td>Misread</td>\n<td>Missed \"NOT\", the units, or the wrong row of a table</td>\n<td>Underline key words in the stem; run the TASK check</td>\n</tr>\n<tr class=\"odd\">\n<td>C</td>\n<td>Careless</td>\n<td>Right method, slip in arithmetic</td>\n<td>Estimate first; check the answer against the estimate</td>\n</tr>\n<tr class=\"even\">\n<td>T</td>\n<td>Trap</td>\n<td>Picked the too-broad, too-extreme or real-world-but-unsupported\noption</td>\n<td>Revisit the trap tables in Sub-course 3</td>\n</tr>\n<tr class=\"odd\">\n<td>P</td>\n<td>Pace</td>\n<td>Ran out of time, or rushed the end</td>\n<td>Timing drills (next section)</td>\n</tr>\n</tbody>\n</table><h3 id=\"example-error-log\">Example error log</h3><table>\n<colgroup>\n<col style=\"width: 13%\"/>\n<col style=\"width: 7%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 8%\"/>\n<col style=\"width: 28%\"/>\n<col style=\"width: 25%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test</th>\n<th>Q</th>\n<th>Skill</th>\n<th>Code</th>\n<th>What happened</th>\n<th>Rule for next time</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Practice 1</td>\n<td>12</td>\n<td>Inference</td>\n<td>T</td>\n<td>Chose an option that's true in real life but not in the passage</td>\n<td>\"If I can't point to the line, it's wrong\"</td>\n</tr>\n<tr class=\"even\">\n<td>Practice 1</td>\n<td>27</td>\n<td>Percentages</td>\n<td>C</td>\n<td>Divided by the new value, not the original</td>\n<td>\"Change ÷ ORIGINAL\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Practice 1</td>\n<td>41</td>\n<td>Cube nets</td>\n<td>K</td>\n<td>Couldn't see opposite faces</td>\n<td>Redo Sub-course 4, Week 13; sketch every net</td>\n</tr>\n<tr class=\"even\">\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>"}, {"id": "s6l3", "title": "Timing drills and managing nerves", "html": "<h3 id=\"pacing-checkpoints-multiple-choice-70-questions-120-minutes\">Pacing\ncheckpoints (Multiple Choice: 70 questions, 120 minutes)</h3><p>Units vary in length, so treat these as rough markers rather than\nstrict targets.</p><table>\n<colgroup>\n<col style=\"width: 25%\"/>\n<col style=\"width: 74%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Time elapsed</th>\n<th>Aim to be at about question</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>30 min</td>\n<td>17 to 18</td>\n</tr>\n<tr class=\"even\">\n<td>60 min</td>\n<td>35</td>\n</tr>\n<tr class=\"odd\">\n<td>90 min</td>\n<td>52 to 53</td>\n</tr>\n<tr class=\"even\">\n<td>115 min</td>\n<td>70 (leaves 5 minutes to return to flagged questions)</td>\n</tr>\n</tbody>\n</table><p><strong>The 2-minute rule:</strong> if a question isn't cracking\nafter 2 minutes, choose your best guess, flag it, and move on. A flagged\nquestion you return to later is worth far more than three unanswered\nones at the end.</p><p><strong>Never leave a blank:</strong> wrong answers cost nothing.</p><h3 id=\"drills\">Drills</h3><ul>\n<li><p><strong>Sprint sets:</strong> 10 questions in 15 minutes, three\ntimes a week in Weeks 17 to 21. Track your accuracy; it should hold\nsteady as speed improves.</p></li>\n<li><p><strong>Estimation-only rounds:</strong> for 10 quant questions,\npick an answer using estimation and elimination alone, with no full\nworking. Check how often this alone gets you there.</p></li>\n<li><p><strong>First-read summaries:</strong> for verbal units, read a\npassage once and write its main idea in 15 seconds before looking at the\nquestions.</p></li>\n</ul><h3 id=\"managing-nerves\">Managing nerves</h3><ul>\n<li><p><strong>Rehearse the conditions:</strong> sit the full mocks at\nthe real test time, in the room and on the computer you will use, so the\nday feels familiar.</p></li>\n<li><p><strong>Check the online testing requirements early:</strong> ID,\nroom setup and a system check are required for remote sittings. Do these\nwell before test week, not on the morning.</p></li>\n<li><p><strong>A slow breathing reset:</strong> breathe in for four\ncounts, hold for four, out for four, hold for four; repeat four times.\nUse it before the test and whenever a hard question rattles\nyou.</p></li>\n<li><p><strong>One bad question is one mark.</strong> Verbal and\nquantitative units are mixed through the test, so the next one may suit\nyou better. Flag it and move on.</p></li>\n<li><p><strong>Look after the basics:</strong> regular sleep in the last\ntwo weeks matters more than extra study. No new topics in the final\nweek.</p></li>\n</ul><h3 id=\"day-before-checklist\">Day-before checklist</h3><ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\"/>Test time, login details and ID\nready</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Room clear and quiet; computer\ncheck done</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Error log and best two essays\nreread (no more than 30 minutes)</label></p></li>\n<li><p><label><input type=\"checkbox\"/>An early night</label></p></li>\n</ul>"}]}];
var GUIDE = "\n\n<h2 id=\"overview\">Overview</h2>\n<p>This is a 24-week course, about 7 hours a week, that takes a learner\nfrom a Year 9 base to test-ready for both STAT papers. It rebuilds the\nbasics first, then teaches the STAT skills, then drills them under exam\ntiming.</p>\n<h3 id=\"what-the-learner-is-training-for\">What the learner is training\nfor</h3>\n<table>\n<colgroup>\n<col style=\"width: 15%\"/>\n<col style=\"width: 15%\"/>\n<col style=\"width: 52%\"/>\n<col style=\"width: 16%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Paper</th>\n<th>Time</th>\n<th>What it contains</th>\n<th>Calculator</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>STAT Multiple Choice</td>\n<td>2 hours + 10 min reading</td>\n<td>70 questions: about half verbal and critical reasoning, half\nquantitative reasoning, mixed together in units</td>\n<td>Not allowed</td>\n</tr>\n<tr class=\"even\">\n<td>STAT Written English</td>\n<td>1 hour + 5 min reading</td>\n<td>Two short essays: Part A (a public issue, argue a view) and Part B\n(a personal reflection). Choose one of four prompts in each part</td>\n<td>n/a</td>\n</tr>\n</tbody>\n</table>\n<p>The STAT tests reasoning, not school content. Every answer comes from\nthe passage, table or graph on screen. Wrong answers lose no marks, so\nevery question gets an answer.</p>\n<p>Each essay is marked by two markers on three criteria: thought and\ncontent, structure and organisation, and expression, style and\nmechanics. Quality counts far more than length.</p>\n<h3 id=\"the-target\">The target</h3>\n<p>Both papers are scored on a 100 to 200 scale with a mean of 150.\nAdmissions centres such as UAC convert the Multiple Choice score into an\nATAR-like selection rank. This plan reads \"80+\" as a selection rank of\n80 or better, which means scoring well above the 150 average.</p>\n<ul>\n<li><p><strong>Check first:</strong> confirm with the university (or\nUAC) which papers the course needs and the STAT score that gives a rank\nof 80. Many courses need only Multiple Choice.</p></li>\n<li><p><strong>Working benchmark (rule of thumb):</strong> consistently\nget about 75% or more right on timed official practice material, and\nessays that are clear, structured and nearly error-free.</p></li>\n<li><p><strong>Retakes:</strong> STAT can be sat once per cycle (15\nApril to 14 April), so the first attempt should be the ready\none.</p></li>\n</ul>\n<h3 id=\"how-to-use-this-plan\">How to use this plan</h3>\n<ol type=\"1\">\n<li><p>Sit the Week 1 diagnostic before any study. It shows where to\nspend time.</p></li>\n<li><p>Follow the weekly routine. Five shorter sessions beat one long\none.</p></li>\n<li><p>Keep an error log: every wrong answer gets a line saying why it\nwas wrong.</p></li>\n<li><p>Use the benchmarks at the end of each phase. Move on only when\nthey are met; add a week if not.</p></li>\n</ol>\n<h3 id=\"sub-courses-the-detail\">Sub-courses (the detail)</h3>\n<p>Each strand of this plan has its own sub-course in the menu, with lessons, explanations,\nextracts, activities and answers:</p>\n<table>\n<colgroup>\n<col style=\"width: 46%\"/>\n<col style=\"width: 12%\"/>\n<col style=\"width: 40%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Sub-course</th>\n<th>Weeks</th>\n<th>Feeds</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Numeracy Foundations</td>\n<td>1 to 8</td>\n<td>Quantitative reasoning</td>\n</tr>\n<tr class=\"even\">\n<td>2. Reading, Vocabulary &amp; Grammar</td>\n<td>1 to 8</td>\n<td>Verbal reasoning, both essays</td>\n</tr>\n<tr class=\"odd\">\n<td>3. Verbal &amp; Critical Reasoning</td>\n<td>9 to 16</td>\n<td>Multiple Choice, verbal half</td>\n</tr>\n<tr class=\"even\">\n<td>4. Quantitative Reasoning</td>\n<td>9 to 16</td>\n<td>Multiple Choice, quant half</td>\n</tr>\n<tr class=\"odd\">\n<td>5. Written English</td>\n<td>5 to 24</td>\n<td>Written English</td>\n</tr>\n<tr class=\"even\">\n<td>6. Exam Practice &amp; Strategy</td>\n<td>17 to 24</td>\n<td>Both  style=\"width: 13%\"/>\n<col style=\"width: 14%\"/>\n<col style=\"width: 26%\"/>\n<col style=\"width: 21%\"/>\n<col style=\"width: 24%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Day</th>\n<th>Session</th>\n<th>Phase 1 (Wk 1–8)</th>\n<th>Phase 2 (Wk 9–16)</th>\n<th>Phases 3–4 (Wk 17–24)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Every day</td>\n<td>Reading + vocab, 30 min</td>\n<td>Article + word cards</td>\n<td>Article + word cards</td>\n<td>Article + word cards</td>\n</tr>\n<tr class=\"even\">\n<td>Mon</td>\n<td>60 min</td>\n<td>Numeracy topic</td>\n<td>Quant skill</td>\n<td>Timed MC set</td>\n</tr>\n<tr class=\"odd\">\n<td>Tue</td>\n<td>60 min</td>\n<td>Grammar + paragraph</td>\n<td>Verbal skill</td>\n<td>Error-log drills</td>\n</tr>\n<tr class=\"even\">\n<td>Wed</td>\n<td>60 min</td>\n<td>Numeracy topic</td>\n<td>Quant skill</td>\n<td>Timed essay pair</td>\n</tr>\n<tr class=\"odd\">\n<td>Thu</td>\n<td>60 min</td>\n<td>Numeracy practice</td>\n<td>Essay (Part A or B)</td>\n<td>Timed MC set</td>\n</tr>\n<tr class=\"even\">\n<td>Sat</td>\n<td>90 min</td>\n<td>Weekly quiz + error-log review</td>\n<td>Mixed units + review</td>\n<td>Practice test or review</td>\n</tr>\n<tr class=\"odd\">\n<td>Sun</td>\n<td>Rest</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"phase-1-weeks-1-to-8-numeracy-rebuild\">Phase 1 (Weeks 1 to 8):\nNumeracy rebuild</h2>\n<p>The quantitative half of STAT needs fast, confident arithmetic\nwithout a calculator, plus Year 9 to 10 level algebra and graph reading.\nThis is the biggest gap for most mature-age learners, so it gets three\nsessions a week in Phase 1.</p>\n<p>Daily habit: 10 minutes of mental arithmetic drills (times tables to\n12, doubling and halving, adding and subtracting two-digit numbers)\nbefore every numeracy session.</p>\n<table>\n<colgroup>\n<col style=\"width: 9%\"/>\n<col style=\"width: 35%\"/>\n<col style=\"width: 55%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Topic</th>\n<th>Learner can now...</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>Diagnostic + number sense</td>\n<td>Place value, rounding, estimating answers before working them\nout</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>The four operations by hand</td>\n<td>Long multiplication and division, order of operations (BODMAS),\nnegative numbers</td>\n</tr>\n<tr class=\"odd\">\n<td>3</td>\n<td>Fractions</td>\n<td>Simplify, compare, add, multiply and divide fractions; \"fraction of\nan amount\"</td>\n</tr>\n<tr class=\"even\">\n<td>4</td>\n<td>Decimals and percentages</td>\n<td>Convert between fraction, decimal and %; find 10%, 5%, 1% in your\nhead; percentage increase and decrease</td>\n</tr>\n<tr class=\"odd\">\n<td>5</td>\n<td>Ratio, rate and proportion</td>\n<td>Share in a ratio, unit rates (km/h, $/kg), direct and inverse\nproportion, unit conversions</td>\n</tr>\n<tr class=\"even\">\n<td>6</td>\n<td>Algebra basics</td>\n<td>Substitute into formulas, simplify expressions, solve one- and\ntwo-step equations, rearrange a formula</td>\n</tr>\n<tr class=\"odd\">\n<td>7</td>\n<td>Graphs and tables</td>\n<td>Read line, bar, pie and scatter graphs; find trends; plot and read\ncoordinates; gradient as \"rise over run\"</td>\n</tr>\n<tr class=\"even\">\n<td>8</td>\n<td>Shape, space and averages</td>\n<td>Perimeter, area, volume, angles; mean, median, mode, range; simple\nprobability. Phase 1 check-in</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Method for every topic:</strong> watch one short lesson, do\n15 to 20 easy questions, then 10 harder word problems. Mark them, and\nlog every error.</p>\n<p><strong>Phase 1 benchmark:</strong> 80% correct on a mixed\n30-question no-calculator quiz covering Weeks 2 to 8, in under 45\nminutes.</p>\n<h2 id=\"phase-1-weeks-1-to-8-reading-vocabulary-and-grammar\">Phase 1\n(Weeks 1 to 8): Reading, vocabulary and grammar</h2>\n<p>The verbal half of STAT and both essays rest on reading stamina and\nclean sentences. Phase 1 builds the habit of reading adult,\nargument-heavy text every day.</p>\n<h3 id=\"daily-reading-20-to-30-minutes-every-day-of-the-course\">Daily\nreading (20 to 30 minutes, every day of the course)</h3>\n<ul>\n<li><p>Weeks 1 to 4: one quality news or feature article a day (ABC News\nanalysis, The Conversation, SBS features).</p></li>\n<li><p>Weeks 5 to 8: add one opinion piece a week and one longer essay\nor magazine article.</p></li>\n<li><p>After each piece, write two sentences: what is the main point,\nand what is the writer's attitude?</p></li>\n</ul>\n<h3 id=\"vocabulary-10-minutes-a-day\">Vocabulary (10 minutes a day)</h3>\n<ul>\n<li><p>Keep a word notebook or flashcard deck (Anki or Quizlet). Add\nevery unfamiliar word met in reading, with its meaning and a sentence of\nyour own.</p></li>\n<li><p>Learn the \"argument words\" STAT relies on: however, therefore,\nwhereas, despite, consequently, implies, assumes, undermines,\nconcedes.</p></li>\n<li><p>Learn tone words: sceptical, ironic, sympathetic, dismissive,\ncautious, nostalgic, critical.</p></li>\n</ul>\n<h3 id=\"grammar-and-sentences-one-session-a-week\">Grammar and sentences\n(one session a week)</h3>\n<table>\n<colgroup>\n<col style=\"width: 14%\"/>\n<col style=\"width: 85%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Focus</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1 to 2</td>\n<td>Full sentences: subject and verb, fixing run-ons and fragments</td>\n</tr>\n<tr class=\"even\">\n<td>3 to 4</td>\n<td>Punctuation: full stops, commas, apostrophes, capital letters</td>\n</tr>\n<tr class=\"odd\">\n<td>5 to 6</td>\n<td>Joining ideas: because, although, which, while; varying sentence\nlength</td>\n</tr>\n<tr class=\"even\">\n<td>7 to 8</td>\n<td>The paragraph: topic sentence, explanation, example, link back</td>\n</tr>\n</tbody>\n</table>\n<p>Each week, write one paragraph of about 150 words on that week's\nreading. Check it against the week's grammar focus.</p>\n<p><strong>Phase 1 benchmark:</strong> reads a 700-word opinion article\nand states its main idea correctly in one sentence. Writes a 150-word\nparagraph with no sentence errors.</p>\n<h2 id=\"phase-2-weeks-9-to-16-verbal-and-critical-reasoning\">Phase 2\n(Weeks 9 to 16): Verbal and critical reasoning</h2>\n<p>STAT verbal units test four skills: finding the main idea,\ninterpreting words and phrases, paraphrasing, and inferring or deducing.\nPhase 2 teaches each one, then mixes them.</p>\n<table>\n<colgroup>\n<col style=\"width: 11%\"/>\n<col style=\"width: 36%\"/>\n<col style=\"width: 52%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Skill</th>\n<th>What to practise</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>9</td>\n<td>Main idea and purpose</td>\n<td>Summarise each paragraph in 5 words; name the writer's overall point\nand why they wrote it</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Words in context</td>\n<td>Work out meaning from surrounding sentences; spot figurative\nlanguage, irony and tone</td>\n</tr>\n<tr class=\"odd\">\n<td>11</td>\n<td>Paraphrase</td>\n<td>Pick the option that says the same thing in different words; reject\noptions that add, drop or twist a detail</td>\n</tr>\n<tr class=\"even\">\n<td>12</td>\n<td>Inference</td>\n<td>What must be true, what is probably true, what the text does not\nsay. Never use outside knowledge</td>\n</tr>\n<tr class=\"odd\">\n<td>13</td>\n<td>Arguments</td>\n<td>Find the conclusion, the reasons and the hidden assumption; what\nstrengthens or weakens the argument</td>\n</tr>\n<tr class=\"even\">\n<td>14</td>\n<td>Poems, cartoons and dialogues</td>\n<td>STAT includes non-standard texts. Read slowly, ask \"what is the\nspeaker's attitude?\"</td>\n</tr>\n<tr class=\"odd\">\n<td>15 to 16</td>\n<td>Mixed units, untimed then timed</td>\n<td>Full verbal units; start timing at about 1.7 minutes per\nquestion</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"the-answer-method-for-every-verbal-question\">The answer method\nfor every verbal question</h3>\n<ol type=\"1\">\n<li><p>Read the question stem first, so you know what to look\nfor.</p></li>\n<li><p>Read the passage actively: note the main idea and any turn words\n(however, but, yet).</p></li>\n<li><p>Predict the answer in your own words before looking at the\noptions.</p></li>\n<li><p>Eliminate: cross out options that are too extreme (always,\nnever), off-topic, or true but not what was asked.</p></li>\n<li><p>Choose the option that is supported by the text, not the one that\nsounds clever.</p></li>\n</ol>\n<p><strong>Phase 2 benchmark:</strong> 70% or better on mixed verbal\nunits, untimed.</p>\n<h2 id=\"phase-2-weeks-9-to-16-quantitative-reasoning\">Phase 2 (Weeks 9\nto 16): Quantitative reasoning</h2>\n<p>STAT quantitative units ask you to interpret and apply numbers,\nsymbols, diagrams and graphs in scientific and everyday settings. The\nmaths is rarely beyond Year 10; the challenge is reading the setup and\nchoosing the method fast.</p>\n<table>\n<colgroup>\n<col style=\"width: 11%\"/>\n<col style=\"width: 36%\"/>\n<col style=\"width: 52%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week</th>\n<th>Skill</th>\n<th>What to practise</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>9</td>\n<td>Reading data displays</td>\n<td>Tables, multi-line graphs, dual axes; check units and scales before\ncalculating</td>\n</tr>\n<tr class=\"even\">\n<td>10</td>\n<td>Percentages and rates in context</td>\n<td>Percentage change, compound change, comparing rates across\ngroups</td>\n</tr>\n<tr class=\"odd\">\n<td>11</td>\n<td>Patterns and sequences</td>\n<td>Number patterns, growth rules, \"what comes next\" in a diagram</td>\n</tr>\n<tr class=\"even\">\n<td>12</td>\n<td>Formulas and symbols</td>\n<td>Apply a rule given in the question; invented symbols (e.g. a ★ b =\n2a + b)</td>\n</tr>\n<tr class=\"odd\">\n<td>13</td>\n<td>Spatial reasoning</td>\n<td>Nets, rotations, reflections, maps and scale, 3D shapes from\ndifferent views</td>\n</tr>\n<tr class=\"even\">\n<td>14</td>\n<td>Logic puzzles</td>\n<td>Ordering and seating problems, \"if... then\" statements, Venn\ndiagrams</td>\n</tr>\n<tr class=\"odd\">\n<td>15 to 16</td>\n<td>Mixed units, untimed then timed</td>\n<td>Full quantitative units at about 1.7 minutes per question</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"speed-tricks-to-practise-until-automatic\">Speed tricks to\npractise until automatic</h3>\n<ul>\n<li><p><strong>Estimate first:</strong> round the numbers, get a\nballpark, and eliminate options that are far off. Often only one option\nfits.</p></li>\n<li><p><strong>Work backwards:</strong> substitute the answer options\ninto the problem when algebra is slow.</p></li>\n<li><p><strong>Use easy numbers:</strong> for percentage problems,\nassume a starting value of 100.</p></li>\n<li><p><strong>Draw it:</strong> sketch every spatial or logic problem;\nnever solve it in your head.</p></li>\n<li><p><strong>Skip and return:</strong> if a question is not cracking\nafter 2 minutes, guess, flag it and move on.</p></li>\n</ul>\n<p><strong>Phase 2 benchmark:</strong> 70% or better on mixed\nquantitative units, untimed.</p>\n<h2 id=\"written-english-course-runs-weeks-5-to-24\">Written English\ncourse (runs Weeks 5 to 24)</h2>\n<p>The learner writes two essays in 60 minutes, about 30 minutes each.\nEach essay needs a clear position, a logical shape and controlled,\naccurate English. Writing practice runs alongside the other phases, one\nsession a week, rising to two in Phase 3.</p>\n<h3 id=\"stage-1-weeks-5-to-8-paragraphs\">Stage 1 (Weeks 5 to 8):\nParagraphs</h3>\n<p>Covered in the grammar plan above: full sentences, punctuation, then\nthe paragraph (point, explain, example, link).</p>\n<h3 id=\"stage-2-weeks-9-to-12-part-a-the-argument-essay\">Stage 2 (Weeks\n9 to 12): Part A, the argument essay</h3>\n<p>Part A prompts are formal public-issue comments (recent example\nthemes include education). The task is to respond with a reasoned\nview.</p>\n<p><strong>A reliable shape (about 350 to 450 words):</strong></p>\n<ol type=\"1\">\n<li><p><strong>Introduction (3 to 4 sentences):</strong> restate the\nissue in your own words and give a clear position.</p></li>\n<li><p><strong>Body paragraph 1:</strong> your strongest reason,\nexplained, with a specific example.</p></li>\n<li><p><strong>Body paragraph 2:</strong> a second reason, explained,\nwith an example.</p></li>\n<li><p><strong>Body paragraph 3:</strong> the other side, fairly stated,\nthen why your view still holds.</p></li>\n<li><p><strong>Conclusion (2 to 3 sentences):</strong> return to the\nposition and widen it (why it matters).</p></li>\n</ol>\n<p>Weekly drill: brainstorm 3 prompts in 5 minutes each (position + 3\npoints), and write one full essay untimed.</p>\n<h3 id=\"stage-3-weeks-13-to-16-part-b-the-reflective-essay\">Stage 3\n(Weeks 13 to 16): Part B, the reflective essay</h3>\n<p>Part B prompts are less formal and invite personal reflection (recent\nexample themes: friendship, self-confidence). The best responses still\nhave a point, not just a story.</p>\n<p><strong>A reliable shape (about 350 to 450 words):</strong></p>\n<ol type=\"1\">\n<li><p><strong>Opening:</strong> a short concrete moment or image, then\nthe idea you will explore.</p></li>\n<li><p><strong>Development:</strong> one or two experiences or\nobservations, each tied back to the idea.</p></li>\n<li><p><strong>Complication:</strong> what you once believed versus what\nyou now think, or a limit to the prompt's claim.</p></li>\n<li><p><strong>Close:</strong> what you have learnt, and what it means\nmore generally.</p></li>\n</ol>\n<p>Weekly drill: one reflective essay untimed, plus one rewrite of an\nearlier essay.</p>\n<h3 id=\"stage-4-weeks-17-to-24-timed-pairs\">Stage 4 (Weeks 17 to 24):\nTimed pairs</h3>\n<ul>\n<li><p>One timed pair a week: choose prompts in 5 minutes, then 30\nminutes per essay, typed (the online test is typed).</p></li>\n<li><p>Inside each 30 minutes: 5 minutes plan, 22 minutes write, 3\nminutes proofread.</p></li>\n<li><p>Get feedback on every pair from a teacher, tutor, strong writer,\nor an AI tutor using the three marking criteria. Put the essay aside for\ntwo days and reread it too.</p></li>\n</ul>\n<h3 id=\"self-marking-checklist-use-on-every-essay\">Self-marking\nchecklist (use on every essay)</h3>\n<table>\n<colgroup>\n<col style=\"width: 42%\"/>\n<col style=\"width: 57%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Criterion</th>\n<th>Ask yourself</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Thought and content</td>\n<td>Is my position clear? Are ideas developed with reasons and examples,\nnot just listed?</td>\n</tr>\n<tr class=\"even\">\n<td>Structure and organisation</td>\n<td>Does each paragraph have one job? Do the links (however, as a\nresult) guide the reader?</td>\n</tr>\n<tr class=\"odd\">\n<td>Expression, style and mechanics</td>\n<td>Are sentences varied and correct? Any spelling, apostrophe or comma\nerrors? Is the tone right for Part A or B?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Writing benchmark by Week 21:</strong> two complete, planned\nessays in 60 minutes, each with a clear position and no more than three\nsurface errors.</p>\n<h2 id=\"phases-3-and-4-weeks-17-to-24-timed-practice-mocks-and-test-day\">Phases\n3 and 4 (Weeks 17 to 24): Timed practice, mocks and test day</h2>\n<p>Phase 3 builds speed and stamina; Phase 4 rehearses the real day.\nSave the official ACER practice tests for these phases: they are the\nonly material that truly matches the test.</p>\n<h3 id=\"phase-3-weeks-17-to-21-speed-and-stamina\">Phase 3 (Weeks 17 to\n21): Speed and stamina</h3>\n<ul>\n<li><p>Two timed mixed MC sets a week (35 questions in 60 minutes),\nalternating verbal-heavy and quant-heavy.</p></li>\n<li><p>Week 18: first official ACER MC practice test, full length, under\nreal conditions. Mark it and spend a full session on the\nreview.</p></li>\n<li><p>Weeks 19 to 21: target the two weakest question types from the\nerror log with extra drills.</p></li>\n<li><p>Writing: one timed essay pair a week (see the Written English\ncourse).</p></li>\n</ul>\n<h3 id=\"phase-4-weeks-22-to-24-full-rehearsals\">Phase 4 (Weeks 22 to\n24): Full rehearsals</h3>\n<ul>\n<li><p>Week 22: second official MC practice test plus the official\nWritten English practice test (it returns an indicative score).</p></li>\n<li><p>Week 23: a final full mock at the same time of day as the real\ntest. Review only; no new topics.</p></li>\n<li><p>Week 24 (test week): light 30-minute sessions, re-read the error\nlog and essay checklist, sleep well.</p></li>\n</ul>\n<h3 id=\"exam-room-strategy\">Exam-room strategy</h3>\n<ul>\n<li><p><strong>Pace:</strong> about 1 minute 45 seconds per MC question.\nCheck the clock at question 35: about 60 minutes should have\ngone.</p></li>\n<li><p><strong>Two-pass method:</strong> answer what you can, flag the\nhard ones, return at the end.</p></li>\n<li><p><strong>Never leave a blank:</strong> no marks are lost for wrong\nanswers, so guess on everything in the last 2 minutes.</p></li>\n<li><p><strong>Units are mixed:</strong> a long passage worth 5\nquestions is often worth more time than a single tricky puzzle.</p></li>\n<li><p><strong>Essays:</strong> spend the reading time picking prompts\nyou have something real to say about. Write Part A first if argument is\nyour strength, Part B first otherwise. Leave 3 minutes to proofread\neach.</p></li>\n</ul>\n<h3 id=\"test-day-checklist\">Test-day checklist</h3>\n<ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\"/>Test booked and the course's\nrequired papers confirmed with the university</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Online proctoring requirements\nchecked (ID, quiet room, computer check run beforehand)</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Clear desk, water, nothing on the\nprohibited list (no calculator)</label></p></li>\n<li><p><label><input type=\"checkbox\"/>Good sleep the two nights before,\nlight meal beforehand</label></p></li>\n</ul>\n\n\n\n\n\n<h2 id=\"resources\">Resources</h2>\n<p><strong>Official (use in Phases 3 and 4):</strong></p>\n<ul>\n<li><p><a href=\"https://stat.acer.org/au/preparation\">ACER STAT\npreparation page</a>: free sample MC question booklet, plus paid\nPractice Tests for Multiple Choice and Written English.</p></li>\n<li><p><a href=\"https://stat.acer.org/files/Complete-guide-to-STAT-for-online-sittings.pdf\">Complete\nguide to STAT</a>: format, marking criteria, sample questions and sample\nessay prompts.</p></li>\n<li><p><a href=\"https://stat.acer.org/\">ACER STAT home</a>: test dates\nand fees (MC A$240, WE A$225; rising to A$250 and A$230 from 1 January\n2027).</p></li>\n</ul>\n<p><strong>Foundations (free):</strong></p>\n<ul>\n<li><p>Khan Academy: arithmetic, pre-algebra, Year 7 to 10 maths. Use\nits unit tests for the Phase 1 benchmarks.</p></li>\n<li><p>The Conversation, ABC News analysis: daily argument-rich\nreading.</p></li>\n<li><p>Anki or Quizlet: vocabulary flashcards.</p></li>\n</ul>\n<p><strong>Admissions:</strong></p>\n<ul>\n<li><p><a href=\"https://uaccoursehub.uac.edu.au/future-applicants/admission-criteria/nsw-uai\">UAC\nSTAT information</a> and the target university's admissions page: which\npapers a course needs and how scores convert to a selection\nrank.</p></li>\n</ul>\n<p>ACER notes that third-party STAT prep courses are unregulated and not\nendorsed by ACER. Practise with official material where it counts.</p>\n<h3 id=\"sources\">Sources</h3>\n<ul>\n<li><p><a href=\"https://stat.acer.org/files/Complete-guide-to-STAT-for-online-sittings.pdf\">ACER:\nComplete guide to STAT for online sittings</a></p></li>\n<li><p><a href=\"https://stat.acer.org/gb/preparation\">ACER STAT\npreparation</a></p></li>\n<li><p><a href=\"https://stat.acer.org/\">ACER STAT home</a></p></li>\n<li><p><a href=\"https://www.curtin.edu.au/study/?p=112063\">Curtin\nUniversity: STAT</a></p></li>\n<li><p><a href=\"https://www.rmit.edu.au/study-with-us/pathways/skills-for-tertiary-admissions-test-stat\">RMIT:\nSTAT</a></p></li>\n</ul>\n";

  mc("“His kingdom” suggests the shed was:", ["very large", "a place where he had complete authority", "expensive to build", "shared with the family"], 1, "Kingdoms have rulers and laws."),
  mc("“An empty shape accused you” means:", ["the painted outline showed at once that a tool was missing", "the father blamed his children for everything", "the shed was frightening", "tools were often stolen"], 0, ""),
  mc("“To borrow a hammer was to enter a contract” implies that:", ["the father charged money", "borrowing came with a strict expectation of return", "the writer never borrowed tools", "the father wrote rules on paper"], 1, "A contract is a binding promise."),

  mc("The overall tone is best described as:", ["bitter", "wistful and affectionate", "detached and scientific", "angry"], 1, "Gentle humour, sad ending; nothing suggests bitterness.")

Q.s3l3 = [{ id: "s3l3a", title: "Paraphrase practice", items: [
  mc("“The council will approve the development only if the developer funds a new road.”", ["The developer will build a road.", "Without a new road funded by the developer, the development won't be approved.", "The council wants new roads.", "If the developer funds a road, approval is certain."], 1, "“Only if” makes funding required, not a guarantee."),
  mc("“Not all critics disliked the film.”", ["All critics liked the film.", "Most critics disliked the film.", "At least some critics did not dislike the film.", "No critics liked the film."], 2, ""),
  mc("“Rising house prices have, in part, been driven by low interest rates.”", ["Low interest rates are one cause of rising house prices.", "House prices cause low interest rates.", "Low interest rates are the only reason prices rose.", "House prices will keep rising."], 0, "Keeps “in part” and the direction of cause."),
  mc("“She was hardly the first to doubt the plan.”", ["She was the first to doubt the plan.", "Others had doubted the plan before her.", "She barely doubted the plan.", "Nobody doubted the plan."], 1, ""),
  mc("“Exercise may reduce the risk of some illnesses.”", ["Exercise prevents illness.", "Exercise could lower the chance of certain illnesses.", "Most illnesses are caused by lack of exercise.", "Exercise reduces all health risks."], 1, "Keeps both hedges: “may” and “some”.")
]}];

Q.s3l4 = [{ id: "s3l4a", title: "Questions on Extract C", items: [
  mc("It can be concluded that:", ["the cannery reopened as a factory", "Port Elwin's population is now larger than before the closure", "the cannery building is still standing", "the Melbourne couple planned the town's recovery"], 2, "It became a market, so it must still stand. “Not planned” rules out the last option."),
  mc("The cafes “close by midday on weekdays” most strongly suggests that:", ["the owners are lazy", "weekday trade is still weak", "the cafes are unprofitable", "residents dislike coffee"], 1, "“Unprofitable” goes too far."),
  mc("The former worker's comment suggests that he:", ["is pleased with the change", "feels the town has lost something of its identity", "wants the market closed", "works in a cafe"], 1, "“Make things” vs “sell coffee” shows a sense of loss."),
  mc("Which statement is NOT supported by the passage?", ["The market draws visitors on Saturdays.", "Some residents are uneasy about tourism.", "Tourism has replaced all the jobs the cannery provided.", "The cannery's closure hurt the town."], 2, "Nothing says jobs were fully replaced.")
]}];
