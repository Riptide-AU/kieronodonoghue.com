<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAT Course: From Year 9 to 80+</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d2327; --muted:#5f6b72; --line:#e3e1da;
  --accent:#0f6e66; --accent-soft:#e3f1ef; --good:#1f7a3a; --good-soft:#e6f4ea;
  --bad:#b3261e; --bad-soft:#fcebea; --warn:#9a6700; --warn-soft:#fff4d6;
  --radius:10px; --side:290px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:var(--side);flex:0 0 var(--side);background:#fff;border-right:1px solid var(--line);height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 14px 40px}
.brand{font-weight:700;font-size:18px;margin:2px 6px 2px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:15px}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{margin-top:14px}
.nav .grp>button{width:100%;text-align:left;background:none;border:0;padding:7px 10px;font-weight:600;font-size:14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;border-radius:8px}
.nav .grp>button:hover{background:var(--bg)}
.nav .grp .les{display:none;padding-left:6px}
.nav .grp.open .les{display:block}
.nav .les a{font-size:14px;padding:5px 10px}
.tick{width:16px;height:16px;border-radius:50%;border:1.5px solid #b9bfbf;flex:0 0 16px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.tick.done{background:var(--good);border-color:var(--good)}
.pct{font-size:12px;color:var(--muted);font-weight:400}
.sep{border-top:1px solid var(--line);margin:14px 6px}
/* main */
main{flex:1;min-width:0;padding:28px 40px 80px;max-width:900px}
.topbar{display:none}
h1{font-size:28px;line-height:1.25;margin:0 0 6px}
h2{font-size:22px;margin:32px 0 10px;line-height:1.3}
h3{font-size:18px;margin:24px 0 8px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:var(--muted);font-size:14px}
.bar{height:8px;background:#ecebe6;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
table{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:15px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#f1f0eb;font-weight:600}
.content p{margin:8px 0}
.content blockquote{margin:12px 0;padding:12px 16px;background:#fbfaf6;border-left:4px solid var(--accent);border-radius:6px}
.content img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
pre{background:#f1f0eb;padding:10px 12px;border-radius:8px;overflow:auto;font-size:14px;line-height:1.35}
details.answers{background:#fbfaf6;border:1px dashed var(--line);border-radius:8px;padding:8px 14px;margin:12px 0}
details.answers summary{cursor:pointer;font-weight:600;color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{padding:5px 11px;font-size:14px}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.grey{background:#eeede8;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],textarea,select{font:inherit;border:1.5px solid #cfd3d1;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
/* quiz */
.quiz{margin-top:30px;border-top:3px solid var(--accent);padding-top:6px}
.quiz .qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.qcard.ok{border-color:#9fd0ad;background:#fbfefb}
.qcard.no{border-color:#e8b4b0;background:#fffbfb}
.qn{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.qstem{margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer;background:#fff}
.opt:hover{border-color:#b9c4c2}
.opt input{margin-top:5px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--accent)}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--good-soft);color:#14532d}
.fb.no{background:var(--bad-soft);color:#7f1d1d}
.fb.info{background:#f1f0eb;color:var(--ink)}
.numrow{display:flex;gap:8px;max-width:420px}
.numrow input{flex:1}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:14px}
.score{font-size:18px;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;padding:4px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.examstrip{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stim{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.lessonfoot{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}
.done-toggle.on{background:var(--good);border-color:var(--good);color:#fff}
.muted{color:var(--muted)}
.small{font-size:14px}
.err-item{border-left:4px solid var(--bad);background:#fff;border-radius:8px;padding:10px 14px;margin:10px 0;border:1px solid var(--line);border-left-width:4px}
.skillrow{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr 56px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.essaybox textarea{min-height:340px;line-height:1.6}
.wc{font-size:14px;color:var(--muted)}
.prompt-opt{display:block;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer;text-align:left;width:100%}
.prompt-opt:hover{border-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2327;color:#fff;padding:10px 18px;border-radius:8px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.weekchk label{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.weekchk input{margin-top:6px}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.15)}
  .side.open{transform:none}
  main{padding:14px 16px 80px}
  .topbar{display:flex;align-items:center;gap:10px;margin:-2px 0 12px}
  .topbar button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
  h1{font-size:24px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20;display:none}
  .scrim.on{display:block}
  table{font-size:14px;display:block;overflow-x:auto}
}
@media print{.side,.topbar,.btn,.lessonfoot{display:none!important}main{padding:0}}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:10px 0}
.vid{margin:0}.vframe{position:relative;padding-top:56.25%;border-radius:8px;overflow:hidden;background:#000}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vnote{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.vid figcaption{font-size:.85rem;margin-top:4px}.vid figcaption a{margin-left:6px;white-space:nowrap}
.stim blockquote{margin:0;font-size:1.05rem;font-style:italic}
.stim table.grid td{width:36px;text-align:center;font-weight:600}
.stim svg{display:block;margin:8px 0;background:#fff}
.rescard{margin:0 0 18px}.rescard li{margin:4px 0}
table.sched{font-size:14px}table.sched td{vertical-align:top;min-width:110px}table.sched td:first-child{min-width:70px}
tr.phrow td{background:#eef4f2;font-weight:600;color:#0f766e}tr.nowrow td{background:#fffbea}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

var COURSE = [{"id": "s1", "title": "Sub-course 1:\nNumeracy Foundations (Weeks 1 to 8)", "intro": "", "lessons": [{"id": "s1l1", "title": "Lesson 1 (Week 1): Number sense, rounding and estimation", "html": "<h3 id=\"start-here-the-diagnostic\">Start here: the diagnostic</h3><p>Before this lesson, do the free sample Multiple Choice questions from\nACER's STAT site under rough timing (about 1.7 minutes per question).\nAlso write one 30-minute essay on any prompt from Sub-course 5. Don't\nstudy for it; it's a baseline. Record the scores in the tracker on the\noverview tab.</p><h3 id=\"learn\">Learn</h3><p><strong>Place value</strong> is what each digit is worth by its\nposition. In 4,872 the 4 means 4 thousands, the 8 means 8 hundreds, the\n7 means 7 tens and the 2 means 2 ones.</p><p><strong>Rounding:</strong> look at the digit to the right of the\nplace you are rounding to. If it is 5 or more, round up; if it is 4 or\nless, round down.</p><p><strong>Estimation</strong> is the single most useful STAT skill.\nRound each number to one or two significant figures, do the easy sum,\nand use that ballpark to eliminate wrong options. Often only one option\nis anywhere near.</p><p><strong>Mental shortcuts to memorise:</strong></p><ul>\n<li><p>× 10, × 100, × 1000: shift the digits left 1, 2, 3 places (0.3 ×\n1000 = 300)</p></li>\n<li><p>× 5: multiply by 10, then halve (46 × 5 = 460 ÷ 2 = 230)</p></li>\n<li><p>× 9: multiply by 10, then subtract the number (37 × 9 = 370 − 37\n= 333)</p></li>\n<li><p>× 25: multiply by 100, then divide by 4 (64 × 25 = 6,400 ÷ 4 =\n1,600)</p></li>\n<li><p>× 11 for two digits: add the digits and put the total in the\nmiddle (43 × 11 = 4|7|3 = 473)</p></li>\n</ul><h3 id=\"worked-examples\">Worked examples</h3><ol type=\"1\">\n<li><p>Round 4,872 to the nearest hundred. The tens digit is 7 (5 or\nmore), so round up: <strong>4,900</strong>.</p></li>\n<li><p>Estimate 387 × 52. Round to 400 × 50 = <strong>20,000</strong>.\n(Exact: 20,124. Close enough to pick the right option.)</p></li>\n<li><p>Estimate 8,950 ÷ 31. Round to 9,000 ÷ 30 =\n<strong>300</strong>.</p></li>\n</ol><h3 id=\"read-and-watch\">Read and watch</h3><div class=\"vids\"><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/Gg-GD5QfbB4?rel=0\" title=\"Rounding to the nearest ten, hundred, thousand\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Rounding to the nearest ten, hundred, thousand <a href=\"https://www.youtube.com/watch?v=Gg-GD5QfbB4\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/IcmAxkEImtI?rel=0\" title=\"Rounding decimals\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Rounding decimals <a href=\"https://www.youtube.com/watch?v=IcmAxkEImtI\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/tx2Niw7aJJ8?rel=0\" title=\"Estimating multiplication\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Estimating multiplication <a href=\"https://www.youtube.com/watch?v=tx2Niw7aJJ8\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure></div><p class=\"vnote\">Videos: Khan Academy (free).</p><ul><li><p>Daily: 10 minutes of times tables to 12 (a free app such as Times\nTables Rock Stars or a printed grid).</p></li></ul>"}, {"id": "s1l2", "title": "Lesson 2 (Week 2): The four operations by hand", "html": "<h3 id=\"learn-1\">Learn</h3><p><strong>Order of operations (BODMAS):</strong> Brackets, Orders\n(powers and roots), Division and Multiplication (left to right),\nAddition and Subtraction (left to right). Division and multiplication\nhave equal rank, so work them left to right; the same applies to\naddition and subtraction.</p><p><strong>Long multiplication:</strong> split one number into tens and\nones, multiply each part, then add. 47 × 36 = (47 × 30) + (47 × 6) =\n1,410 + 282 = 1,692.</p><p><strong>Short division:</strong> divide digit by digit from the left,\ncarrying remainders. 756 ÷ 7: 7 into 7 is 1; 7 into 5 is 0 remainder 5;\n7 into 56 is 8. Answer: 108.</p><p><strong>Negative numbers:</strong></p><ul>\n<li><p>Adding a negative is subtracting: 5 + (−3) = 2</p></li>\n<li><p>Subtracting a negative is adding: 5 − (−3) = 8</p></li>\n<li><p>Same signs multiply or divide to a positive: (−6) × (−2) =\n12</p></li>\n<li><p>Different signs give a negative: (−12) ÷ 3 = −4</p></li>\n<li><p>On a number line, moving right is up, left is down: −5 + 8 =\n3</p></li>\n</ul><h3 id=\"worked-examples-1\">Worked examples</h3><ol type=\"1\">\n<li><p>8 + 4 × 3 = 8 + 12 = <strong>20</strong> (multiply\nfirst)</p></li>\n<li><p>(8 + 4) × 3 = 12 × 3 = <strong>36</strong> (brackets\nfirst)</p></li>\n<li><p>20 − 12 ÷ 4 × 2 = 20 − 3 × 2 = 20 − 6 = <strong>14</strong> (÷\nthen ×, left to right)</p></li>\n<li><p>A pallet holds 14 boxes of 36 tins. Tins = 14 × 36 = (10 × 36) +\n(4 × 36) = 360 + 144 = <strong>504</strong>.</p></li>\n</ol><h3 id=\"read-and-watch-1\">Read and watch</h3><div class=\"vids\"><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/ClYdw4d4OmA?rel=0\" title=\"Order of operations\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Order of operations <a href=\"https://www.youtube.com/watch?v=ClYdw4d4OmA\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/GOYnrYee1Y0?rel=0\" title=\"Multi-digit multiplication\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Multi-digit multiplication <a href=\"https://www.youtube.com/watch?v=GOYnrYee1Y0\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/8Ft5iHhauJ0?rel=0\" title=\"Long division\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Long division <a href=\"https://www.youtube.com/watch?v=8Ft5iHhauJ0\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/NQSN00zL5gg?rel=0\" title=\"Adding and subtracting negative numbers\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Adding and subtracting negative numbers <a href=\"https://www.youtube.com/watch?v=NQSN00zL5gg\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure></div><p class=\"vnote\">Videos: Khan Academy (free).</p>"}, {"id": "s1l3", "title": "Lesson 3 (Week 3): Fractions", "html": "<h3 id=\"learn-2\">Learn</h3><p>A fraction is a part of a whole: the <strong>denominator</strong>\n(bottom) says how many equal parts, the <strong>numerator</strong> (top)\nsays how many you have.</p><table>\n<colgroup>\n<col style=\"width: 27%\"/>\n<col style=\"width: 40%\"/>\n<col style=\"width: 32%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Task</th>\n<th>Rule</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Simplify</td>\n<td>Divide top and bottom by the same number</td>\n<td>18/24 ÷ 6 = 3/4</td>\n</tr>\n<tr class=\"even\">\n<td>Add or subtract</td>\n<td>Make the denominators the same first</td>\n<td>2/3 + 1/4 = 8/12 + 3/12 = 11/12</td>\n</tr>\n<tr class=\"odd\">\n<td>Multiply</td>\n<td>Top × top, bottom × bottom, then simplify</td>\n<td>3/5 × 10/9 = 30/45 = 2/3</td>\n</tr>\n<tr class=\"even\">\n<td>Divide</td>\n<td>Flip the second fraction and multiply</td>\n<td>3/4 ÷ 1/2 = 3/4 × 2/1 = 6/4 = 1½</td>\n</tr>\n<tr class=\"odd\">\n<td>Mixed numbers</td>\n<td>Convert to improper fractions first</td>\n<td>2¼ = 9/4</td>\n</tr>\n<tr class=\"even\">\n<td>Fraction of an amount</td>\n<td>Divide by the bottom, multiply by the top</td>\n<td>3/8 of 64 = 64 ÷ 8 × 3 = 24</td>\n</tr>\n<tr class=\"odd\">\n<td>Compare</td>\n<td>Cross-multiply</td>\n<td>5/8 vs 3/5: 5 × 5 = 25, 3 × 8 = 24, so 5/8 is bigger</td>\n</tr>\n</tbody>\n</table><h3 id=\"worked-examples-2\">Worked examples</h3><ol type=\"1\">\n<li><p><strong>A recipe uses 2/3 cup of sugar. You make half the\nrecipe.</strong> 1/2 × 2/3 = 2/6 = <strong>1/3 cup</strong>.</p></li>\n<li><p><strong>A tank is 2/5 full and holds 120 L. What is its full\ncapacity?</strong> 2/5 of the tank = 120 L, so 1/5 = 60 L, and the full\ntank = 5 × 60 = <strong>300 L</strong>.</p></li>\n<li><p><strong>Put 1/2, 3/8, 5/12 in order.</strong> A common\ndenominator of 24 gives 12/24, 9/24, 10/24, so the order is <strong>3/8,\n5/12, 1/2</strong>.</p></li>\n</ol><h3 id=\"read-and-watch-2\">Read and watch</h3><div class=\"vids\"><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/U2ovEuEUxXQ?rel=0\" title=\"Equivalent fractions\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Equivalent fractions <a href=\"https://www.youtube.com/watch?v=U2ovEuEUxXQ\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/TuId1spuyoc?rel=0\" title=\"Adding fractions with unlike denominators\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Adding fractions with unlike denominators <a href=\"https://www.youtube.com/watch?v=TuId1spuyoc\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/CTKMK1ZGLuk?rel=0\" title=\"Multiplying fractions\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Multiplying fractions <a href=\"https://www.youtube.com/watch?v=CTKMK1ZGLuk\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/f3ySpxX9oeM?rel=0\" title=\"Dividing fractions\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Dividing fractions <a href=\"https://www.youtube.com/watch?v=f3ySpxX9oeM\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure></div><p class=\"vnote\">Videos: Khan Academy (free).</p>"}, {"id": "s1l4", "title": "Lesson 4 (Week 4): Decimals and percentages", "html": "<h3 id=\"learn-3\">Learn</h3><p>\"Per cent\" means \"out of 100\". Fractions, decimals and percentages\nare three ways to write the same amount. Learn this table by heart:</p><table>\n<colgroup>\n<col style=\"width: 18%\"/>\n<col style=\"width: 9%\"/>\n<col style=\"width: 12%\"/>\n<col style=\"width: 9%\"/>\n<col style=\"width: 9%\"/>\n<col style=\"width: 9%\"/>\n<col style=\"width: 11%\"/>\n<col style=\"width: 9%\"/>\n<col style=\"width: 9%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Fraction</th>\n<th>1/2</th>\n<th>1/3</th>\n<th>1/4</th>\n<th>3/4</th>\n<th>1/5</th>\n<th>1/8</th>\n<th>1/10</th>\n<th>1/20</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Decimal</td>\n<td>0.5</td>\n<td>0.333…</td>\n<td>0.25</td>\n<td>0.75</td>\n<td>0.2</td>\n<td>0.125</td>\n<td>0.1</td>\n<td>0.05</td>\n</tr>\n<tr class=\"even\">\n<td>Percentage</td>\n<td>50%</td>\n<td>33⅓%</td>\n<td>25%</td>\n<td>75%</td>\n<td>20%</td>\n<td>12.5%</td>\n<td>10%</td>\n<td>5%</td>\n</tr>\n</tbody>\n</table><p><strong>Building any percentage in your head:</strong> 10% = divide\nby 10; 5% = half of 10%; 1% = divide by 100. So 35% of 80 = 30% (24) +\n5% (4) = 28.</p><p><strong>Percentage change</strong> = change ÷ original × 100. From 60\nto 75 is a change of 15, and 15 ÷ 60 = 0.25 = <strong>25%\nincrease</strong>.</p><p><strong>Multipliers</strong> are faster: increase by 20% = × 1.2;\ndecrease by 15% = × 0.85.</p><p><strong>Reverse percentages:</strong> after a 10% discount a price is\n$90. Then $90 is 90% of the original, so the original = 90 ÷ 0.9 =\n<strong>$100</strong>. (Not $99: a common trap.)</p><p><strong>Decimal multiplication:</strong> multiply as whole numbers,\nthen count the decimal places. 0.4 × 0.3: 4 × 3 = 12, two decimal\nplaces, so 0.12.</p><h3 id=\"worked-examples-3\">Worked examples</h3><ol type=\"1\">\n<li><p><strong>15% of 240</strong> = 10% (24) + 5% (12) =\n<strong>36</strong>.</p></li>\n<li><p><strong>A price rises 10%, then falls 10%. Is it back where it\nstarted?</strong> No. $100 × 1.1 = $110; $110 × 0.9 = $99. Net change\n<strong>−1%</strong>. STAT loves this trap.</p></li>\n<li><p><strong>4.8 ÷ 0.6</strong>: multiply both by 10 to get 48 ÷ 6 =\n<strong>8</strong>.</p></li>\n</ol><h3 id=\"read-and-watch-3\">Read and watch</h3><div class=\"vids\"><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/-gB1y-PMWfs?rel=0\" title=\"Percent, decimal and fraction conversions\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Percent, decimal and fraction conversions <a href=\"https://www.youtube.com/watch?v=-gB1y-PMWfs\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/E3OfSGjpDoI?rel=0\" title=\"Fraction to decimal\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Fraction to decimal <a href=\"https://www.youtube.com/watch?v=E3OfSGjpDoI\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/AjYil74WrVo?rel=0\" title=\"Percent word problem\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Percent word problem <a href=\"https://www.youtube.com/watch?v=AjYil74WrVo\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/gKywkLHV6Ko?rel=0\" title=\"Finding the whole from a percent\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Finding the whole from a percent <a href=\"https://www.youtube.com/watch?v=gKywkLHV6Ko\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure></div><p class=\"vnote\">Videos: Khan Academy (free).</p>"}, {"id": "s1l5", "title": "Lesson 5 (Week 5): Ratio, rate, proportion and units", "html": "<h3 id=\"learn-4\">Learn</h3><p><strong>Ratio</strong> compares parts of a whole. Simplify like a\nfraction: 24:36 = 2:3.</p><p><strong>Sharing in a ratio:</strong> add the parts, find one part,\nthen multiply. To share $120 in the ratio 3:5, there are 8 parts and one\npart is $15, so the shares are $45 and $75.</p><p><strong>Rate</strong> compares two different units: km per hour,\ndollars per kilogram. Divide to get a <strong>unit rate</strong> (per\n1).</p><p><strong>Direct proportion:</strong> both go up together. If 3 kg\ncosts $12, 1 kg costs $4, so 7 kg costs $28.</p><p><strong>Inverse proportion:</strong> one goes up, the other goes\ndown. If 4 workers take 6 days, the job is 24 worker-days, so 3 workers\ntake 24 ÷ 3 = 8 days.</p><p><strong>Speed, distance, time:</strong> distance = speed × time; time\n= distance ÷ speed; speed = distance ÷ time.</p><p><strong>Units to know:</strong> 1 km = 1,000 m; 1 m = 100 cm; 1 cm =\n10 mm; 1 L = 1,000 mL; 1 kg = 1,000 g; 1 h = 60 min. To turn km/h into\nm/s, multiply by 1,000 and divide by 3,600 (72 km/h = 20 m/s).</p><h3 id=\"worked-examples-4\">Worked examples</h3><ol type=\"1\">\n<li><p><strong>Best buy:</strong> 500 g for $3.50 or 750 g for $4.80?\nPer 100 g: $0.70 vs $0.64. The <strong>750 g pack</strong> is better\nvalue.</p></li>\n<li><p><strong>A car travels at 90 km/h for 2 hours 20 minutes.</strong>\n20 min = 1/3 h. Distance = 90 × 2⅓ = 180 + 30 = <strong>210\nkm</strong>.</p></li>\n<li><p><strong>Map scale 1:50,000. Two towns are 4 cm apart on the\nmap.</strong> 4 × 50,000 = 200,000 cm = 2,000 m = <strong>2\nkm</strong>.</p></li>\n</ol><h3 id=\"read-and-watch-4\">Read and watch</h3><div class=\"vids\"><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/HpdMJaKaXXc?rel=0\" title=\"Introduction to ratios\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Introduction to ratios <a href=\"https://www.youtube.com/watch?v=HpdMJaKaXXc\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/Zm0KaIw-35k?rel=0\" title=\"Unit rates\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Unit rates <a href=\"https://www.youtube.com/watch?v=Zm0KaIw-35k\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/4ywTWCaLmXE?rel=0\" title=\"Proportion word problem\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Proportion word problem <a href=\"https://www.youtube.com/watch?v=4ywTWCaLmXE\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/w0nqd_HXHPQ?rel=0\" title=\"Metric unit conversion\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Metric unit conversion <a href=\"https://www.youtube.com/watch?v=w0nqd_HXHPQ\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure></div><p class=\"vnote\">Videos: Khan Academy (free).</p>"}, {"id": "s1l6", "title": "Lesson 6 (Week 6): Algebra basics", "html": "<h3 id=\"learn-5\">Learn</h3><p>Algebra uses letters for numbers you don't know yet, or for numbers\nthat can change. STAT uses it mainly to state rules (\"cost = 4 + 2.5 ×\ndistance\") and to ask you to apply or rearrange them.</p><ul>\n<li><p><strong>Substitute:</strong> replace each letter with its number,\nthen follow BODMAS. If a = 3 and b = −2, then 2a + b² = 6 + 4 =\n10.</p></li>\n<li><p><strong>Collect like terms:</strong> only add terms with the same\nletter. 3x + 5y − x + 2y = 2x + 7y.</p></li>\n<li><p><strong>Expand brackets:</strong> multiply everything inside.\n3(2x − 4) = 6x − 12. Watch signs: −2(3 − y) = −6 + 2y.</p></li>\n<li><p><strong>Solve an equation:</strong> do the same thing to both\nsides until the letter is alone. Undo + and − first, then × and\n÷.</p></li>\n<li><p><strong>Rearrange a formula:</strong> the same idea, but the\nanswer is another formula.</p></li>\n</ul><h3 id=\"worked-examples-5\">Worked examples</h3><ol type=\"1\">\n<li><p><strong>Solve 4x − 7 = 13.</strong> Add 7: 4x = 20. Divide by 4:\n<strong>x = 5</strong>. Check: 4 × 5 − 7 = 13 ✓</p></li>\n<li><p><strong>Solve (x + 3) ÷ 2 = 8.</strong> Multiply by 2: x + 3 =\n16. Subtract 3: <strong>x = 13</strong>.</p></li>\n<li><p><strong>Rearrange v = u + at to make t the subject.</strong>\nSubtract u: v − u = at. Divide by a: <strong>t = (v − u) ÷\na</strong>.</p></li>\n<li><p><strong>A taxi charges a $4 flag fall plus $2.50 per km.</strong>\nCost C = 4 + 2.5d. If a trip costs $29: 2.5d = 25, so <strong>d = 10\nkm</strong>.</p></li>\n</ol><h3 id=\"read-and-watch-5\">Read and watch</h3><div class=\"vids\"><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/tC1SfxRvtmM?rel=0\" title=\"Evaluating an expression\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Evaluating an expression <a href=\"https://www.youtube.com/watch?v=tC1SfxRvtmM\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/3NHSwiv_pSE?rel=0\" title=\"Combining like terms and the distributive property\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Combining like terms and the distributive property <a href=\"https://www.youtube.com/watch?v=3NHSwiv_pSE\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/ewEorPD4kdA?rel=0\" title=\"Distributive property\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Distributive property <a href=\"https://www.youtube.com/watch?v=ewEorPD4kdA\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/XoEn1LfVoTo?rel=0\" title=\"Two-step equations\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Two-step equations <a href=\"https://www.youtube.com/watch?v=XoEn1LfVoTo\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/eTSVTTg_QZ4?rel=0\" title=\"Rearranging formulas\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Rearranging formulas <a href=\"https://www.youtube.com/watch?v=eTSVTTg_QZ4\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure></div><p class=\"vnote\">Videos: Khan Academy (free).</p>"}, {"id": "s1l7", "title": "Lesson 7 (Week 7): Graphs and tables", "html": "<h3 id=\"learn-6\">Learn</h3><p>About a third of STAT quantitative questions start from a table or\ngraph. Before calculating anything, run the <strong>TASK\ncheck</strong>:</p><ul>\n<li><p><strong>T</strong>itle: what is being measured?</p></li>\n<li><p><strong>A</strong>xes: what is on each axis, and in what\n<strong>units</strong> (thousands? percent? per year)?</p></li>\n<li><p><strong>S</strong>cale: does the axis start at zero? Are the gaps\neven? A cut-off axis exaggerates differences.</p></li>\n<li><p><strong>K</strong>ey: which line, bar or colour is\nwhich?</p></li>\n</ul><p><strong>Graph types:</strong> bar graphs compare categories; line\ngraphs show change over time; pie charts show parts of a whole; scatter\nplots show whether two things move together\n(<strong>correlation</strong>). On a distance–time graph, a flat section\nmeans not moving, and a steeper line means faster.</p><p><strong>Gradient (slope)</strong> = rise ÷ run. A line through (0, 2)\nand (4, 10) rises 8 over a run of 4, so its gradient is 2.</p><h3 id=\"worked-example\">Worked example</h3><p>Monthly units sold by a hardware store:</p><table>\n<colgroup>\n<col style=\"width: 19%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 16%\"/>\n<col style=\"width: 16%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Month</th>\n<th>Jan</th>\n<th>Feb</th>\n<th>Mar</th>\n<th>Apr</th>\n<th>May</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Units</td>\n<td>120</td>\n<td>150</td>\n<td>135</td>\n<td>180</td>\n<td>210</td>\n</tr>\n</tbody>\n</table><ol type=\"1\">\n<li><p><strong>Largest month-to-month increase?</strong> Mar to Apr:\n+45.</p></li>\n<li><p><strong>Mean monthly sales?</strong> Total 795 ÷ 5 =\n<strong>159</strong>.</p></li>\n<li><p><strong>Percentage growth Jan to May?</strong> (210 − 120) ÷ 120\n= 90 ÷ 120 = <strong>75%</strong>.</p></li>\n<li><p><strong>Which month fell?</strong> Only March (−15).</p></li>\n</ol><h3 id=\"read-and-watch-6\">Read and watch</h3><div class=\"vids\"><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/gnyHsgTFXIY?rel=0\" title=\"Reading bar charts\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Reading bar charts <a href=\"https://www.youtube.com/watch?v=gnyHsgTFXIY\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/36v2EXZRzUE?rel=0\" title=\"Reading line graphs\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Reading line graphs <a href=\"https://www.youtube.com/watch?v=36v2EXZRzUE\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/Jpbm5YgciqI?rel=0\" title=\"Scatter plots\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Scatter plots <a href=\"https://www.youtube.com/watch?v=Jpbm5YgciqI\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure><figure class=\"vid\"><div class=\"vframe\"><iframe loading=\"lazy\" src=\"https://www.youtube-nocookie.com/embed/CFSHq099Mx0?rel=0\" title=\"Slope from two points\" allow=\"accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen\" allowfullscreen></iframe></div><figcaption>Slope from two points <a href=\"https://www.youtube.com/watch?v=CFSHq099Mx0\" target=\"_blank\" rel=\"noopener\">Open on YouTube</a></figcaption></figure></div><p class=\"vnote\">Videos: Khan Academy (free).</p><ul><li><p>Habit: when a news article has a chart, run the TASK check and\nwrite one sentence on what it shows.</p></li></ul>"}, {"id": "s1l8", "title": "Lesson 8 (Week 8): Shape, averages and probability, plus the Phase 1 quiz", "html": "<h3 id=\"learn-7\">Learn</h3><table>\n<colgroup>\n<col style=\"width: 33%\"/>\n<col style=\"width: 66%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Shape fact</th>\n<th>Formula or rule</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rectangle</td>\n<td>Area = length × width; perimeter = 2 × (length + width)</td>\n</tr>\n<tr class=\"even\">\n<td>Triangle</td>\n<td>Area = ½ × base × height</td>\n</tr>\n<tr class=\"odd\">\n<td>Circle</td>\n<td>Area = πr²; circumference = 2πr (use π ≈ 3.14)</td>\n</tr>\n<tr class=\"even\">\n<td>Prism (box, cylinder)</td>\n<td>Volume = area of the end face × length</td>\n</tr>\n<tr class=\"odd\">\n<td>Angles</td>\n<td>Straight line 180°; triangle 180°; quadrilateral 360°; around a\npoint 360°</td>\n</tr>\n</tbody>\n</table><p><strong>Averages:</strong> the <strong>mean</strong> is the total\ndivided by the count; the <strong>median</strong> is the middle value\nonce sorted (the average of the middle two if there's an even count);\nthe <strong>mode</strong> is the most common value; the\n<strong>range</strong> is highest minus lowest. For 4, 7, 7, 9, 13: mean\n8, median 7, mode 7, range 9.</p><p><strong>Probability</strong> = favourable outcomes ÷ total outcomes,\nfrom 0 (impossible) to 1 (certain). On one die, P(even) = 3/6 = 1/2. For\ntwo coins, P(two heads) = 1/2 × 1/2 = 1/4.</p><h3 id=\"worked-example-1\">Worked example</h3><p><strong>The mean of four numbers is 12. A fifth number raises the\nmean to 13. What is it?</strong> The four numbers total 48; the five\ntotal 65. The fifth is <strong>17</strong>. (Working with totals is the\ntrick for most average questions.)</p><h3 id=\"phase-1-quiz-30-questions-45-minutes-no-calculator-target-24-or-more\">Phase\n1 quiz (30 questions, 45 minutes, no calculator; target 24 or more)</h3><ol type=\"1\">\n<li><p>Round 7,486 to the nearest hundred.</p></li>\n<li><p>9 + 6 × 3</p></li>\n<li><p>48 × 15</p></li>\n<li><p>1,512 ÷ 12</p></li>\n<li><p>−6 − 7</p></li>\n<li><p>3/4 + 1/6</p></li>\n<li><p>5/8 × 16</p></li>\n<li><p>2/3 ÷ 4/9</p></li>\n<li><p>Write 0.45 as a fraction in simplest form.</p></li>\n<li><p>20% of 350</p></li>\n<li><p>18 as a percentage of 72</p></li>\n<li><p>Increase $150 by 12%.</p></li>\n<li><p>After 30% off, an item costs $63. Original price?</p></li>\n<li><p>Share $200 in the ratio 3:7.</p></li>\n<li><p>How long does 450 km take at 90 km/h?</p></li>\n<li><p>4 L in mL</p></li>\n<li><p>Eight apples cost $6. What do 20 cost?</p></li>\n<li><p>If x = 3, find 4x² − x.</p></li>\n<li><p>Simplify 7m − 2n − 3m + 5n.</p></li>\n<li><p>Solve 6x − 5 = 31.</p></li>\n<li><p>Solve 3(x + 2) = 24.</p></li>\n<li><p>Rearrange P = 2l + 2w to make l the subject.</p></li>\n<li><p>Gradient of the line through (2, 1) and (6, 9)</p></li>\n<li><p>Mean of 6, 9, 10, 15</p></li>\n<li><p>Median of 11, 4, 9, 2, 7</p></li>\n<li><p>Area of a triangle with base 14 and height 9</p></li>\n<li><p>Volume of a 3 × 4 × 10 box</p></li>\n<li><p>A quadrilateral has angles 90°, 85°, 100° and x. Find x.</p></li>\n<li><p>A bag has 4 red and 6 white balls. P(red)?</p></li>\n<li><p>Estimate 49.7 × 20.3.</p></li>\n</ol><p><strong>Quiz answers:</strong> <strong>1</strong> 7,500 ·\n<strong>2</strong> 27 · <strong>3</strong> 720 · <strong>4</strong> 126\n· <strong>5</strong> −13 · <strong>6</strong> 11/12 · <strong>7</strong>\n10 · <strong>8</strong> 1½ · <strong>9</strong> 9/20 ·\n<strong>10</strong> 70 · <strong>11</strong> 25% · <strong>12</strong>\n$168 · <strong>13</strong> $90 · <strong>14</strong> $60 and $140 ·\n<strong>15</strong> 5 h · <strong>16</strong> 4,000 mL ·\n<strong>17</strong> $15 · <strong>18</strong> 33 · <strong>19</strong>\n4m + 3n · <strong>20</strong> 6 · <strong>21</strong> 6 ·\n<strong>22</strong> l = (P − 2w) ÷ 2 · <strong>23</strong> 2 ·\n<strong>24</strong> 10 · <strong>25</strong> 7 · <strong>26</strong> 63\n· <strong>27</strong> 120 · <strong>28</strong> 85° ·\n<strong>29</strong> 2/5 · <strong>30</strong> about 1,000</p><p>Score below 24? Redo the activities for the lessons where you dropped\nmarks, then retake the quiz a week later.</p>"}]}, {"id": "s2", "title": "Sub-course\n2: Reading, Vocabulary and Grammar (Weeks 1 to 8)", "intro": "", "lessons": [{"id": "s2l1", "title": "Lesson 1 (Weeks 1 to 8, daily): Active reading", "html": "<h3 id=\"learn\">Learn</h3><p>Passive reading lets words wash past. STAT rewards <strong>active\nreading</strong>: knowing, at the end of each paragraph, what it said\nand why it is there. Use the <strong>PRR method</strong> on everything\nyou read:</p><ol type=\"1\">\n<li><p><strong>Preview (30 seconds):</strong> read the title, the first\nparagraph and the last paragraph. Guess the writer's main\npoint.</p></li>\n<li><p><strong>Read with a pencil:</strong> after each paragraph, write\na 3 to 5 word note in the margin (\"cost argument\", \"example:\npensioner\"). Circle turn words: <em>but, however, yet, although,\nnevertheless</em>. What comes after a turn word is usually what the\nwriter really thinks.</p></li>\n<li><p><strong>Respond (2 sentences):</strong> \"The writer argues that…\"\nand \"Their attitude is… because…\"</p></li>\n</ol><h3 id=\"practice-extract-written-for-this-course\">Practice extract\n(written for this course)</h3><blockquote>\n<p><strong>The library question</strong></p>\n<p>When councils look for savings, the public library is often first in\nline. Its visitor numbers are modest beside a sports ground's, and much\nof what it lends can now be found online. Yet this reasoning mistakes\nwhat a library is for. A library is not chiefly a warehouse of books; it\nis one of the last indoor spaces where a person can stay for hours\nwithout being expected to buy anything.</p>\n<p>That function is easy to overlook because those who rely on it most\nare rarely the people who attend council meetings. A pensioner who reads\nthe papers each morning, a student whose home has no quiet room, a job\nseeker printing a résumé: none of these leaves much of a trace in a\nbudget report. Their visits are counted, but their reasons are not.</p>\n<p>Critics are right that libraries must change. Shelves of rarely\nborrowed titles cost money to house, and opening hours that end at five\nsuit few working people. But the answer to a library that serves its\ncommunity poorly is a better library, not no library. Towns that have\ncut theirs have rarely found that the people who used them simply moved\non to something else. More often, those people stayed home.</p>\n</blockquote><h3 id=\"reading-list\">Reading list</h3><p>Read 20 to 30 minutes a day. Mix short and long pieces.</p><table>\n<colgroup>\n<col style=\"width: 38%\"/>\n<col style=\"width: 48%\"/>\n<col style=\"width: 12%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Source</th>\n<th>Why</th>\n<th>Weeks</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>The Conversation (Australian edition)</td>\n<td>Academics writing plainly on science, health, society; strong\narguments</td>\n<td>1 onward</td>\n</tr>\n<tr class=\"even\">\n<td>ABC News Analysis and Opinion</td>\n<td>Australian issues, clear argument structure</td>\n<td>1 onward</td>\n</tr>\n<tr class=\"odd\">\n<td>SBS News features</td>\n<td>Social and cultural topics, close to STAT Part B themes</td>\n<td>1 onward</td>\n</tr>\n<tr class=\"even\">\n<td>Opinion columns in a major newspaper</td>\n<td>Practice spotting bias, tone and assumptions</td>\n<td>5 onward</td>\n</tr>\n<tr class=\"odd\">\n<td>One non-fiction book a month (popular science, history or\nmemoir)</td>\n<td>Builds stamina for long, dense passages</td>\n<td>5 onward</td>\n</tr>\n<tr class=\"even\">\n<td>A short poetry anthology from the local library</td>\n<td>STAT includes poems; get used to reading them slowly</td>\n<td>9 onward</td>\n</tr>\n</tbody>\n</table>"}, {"id": "s2l2", "title": "Lesson 2 (Weeks 1 to 8, 10 minutes daily): Vocabulary", "html": "<h3 id=\"learn-1\">Learn</h3><p>You don't need rare words. You need the words that signal <strong>how\nan argument moves</strong> and <strong>how a writer feels</strong>.\nThese two groups decide many STAT verbal answers.</p><p><strong>The flashcard system:</strong> front = the word; back = its\nmeaning plus a sentence you wrote yourself. Review new cards daily, then\nevery few days (Anki does the spacing for you). Add 5 new words a day\nfrom your reading.</p><h3 id=\"argument-words-learn-them-all\">Argument words (learn them\nall)</h3><table>\n<colgroup>\n<col style=\"width: 19%\"/>\n<col style=\"width: 34%\"/>\n<col style=\"width: 45%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Word</th>\n<th>What it signals</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>however, yet, but</td>\n<td>A turn: the next idea pushes against the last</td>\n<td>It is cheap. However, it breaks easily.</td>\n</tr>\n<tr class=\"even\">\n<td>therefore, thus, consequently</td>\n<td>A conclusion follows</td>\n<td>Costs rose; consequently, prices rose.</td>\n</tr>\n<tr class=\"odd\">\n<td>because, since</td>\n<td>A reason</td>\n<td>We left early since it was raining.</td>\n</tr>\n<tr class=\"even\">\n<td>although, despite, even though</td>\n<td>A concession: admits a point, then moves past it</td>\n<td>Despite the rain, the match went ahead.</td>\n</tr>\n<tr class=\"odd\">\n<td>whereas</td>\n<td>A contrast between two things</td>\n<td>Cats are independent, whereas dogs need company.</td>\n</tr>\n<tr class=\"even\">\n<td>moreover, furthermore</td>\n<td>More support for the same point</td>\n<td>It is fast. Moreover, it is cheap.</td>\n</tr>\n<tr class=\"odd\">\n<td>implies</td>\n<td>Suggests without saying directly</td>\n<td>His silence implied he agreed.</td>\n</tr>\n<tr class=\"even\">\n<td>assumes</td>\n<td>Takes for granted without proof</td>\n<td>The plan assumes prices will stay low.</td>\n</tr>\n<tr class=\"odd\">\n<td>undermines</td>\n<td>Weakens</td>\n<td>The new data undermines the theory.</td>\n</tr>\n<tr class=\"even\">\n<td>concedes</td>\n<td>Admits a point against yourself</td>\n<td>The minister conceded the plan had flaws.</td>\n</tr>\n<tr class=\"odd\">\n<td>asserts, contends</td>\n<td>States strongly as true</td>\n<td>She contends that tests are unfair.</td>\n</tr>\n<tr class=\"even\">\n<td>refutes</td>\n<td>Proves wrong</td>\n<td>The study refutes the earlier claim.</td>\n</tr>\n</tbody>\n</table><h3 id=\"tone-words-learn-them-all\">Tone words (learn them all)</h3><table>\n<colgroup>\n<col style=\"width: 26%\"/>\n<col style=\"width: 73%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Word</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>sceptical</td>\n<td>doubtful, not easily convinced</td>\n</tr>\n<tr class=\"even\">\n<td>ironic</td>\n<td>saying the opposite of what is meant, often for effect</td>\n</tr>\n<tr class=\"odd\">\n<td>sardonic</td>\n<td>mocking in a dry, bitter way</td>\n</tr>\n<tr class=\"even\">\n<td>sympathetic</td>\n<td>showing understanding of others' feelings</td>\n</tr>\n<tr class=\"odd\">\n<td>dismissive</td>\n<td>treating something as unworthy of attention</td>\n</tr>\n<tr class=\"even\">\n<td>cautious</td>\n<td>careful, avoiding strong claims</td>\n</tr>\n<tr class=\"odd\">\n<td>nostalgic</td>\n<td>fondly longing for the past</td>\n</tr>\n<tr class=\"even\">\n<td>ambivalent</td>\n<td>having mixed feelings</td>\n</tr>\n<tr class=\"odd\">\n<td>indignant</td>\n<td>angry at something unfair</td>\n</tr>\n<tr class=\"even\">\n<td>detached</td>\n<td>neutral, uninvolved</td>\n</tr>\n<tr class=\"odd\">\n<td>earnest</td>\n<td>sincere and serious</td>\n</tr>\n<tr class=\"even\">\n<td>wistful</td>\n<td>gently sad, longing</td>\n</tr>\n<tr class=\"odd\">\n<td>reverent</td>\n<td>deeply respectful</td>\n</tr>\n<tr class=\"even\">\n<td>condescending</td>\n<td>talking down to someone</td>\n</tr>\n<tr class=\"odd\">\n<td>optimistic</td>\n<td>hopeful</td>\n</tr>\n<tr class=\"even\">\n<td>resigned</td>\n<td>accepting something bad that can't be changed</td>\n</tr>\n</tbody>\n</table>"}, {"id": "s2l3", "title": "Lesson 3 (Weeks 1 to 2): Full sentences", "html": "<h3 id=\"learn-2\">Learn</h3><p>A sentence needs a <strong>subject</strong> (who or what) and a\n<strong>verb</strong> (what they do or are), and it must make sense on\nits own. <em>The bus arrived.</em> is a sentence. Two errors break this\nrule, and they are the most common errors in STAT essays.</p><p><strong>1. The fragment:</strong> a piece of a sentence punctuated as\nif it were whole.</p><ul>\n<li><p>✗ <em>Because the council cut the budget.</em> (Because what? It\ndoesn't stand alone.)</p></li>\n<li><p>✓ <em>The library closed because the council cut the\nbudget.</em></p></li>\n<li><p>✗ <em>For example, the new hospital in the city.</em> (No\nverb.)</p></li>\n<li><p>✓ <em>For example, the new hospital in the city opened two years\nlate.</em></p></li>\n</ul><p><strong>2. The run-on (and comma splice):</strong> two sentences\njammed together.</p><ul>\n<li><p>✗ <em>Technology helps students it can also distract\nthem.</em></p></li>\n<li><p>✗ <em>Technology helps students, it can also distract them.</em>\n(comma splice)</p></li>\n</ul><p><strong>Four ways to fix a run-on:</strong></p><table>\n<colgroup>\n<col style=\"width: 49%\"/>\n<col style=\"width: 50%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Fix</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Full stop</td>\n<td>Technology helps students. It can also distract them.</td>\n</tr>\n<tr class=\"even\">\n<td>Comma + and, but, or, so, yet</td>\n<td>Technology helps students, but it can also distract them.</td>\n</tr>\n<tr class=\"odd\">\n<td>Semicolon (two closely linked sentences)</td>\n<td>Technology helps students; it can also distract them.</td>\n</tr>\n<tr class=\"even\">\n<td>Linking word</td>\n<td>Although technology helps students, it can also distract them.</td>\n</tr>\n</tbody>\n</table><p><strong>The test:</strong> read each sentence aloud on its own. If it\nsounds unfinished, it's a fragment. If you need to take a breath in the\nmiddle where there's no full stop, it may be a run-on.</p>"}, {"id": "s2l4", "title": "Lesson 4 (Weeks 3 to 4): Punctuation", "html": "<h3 id=\"learn-3\">Learn</h3><p>Markers notice punctuation errors at once, and each one costs a\nlittle under \"expression, style and mechanics\". Master these rules and\nskip the rest.</p><p><strong>Capital letters:</strong> the start of every sentence; names\nof people, places, days, months, organisations (Monday, March,\nNewcastle, the Australian Government); and \"I\".</p><p><strong>Commas (the four uses that matter):</strong></p><ol type=\"1\">\n<li><p>Between items in a list: <em>buses, trains and\nferries</em></p></li>\n<li><p>After an opening phrase or clause: <em>After the meeting, we went\nhome.</em> / <em>However, the plan failed.</em></p></li>\n<li><p>Around extra information that could be removed: <em>My sister,\nwho lives in Perth, is a nurse.</em></p></li>\n<li><p>Before and, but, so, yet when they join two full sentences:\n<em>The rain stopped, so we went out.</em></p></li>\n</ol><p><strong>Apostrophes:</strong></p><table>\n<colgroup>\n<col style=\"width: 35%\"/>\n<col style=\"width: 27%\"/>\n<col style=\"width: 37%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Use</th>\n<th>Rule</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Missing letters</td>\n<td>The apostrophe goes where letters were removed</td>\n<td>do not → don't; it is → it's</td>\n</tr>\n<tr class=\"even\">\n<td>Ownership, one owner</td>\n<td>add 's</td>\n<td>the student's book</td>\n</tr>\n<tr class=\"odd\">\n<td>Ownership, plural ending in s</td>\n<td>add ' only</td>\n<td>the students' books</td>\n</tr>\n<tr class=\"even\">\n<td>Plural ownership, not ending in s</td>\n<td>add 's</td>\n<td>the children's toys</td>\n</tr>\n<tr class=\"odd\">\n<td>Plain plurals</td>\n<td><strong>no apostrophe</strong></td>\n<td>three cars (not car's), the 1990s</td>\n</tr>\n</tbody>\n</table><p><strong>The its/it's rule:</strong> it's = it is or it has.\n<em>Its</em> (no apostrophe) = belonging to it. <em>It's clear the\ncompany lost its way.</em></p><p><strong>Other often-confused pairs:</strong> there / their / they're;\nyour / you're; affect (verb) / effect (noun); then / than; lose /\nloose.</p><p><strong>Colon and semicolon (use sparingly):</strong> a colon\nintroduces a list or an explanation (<em>One thing matters:\nhonesty.</em>); a semicolon joins two closely linked full sentences\n(<em>She trained daily; it paid off.</em>).</p>"}, {"id": "s2l5", "title": "Lesson 5 (Weeks 5 to 6): Joining ideas and sentence variety", "html": "<h3 id=\"learn-4\">Learn</h3><p>Writing made only of short sentences sounds childish; writing made\nonly of long ones is hard to follow. Strong writers join ideas to show\n<strong>how they relate</strong>, and vary length for effect.</p><p><strong>Three kinds of joining word:</strong></p><table>\n<colgroup>\n<col style=\"width: 18%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 25%\"/>\n<col style=\"width: 31%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type</th>\n<th>Words</th>\n<th>Shows</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Equal joiners (use a comma before)</td>\n<td>and, but, or, so, yet</td>\n<td>addition, contrast, choice, result</td>\n<td>Fees rose, so enrolments fell.</td>\n</tr>\n<tr class=\"even\">\n<td>Dependent joiners</td>\n<td>because, although, while, unless, since, when, if, whereas</td>\n<td>cause, concession, time, condition, contrast</td>\n<td>Although fees rose, enrolments held steady.</td>\n</tr>\n<tr class=\"odd\">\n<td>Relative joiners</td>\n<td>who, which, that, where</td>\n<td>extra detail about a noun</td>\n<td>The policy, which began in 2020, has been reviewed.</td>\n</tr>\n</tbody>\n</table><p>When a dependent joiner starts the sentence, put a comma after its\nclause: <em>When the bell rang, the class left.</em></p><p><strong>Sentence variety:</strong></p><ul>\n<li><p>Mix lengths. A short sentence after two long ones lands with\nforce: <em>…and so the town waited, year after year, for a bridge that\nwas always promised. It never came.</em></p></li>\n<li><p>Vary openings. Don't start three sentences in a row with \"I\" or\n\"The\". Try a time phrase (<em>In 2019,</em>), a joiner\n(<em>Although…</em>) or an -ing phrase (<em>Looking\nback,</em>).</p></li>\n</ul><h3 id=\"worked-example\">Worked example</h3><p><strong>Before:</strong> I moved to a new city. I didn't know anyone.\nI joined a soccer team. I made friends. I felt at home.</p><p><strong>After:</strong> When I moved to a new city, I didn't know\nanyone. Joining a soccer team changed that: within a month I had made\nfriends, and the city began to feel like home.</p>"}, {"id": "s2l6", "title": "Lesson 6 (Weeks 7 to 8): The paragraph", "html": "<h3 id=\"learn-5\">Learn</h3><p>A body paragraph does one job: it makes <strong>one point</strong>\nand proves it. Use <strong>PEEL</strong>:</p><table>\n<colgroup>\n<col style=\"width: 14%\"/>\n<col style=\"width: 61%\"/>\n<col style=\"width: 24%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Part</th>\n<th>Job</th>\n<th>Length</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>P</strong>oint</td>\n<td>A topic sentence stating the paragraph's single idea</td>\n<td>1 sentence</td>\n</tr>\n<tr class=\"even\">\n<td><strong>E</strong>xplain</td>\n<td>Why or how the point is true</td>\n<td>1 to 2 sentences</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>E</strong>xample</td>\n<td>Specific evidence: a fact, a real case, a personal experience</td>\n<td>1 to 2 sentences</td>\n</tr>\n<tr class=\"even\">\n<td><strong>L</strong>ink</td>\n<td>Tie it back to the question or your overall view</td>\n<td>1 sentence</td>\n</tr>\n</tbody>\n</table><h3 id=\"model-paragraph-prompt-every-student-should-learn-a-trade-at-school.\">Model\nparagraph (prompt: \"Every student should learn a trade at school.\")</h3><blockquote>\n<p><strong>[P]</strong> Learning a trade at school would give every\nstudent a practical safety net. <strong>[E]</strong> Not everyone will\nfinish a degree, and those who leave school with only academic subjects\ncan find themselves qualified for nothing in particular. A basic\ngrounding in carpentry, electrics or hospitality offers a real skill and\na sense of competence. <strong>[E]</strong> A school leaver who has\nlearnt to build a deck or wire a light switch can find casual work\nalmost anywhere, and a qualified tradesperson can often out-earn a\ngraduate in their early working years. <strong>[L]</strong> For this\nreason alone, trade skills deserve a place beside maths and English in\nevery school.</p>\n</blockquote><h3 id=\"weak-versus-strong\">Weak versus strong</h3><p><strong>Weak:</strong> <em>Trades are good. Lots of people do trades.\nMy uncle is a plumber and he likes it. Schools should do trades because\nthey are useful and good.</em></p><p>What's wrong: the point is vague (\"good\"), nothing is explained, the\nexample isn't connected, and \"useful and good\" repeats the start without\nadding anything.</p><h3 id=\"activities-5\">Activities</h3><ol type=\"1\">\n<li><p>Label the four PEEL parts in this paragraph: <em>Public transport\nshould be free in our cities. Fares discourage the people who most need\nbuses and trains, such as students and pensioners, and push others into\ncars. When fares disappear, a family can cross town for nothing rather\nthan paying for petrol and parking. Free transport is therefore a fairer\nand greener choice.</em></p></li>\n<li><p>Rewrite the weak paragraph above using PEEL.</p></li>\n<li><p>Write one PEEL paragraph (120 to 160 words) for each prompt: a.\n\"Social media does more harm than good.\" (agree or disagree) b. \"A good\nfriend tells you the truth.\" (reflect on your own experience)</p></li>\n<li><p>Check each paragraph with the checklist below, then fix\nit.</p></li>\n</ol><p><strong>Paragraph checklist:</strong></p><ul class=\"task-list\">\n<li><p><label><input type=\"checkbox\"/>My first sentence states one\nclear point</label></p></li>\n<li><p><label><input type=\"checkbox\"/>I explain why, not just\nwhat</label></p></li>\n<li><p><label><input type=\"checkbox\"/>My example is specific (a name, a\nnumber, a real moment)</label></p></li>\n<li><p><label><input type=\"checkbox\"/>My last sentence links back to\nthe question</label></p></li>\n<li><p><label><input type=\"checkbox\"/>No fragments, run-ons or\napostrophe errors</label></p></li>\n</ul><details class=\"answers\"><summary>Show answers</summary><p><strong>Q1</strong> P: \"Public transport should be free…\" · E\n(explain): \"Fares discourage… push others into cars.\" · E (example):\n\"When fares disappear, a family can cross town…\" · L: \"Free transport is\ntherefore…\" · <strong>Q2 to Q4</strong> Have a tutor, a strong writer or\nan AI tutor mark them against the checklist.</p></details>"}]}, {"id": "s3", "title": "Sub-course\n3: Verbal and Critical Reasoning (Weeks 9 to 16)", "intro": "", "lessons": [{"id": "s3l1", "title": "Week 9: Main idea and purpose", "html": "<h3 id=\"learn\">Learn</h3><p>The <strong>main idea</strong> is the one claim the whole passage\nsupports. It is broader than any one paragraph but narrower than the\ngeneral topic. The <strong>purpose</strong> is why the writer wrote: to\nargue, explain, describe, criticise, warn, or compare.</p><p><strong>How to find it:</strong> write a 5-word summary of each\nparagraph, then ask: \"What single sentence do all of these back up?\"</p><p><strong>Wrong-answer traps for main-idea questions:</strong></p><table>\n<colgroup>\n<col style=\"width: 22%\"/>\n<col style=\"width: 77%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Trap</th>\n<th>What it looks like</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Too narrow</td>\n<td>A true detail from one paragraph</td>\n</tr>\n<tr class=\"even\">\n<td>Too broad</td>\n<td>The general topic, not the writer's claim</td>\n</tr>\n<tr class=\"odd\">\n<td>Distortion</td>\n<td>Uses the passage's words but changes the meaning</td>\n</tr>\n<tr class=\"even\">\n<td>Opposite</td>\n<td>States the view the writer argues against</td>\n</tr>\n</tbody>\n</table><h3 id=\"extract-a-written-for-this-course\">Extract A (written for this\ncourse)</h3><blockquote>\n<p>Cities are getting hotter faster than the countryside around them.\nRoads, roofs and car parks soak up the sun all day and release it at\nnight, so that a suburb of bare concrete can be several degrees warmer\nafter dark than a leafy one a few kilometres away.</p>\n<p>The obvious remedy is trees. A mature street tree shades the\npavement, cools the air through its leaves, and costs little once\nestablished. Yet many councils plant saplings only to watch them die\nwithin a few summers, because nobody is paid to water them.</p>\n<p>The lesson is not that tree planting fails, but that planting is the\ncheap part. A city that counts trees planted rather than trees surviving\nis measuring the wrong thing. If councils budgeted for five years of\ncare for every sapling, the shade they promise might actually\narrive.</p>\n</blockquote><h3 id=\"extra-practice\">Extra practice</h3><p>For three articles from your reading this week, write the main idea\nin one sentence and the purpose in one word. Check: would every\nparagraph support your sentence?</p>"}, {"id": "s3l2", "title": "Week 10: Words in context and tone", "html": "<h3 id=\"learn-1\">Learn</h3><p>STAT asks what a word or phrase means <strong>in this\npassage</strong>, not in the dictionary. Common words are often used in\nunusual senses.</p><p><strong>The swap test:</strong> cover the word, read the sentence,\nand predict a plain word that fits. Then pick the option closest to your\nprediction. Test it by putting it back into the sentence.</p><p><strong>Figurative language:</strong> a <strong>metaphor</strong>\nsays one thing <em>is</em> another (\"the shed was his kingdom\"); a\n<strong>simile</strong> uses <em>like</em> or <em>as</em>;\n<strong>irony</strong> says the opposite of what is meant;\n<strong>understatement</strong> makes something seem smaller than it is,\noften for effect (\"the flood was a bit of an inconvenience\").</p><p><strong>Tone</strong> comes from word choice. Compare:\n<em>frugal</em> (approving) vs <em>stingy</em> (disapproving) for the\nsame habit. Look for loaded words, exaggeration, and what the writer\nchooses to mention.</p><h3 id=\"extract-b-written-for-this-course\">Extract B (written for this\ncourse)</h3><blockquote>\n<p>My father's shed was his kingdom, and like most kingdoms it had laws\nthat were never written down. Tools hung in outlines he had painted on\nthe wall, so that an empty shape accused you the moment you walked in. I\nlearnt early that to borrow a hammer was to enter a contract.</p>\n<p>He has been gone six years. The outlines are still there, though most\nof them are empty now; my brother took the saws, a neighbour the drill.\nI go in sometimes and stand among the vacant shapes. It is, I suppose, a\nvery tidy kind of grief.</p>\n</blockquote><h3 id=\"extra-practice-1\">Extra practice</h3><p>In one article a day this week, underline three words with a strong\npositive or negative feel. Swap each for a neutral word and note how the\ntone changes.</p>"}, {"id": "s3l3", "title": "Week 11: Paraphrase", "html": "<h3 id=\"learn-2\">Learn</h3><p>A paraphrase says <strong>exactly the same thing in different\nwords</strong>: no more, no less, and no change in strength. STAT tests\nthis directly (\"Which of the following best expresses…?\") and\nindirectly, because correct answers are almost always reworded.</p><p><strong>Check every option against four tests:</strong></p><ol type=\"1\">\n<li><p><strong>Same scope?</strong> \"Some\" is not \"most\"; \"often\" is not\n\"always\"; \"may\" is not \"will\".</p></li>\n<li><p><strong>Same direction?</strong> Watch for reversed cause and\neffect: \"A causes B\" is not \"B causes A\".</p></li>\n<li><p><strong>Nothing added?</strong> An option that adds a reason or a\njudgement the original didn't give is wrong.</p></li>\n<li><p><strong>Nothing dropped?</strong> If the original has a condition\n(\"unless…\", \"only if…\"), the paraphrase must keep it.</p></li>\n</ol><p>Beware the option that <strong>reuses the original's exact\nwords</strong>. It is often a distortion dressed to look familiar.</p><h3 id=\"worked-example\">Worked example</h3><p><em>Original:</em> \"Few new businesses survive their first three\nyears without some outside investment.\"</p><ul>\n<li><p>(A) Most new businesses fail within three years. ✗ It drops\n\"without investment\".</p></li>\n<li><p>(B) New businesses that receive investment always survive. ✗ It\nadds \"always\" and reverses the logic.</p></li>\n<li><p><strong>(C) Without outside funding, most new businesses close\nwithin three years.</strong> ✓</p></li>\n<li><p>(D) Investors prefer businesses older than three years. ✗ New\nclaim.</p></li>\n</ul>"}, {"id": "s3l4", "title": "Week 12: Inference", "html": "<h3 id=\"learn-3\">Learn</h3><p>An <strong>inference</strong> is something the passage doesn't say\noutright but clearly supports. STAT inference answers sit on a\nladder:</p><table>\n<colgroup>\n<col style=\"width: 29%\"/>\n<col style=\"width: 36%\"/>\n<col style=\"width: 34%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Level</th>\n<th>Meaning</th>\n<th>STAT wording</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Stated</td>\n<td>Said directly</td>\n<td>\"According to the passage…\"</td>\n</tr>\n<tr class=\"even\">\n<td>Must be true</td>\n<td>Follows with certainty from what is said</td>\n<td>\"It can be concluded that…\"</td>\n</tr>\n<tr class=\"odd\">\n<td>Most strongly supported</td>\n<td>Probably true; best fits the evidence</td>\n<td>\"The passage suggests…\" / \"It is most likely that…\"</td>\n</tr>\n<tr class=\"even\">\n<td>Not supported</td>\n<td>Could be true in real life, but the text gives no grounds</td>\n<td>Usually a wrong answer</td>\n</tr>\n</tbody>\n</table><p><strong>Golden rule:</strong> use only the passage. An option that is\ntrue in the real world but not supported by the text is wrong. Prefer\nmodest options over sweeping ones.</p><h3 id=\"extract-c-written-for-this-course\">Extract C (written for this\ncourse)</h3><blockquote>\n<p>For ninety years the cannery was the reason Port Elwin existed. When\nit closed, the town's population fell by a third within a decade, and\nthe main street's shopfronts were boarded one by one.</p>\n<p>The recovery, when it came, was not planned. A Melbourne couple\nbought the old cannery for almost nothing and turned it into a weekend\nmarket. Within three years, the car park overflowed every Saturday. Two\ncafes and a bakery reopened on the main street, though all three still\nclose by midday on weekdays.</p>\n<p>Long-time residents are divided. Some welcome the visitors; others\ncomplain that the town now feels like a stage set. \"We used to make\nthings here,\" one former cannery worker said. \"Now we sell coffee to\npeople who come to look at where we made things.\"</p>\n</blockquote>"}, {"id": "s3l5", "title": "Week 13: Arguments, assumptions, strengthen and weaken", "html": "<h3 id=\"learn-4\">Learn</h3><p>An argument has a <strong>conclusion</strong> (what the writer wants\nyou to accept) and <strong>premises</strong> (the reasons). Conclusions\noften follow words like <em>therefore, so, thus, clearly, should</em>.\nPremises often follow <em>because, since, given that</em>.</p><p>An <strong>assumption</strong> is an unstated premise: something that\nmust be true for the reasoning to work, but which the writer never says.\n<strong>The negation test:</strong> if denying an option makes the\nargument collapse, that option is the assumption.</p><ul>\n<li><p>To <strong>strengthen:</strong> pick the option that supports the\nassumption or rules out another explanation.</p></li>\n<li><p>To <strong>weaken:</strong> pick the option that attacks the\nassumption or offers another explanation for the evidence.</p></li>\n</ul><p><strong>Common flaws:</strong> treating correlation as cause;\ngeneralising from a tiny or unusual sample; assuming that what was true\nbefore will stay true; attacking the person rather than the argument;\noffering only two choices when there are more.</p><h3 id=\"worked-example-1\">Worked example</h3><p><em>\"Students who eat breakfast get better marks. Therefore schools\nshould provide free breakfasts to raise results.\"</em></p><ul>\n<li><p>Conclusion: schools should provide breakfasts to raise\nresults.</p></li>\n<li><p>Premise: breakfast-eaters get better marks.</p></li>\n<li><p>Assumption: <strong>breakfast itself causes the better\nmarks</strong> (not, say, a more organised home).</p></li>\n<li><p>Weakener: \"Students who eat breakfast also tend to have parents\nwho help with homework.\"</p></li>\n<li><p>Strengthener: \"In a trial, students randomly given breakfast\nimproved more than those who weren't.\"</p></li>\n</ul>"}, {"id": "s3l6", "title": "Week 14: Poems, cartoons and dialogues", "html": "<h3 id=\"learn-5\">Learn</h3><p>STAT includes non-standard texts because they test the same skills in\na less familiar form. Approach each the same way: <strong>what is the\nsituation, what is the attitude, and what is the point?</strong></p><ul>\n<li><p><strong>Poems:</strong> read twice, once for sense and once\nslowly. Read to the punctuation, not the line endings. Ask what each\nimage is compared to, and what changes between the start and the\nend.</p></li>\n<li><p><strong>Cartoons:</strong> describe what you see (people, labels,\nobjects), then the caption. The humour usually comes from a mismatch\nbetween what is said and what is shown. That mismatch is the\npoint.</p></li>\n<li><p><strong>Dialogues:</strong> track each speaker's position\nseparately. Questions often ask what one speaker assumes, or where the\ntwo agree.</p></li>\n</ul><h3 id=\"poem-written-for-this-course\">Poem (written for this\ncourse)</h3><blockquote>\n<p><strong>Night Shift</strong></p>\n<p>The corridor hums its one long note,<br/>\nfluorescent, patient, sure of nothing.<br/>\nAt three a.m. the nurse counts breaths<br/>\nthe way her mother counted coins —<br/>\ncarefully, and as though<br/>\neach one might be the last she'd find.<br/>\nOutside, the city sleeps on credit,<br/>\nborrowing her wakefulness<br/>\nand never asking what it costs.</p>\n</blockquote><h3 id=\"cartoon-described-in-words\">Cartoon (described in words)</h3><blockquote>\n<p>A politician stands at a podium labelled <strong>\"Minister for\nLong-Term Planning\"</strong>. On the wall behind him hangs a large clock\nwith no hands. The caption reads: <em>\"We'll get to that\nshortly.\"</em></p>\n</blockquote><h3 id=\"dialogue-written-for-this-course\">Dialogue (written for this\ncourse)</h3><blockquote>\n<p><strong>Mia:</strong> The mechanic says the gearbox needs $3,000. The\ncar's only worth $4,000.<br/>\n<strong>Tom:</strong> So we'd be spending most of its value to keep\nit.<br/>\n<strong>Mia:</strong> But a new car means a loan, and we'd be paying it\noff for five years.<br/>\n<strong>Tom:</strong> Then the question isn't really the gearbox. It's\nwhether we trust this car to last another five years.</p>\n</blockquote>"}, {"id": "s3l7", "title": "Weeks 15 to 16: Mixed practice unit", "html": "<h3 id=\"how-to-use-this-unit\">How to use this unit</h3><ul>\n<li><p><strong>Week 15:</strong> do it untimed. Write a one-line reason\nfor every answer before checking.</p></li>\n<li><p><strong>Week 16:</strong> redo it (or a fresh unit from the\nofficial practice test) in <strong>12 minutes</strong>, about 1.7\nminutes per question.</p></li>\n<li><p>Log every miss in your error log by skill: main idea, words,\nparaphrase, inference, argument.</p></li>\n</ul><p>In the real test, correct answers are spread across A to D. Never\nguess from a pattern.</p><h3 id=\"unit-the-speed-of-notes-written-for-this-course\">Unit: The speed\nof notes (written for this course)</h3><blockquote>\n<p>In lecture halls, the laptop has all but replaced the notebook. The\nchange seems obviously sensible: most students type faster than they\nwrite, and a typed record is easier to search, share and keep. Yet a\nnumber of researchers have begun to ask whether speed is quite the\nvirtue it appears.</p>\n<p>Their argument turns on what note-taking is for. If its purpose is to\nproduce a complete record, the laptop wins easily. But if its purpose is\nto help a student understand and remember, a complete record may be the\nwrong goal. A fast typist can take down a lecturer's words almost\nverbatim without thinking about them at all. A slower writer cannot keep\nup, and so is forced to choose: to decide what matters, to compress it,\nto put it in their own words. That act of selection, the researchers\nsuggest, is where much of the learning happens.</p>\n<p>None of this means the laptop should be banned. Students with poor\nhandwriting or a disability may depend on it, and a typist who\ndeliberately summarises rather than transcribes may gain the same\nbenefits as a pen user. The tool, in other words, may matter less than\nthe habit. What the research questions is the assumption that faster\nmust mean better, an assumption that runs through far more of modern\nlife than the lecture hall.</p>\n</blockquote>"}]}, {"id": "s4", "title": "Sub-course 4:\nQuantitative Reasoning (Weeks 9 to 16)", "intro": "", "lessons": [{"id": "s4l1", "title": "Week 9: Reading data displays", "html": "<h3 id=\"learn\">Learn</h3><p>STAT quantitative units usually open with a table, graph or diagram\nand then ask 3 to 6 questions about it. Most mistakes come from\nmisreading, not from the arithmetic.</p><ul>\n<li><p><strong>Run the TASK check first</strong> (Sub-course 1, Lesson\n7): title, axes and units, scale, key.</p></li>\n<li><p><strong>Absolute vs relative:</strong> \"the largest fall\" (an\namount) and \"the largest percentage fall\" (relative to the start) often\ngive different answers. STAT tests this deliberately.</p></li>\n<li><p><strong>Dual-axis graphs:</strong> two lines can share a graph\nbut use different scales on the left and right. Check which axis each\nline belongs to.</p></li>\n<li><p><strong>Totals hide in percentages:</strong> 40% of a big group\ncan outnumber 60% of a small one.</p></li>\n</ul><h3 id=\"worked-unit\">Worked unit</h3><p>Water use (litres per person per day) in four towns:</p><table>\n<colgroup>\n<col style=\"width: 37%\"/>\n<col style=\"width: 31%\"/>\n<col style=\"width: 31%\"/>\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Town</th>\n<th>2022</th>\n<th>2024</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ashby</td>\n<td>240</td>\n<td>210</td>\n</tr>\n<tr class=\"even\">\n<td>Bree</td>\n<td>180</td>\n<td>189</td>\n</tr>\n<tr class=\"odd\">\n<td>Corin</td>\n<td>300</td>\n<td>255</td>\n</tr>\n<tr class=\"even\">\n<td>Dale</td>\n<td>200</td>\n<td>200</td>\n</tr>\n</tbody>\n</table><ol type=\"1\">\n<li><p><strong>Which town cut use by the largest percentage?</strong>\nAshby: 30 ÷ 240 = 12.5%. Corin: 45 ÷ 300 = 15%. <strong>Corin.</strong>\n(Corin also has the largest absolute fall here, but don't assume the two\nalways match.)</p></li>\n<li><p><strong>By what percentage did Bree's use change?</strong> +9 ÷\n180 = <strong>+5%</strong>.</p></li>\n<li><p><strong>Dale has 5,000 residents. Total daily use in\n2024?</strong> 5,000 × 200 = 1,000,000 L = <strong>1\nmegalitre</strong>.</p></li>\n<li><p><strong>Mean 2024 use across the four towns?</strong> (210 + 189\n+ 255 + 200) ÷ 4 = 854 ÷ 4 = <strong>213.5 L</strong>.</p></li>\n</ol>"}, {"id": "s4l2", "title": "Week 10: Percentages and rates in context", "html": "<h3 id=\"learn-1\">Learn</h3><p><strong>Percentage points vs per cent.</strong> If unemployment rises\nfrom 4% to 5%, that is a rise of <strong>1 percentage point</strong>,\nbut a <strong>25% increase</strong> (1 ÷ 4). STAT and news reports both\nexploit this difference.</p><p><strong>Absolute vs relative risk.</strong> A treatment cutting risk\nfrom 2% to 1% is a 1-point absolute fall, but a 50% relative fall.</p><p><strong>Compound change.</strong> Apply each change to the new\namount, not the original. A town of 10,000 growing 10% a year for 2\nyears: 10,000 × 1.1 × 1.1 = <strong>12,100</strong> (not 12,000).</p><p><strong>Rates make fair comparisons.</strong> Compare per person, per\n1,000, or per 100,000, not raw totals.</p><h3 id=\"worked-example\">Worked example</h3><p>Town A has 12 road crashes and 30,000 people; Town B has 20 crashes\nand 80,000 people. Per 10,000 people: A = 12 ÷ 3 = <strong>4</strong>; B\n= 20 ÷ 8 = <strong>2.5</strong>. Town B has more crashes, but Town A has\nthe higher rate.</p>"}, {"id": "s4l3", "title": "Week 11: Patterns and sequences", "html": "<h3 id=\"learn-2\">Learn</h3><p>When you meet a sequence, check these in order:</p><ol type=\"1\">\n<li><p><strong>Differences:</strong> subtract each term from the next.\nConstant difference = arithmetic sequence (3, 7, 11, 15: +4).</p></li>\n<li><p><strong>Differences of differences:</strong> if the gaps\nthemselves grow steadily (−5, −10, −15), the next gap follows that\npattern.</p></li>\n<li><p><strong>Ratios:</strong> divide each term by the one before.\nConstant ratio = geometric sequence (2, 6, 18: ×3).</p></li>\n<li><p><strong>Known families:</strong> squares (1, 4, 9, 16), cubes (1,\n8, 27), triangular numbers (1, 3, 6, 10, 15).</p></li>\n<li><p><strong>Two interleaved sequences:</strong> if nothing fits, look\nat every second term.</p></li>\n</ol><p><strong>Rule for an arithmetic sequence:</strong> nth term =\n(difference × n) + (first term − difference). For 3, 7, 11, 15: 4n − 1.\nThe 20th term is 79.</p><h3 id=\"worked-example-a-picture-pattern\">Worked example: a picture\npattern</h3><p>Squares made of matchsticks, in a row: 1 square needs 4 sticks; 2\nsquares need 7; 3 squares need 10. Each new square adds 3 sticks, so n\nsquares need <strong>3n + 1</strong>. Twenty squares need 3 × 20 + 1 =\n<strong>61</strong> sticks.</p>"}, {"id": "s4l4", "title": "Week 12: Formulas and invented symbols", "html": "<h3 id=\"learn-3\">Learn</h3><p>STAT often defines a brand-new rule (\"a ◆ b means a² − b\") or gives a\nreal-world formula, then asks you to apply it. No prior knowledge is\nneeded; the trick is careful substitution.</p><p><strong>Method:</strong></p><ol type=\"1\">\n<li><p>Rewrite the rule
